<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paperwork Desk</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=VT323&display=block" rel="stylesheet">
<style>
/* C. The Paperwork Desk -- high-fidelity run.
   One 1920x1080 stage, scaled uniformly to the window (Godot: canvas_items, expand).
   Type scale (px at 1920): 16 label/caption . 18 body/value . 22 heading . 30 title . display 40/64/96 (instruments only).
   ?state=1..6 draws the six states of fork/design/hifi/run-state.md; &check=1 adds a layout self-check. */
:root{
  --paper:#efe6d0; --paper-line:#c9d3d6;
  --ink:#24201b; --ink2:#4a4238; --print:#2c5a4d; --print-soft:#8fa89f;
  --red:#b02a22; --red-ink:rgba(176,42,34,.92);
  --plan:#8a5a0e; --plan-fill:#d9a441; --plan-fill2:#c78f2c;
  --op:#17605f; --op-fill:#3f9a96; --op-fill2:#2f8580;
  --manila:#d6b77c; --board-dk:#4a3420; --amber:#F6A800;
  --t-label:16px; --t-body:18px; --t-head:22px; --t-title:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#17100d}
body{font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#2b1f1c}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
img{display:block}
.ic{flex:none;border-radius:6px}
.ic.tile{background:radial-gradient(circle at 50% 40%,#3a4744,#141c1a);border:1px solid #55665f;padding:2px}
.i24{width:24px;height:24px}.i28{width:28px;height:28px}.i36{width:36px;height:36px}
.key{display:inline-block;font:700 var(--t-label)/20px "Courier Prime",monospace;padding:0 6px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap}
.lbl{font:600 var(--t-label)/20px "IBM Plex Sans Condensed";letter-spacing:1.5px;text-transform:uppercase}
.p{color:var(--plan);font-weight:700}.o{color:var(--op);font-weight:700}

/* ---------- the office (Pip's art) + the doom layer ---------- */
.art{position:absolute;inset:0;background:url(assets/office_wide_dawn.webp) center 40%/cover}
.art::before{content:"";position:absolute;inset:0;background:var(--wash)}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 72% 62% at 50% 44%,rgba(20,12,16,0) 38%,rgba(20,12,16,.6))}
.layer{position:absolute;pointer-events:none;z-index:1}
.grade{inset:0;background:rgba(30,8,32,.6);mix-blend-mode:multiply}
.tint{inset:0;background:rgba(110,30,90,.22);mix-blend-mode:color}
.dkgrade{position:absolute;left:0;top:846px;width:1920px;height:234px;z-index:3;pointer-events:none;background:rgba(70,30,80,.75);mix-blend-mode:multiply}
.sky{left:880px;top:250px;width:820px;height:340px;mix-blend-mode:overlay;
  background:radial-gradient(ellipse 48% 42% at 50% 48%,rgba(200,30,60,.95),rgba(150,30,110,.7) 55%,rgba(120,30,110,0) 100%)}
.skyglow{left:900px;top:280px;width:780px;height:280px;mix-blend-mode:screen;background:radial-gradient(ellipse 46% 40% at 50% 50%,rgba(150,30,80,.35),rgba(150,30,80,0) 100%)}
.mon{border-radius:50%;filter:blur(14px);mix-blend-mode:screen;background:radial-gradient(circle,rgba(150,70,200,.75),rgba(122,59,143,.35) 45%,rgba(122,59,143,0) 70%)}
.mon-tint{mix-blend-mode:color;border-radius:12px;filter:blur(10px);background:rgba(140,60,190,.85)}

/* ---------- wall instruments ---------- */
.wall{position:absolute;z-index:2}
.cal{left:48px;top:32px;width:156px;height:180px;background:var(--paper);box-shadow:3px 4px 0 rgba(0,0,0,.45);text-align:center}
.cal::before{content:"";position:absolute;left:72px;top:-6px;width:12px;height:12px;border-radius:50%;background:#9b9b9b;box-shadow:0 2px 2px rgba(0,0,0,.5)}
.cal-yr{height:36px;background:var(--red);color:#f6ece0;font:600 var(--t-head)/36px Oswald;letter-spacing:4px}
.cal-mo{margin-top:6px;font:700 64px/76px Oswald;color:var(--ink);letter-spacing:3px}
.cal-sub{margin-top:8px;color:var(--ink2)}
.acc{left:228px;top:48px;height:76px;padding:0 18px;display:flex;align-items:center;gap:20px;background:var(--paper);box-shadow:3px 4px 0 rgba(0,0,0,.45);transform:rotate(-.6deg)}
.acc::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#9b9b9b}
.acc .cell{display:flex;align-items:center;gap:8px}
.acc .lbl{display:block;color:var(--ink2);letter-spacing:1px}
.acc b{display:block;font:700 var(--t-head)/26px "Courier Prime";color:var(--ink);white-space:nowrap}
.acc b.neg{color:var(--red)}
.doom{left:800px;top:28px;width:400px;height:184px;padding:10px 18px;border-radius:6px;
  background:linear-gradient(180deg,#5d4a3a,#46372b);border:3px solid #2b2019;box-shadow:inset 0 1px 0 rgba(255,220,170,.25),3px 5px 0 rgba(0,0,0,.45)}
.doom-l{display:flex;align-items:center;gap:10px;font:600 var(--t-label)/28px Oswald;letter-spacing:3px;color:#f3e3c4}
.doom-scr{margin-top:6px;height:88px;border-radius:4px;border:2px solid #1f1612;position:relative;overflow:hidden;padding:0 18px;
  background:radial-gradient(ellipse at 50% 50%,var(--scr1,#4a2416),var(--scr2,#341a12) 75%);display:flex;align-items:center;justify-content:space-between}
.doom-scr::after,.doom-band::after{content:"";position:absolute;inset:0;background:url(assets/tex_amber_scanlines_512.webp);background-size:256px;opacity:.18;mix-blend-mode:screen;pointer-events:none}
.doom-v{font:400 96px/84px VT323;letter-spacing:3px;color:var(--doomc);text-shadow:0 0 14px var(--doomglow)}
.doom-dir{font:400 30px/30px VT323;letter-spacing:2px;color:var(--doomc);text-shadow:0 0 8px var(--doomglow);align-self:flex-end;margin-bottom:12px}
.doom-band{position:relative;overflow:hidden;margin-top:6px;height:34px;border-radius:3px;border:2px solid #1f1612;background:var(--scr2,#341a12);
  display:flex;align-items:center;justify-content:center;gap:14px;font:400 30px/30px VT323;letter-spacing:4px;color:var(--doomc);text-shadow:0 0 8px var(--doomglow)}
.doom-band small{font:600 var(--t-label)/20px "IBM Plex Sans Condensed";letter-spacing:2px;color:#cdb89a;text-shadow:none}
.rep{right:48px;top:32px;width:240px;height:180px;border-radius:6px;padding:12px 16px;
  background:linear-gradient(180deg,#e9dfc8,#d9ccb0);border:3px solid #6b5636;box-shadow:3px 5px 0 rgba(0,0,0,.45)}
.rep-top{display:flex;justify-content:space-between;align-items:center}
.rep-top .lbl{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.rep-v{font:700 40px/40px Oswald;color:var(--ink)}
.rep svg{display:block;margin:4px auto 0}

/* ---------- desk band and desk objects ---------- */
.dk{position:absolute;left:0;top:846px;width:1920px;height:234px;z-index:2;
  background:linear-gradient(180deg,rgba(30,18,10,.55),rgba(30,18,10,0) 26px),linear-gradient(rgba(122,88,52,.5),rgba(96,68,40,.6)),url(assets/tex_plywood_stained_512.webp);
  background-size:auto,auto,512px;box-shadow:0 -4px 12px rgba(0,0,0,.45)}
.dko{position:absolute;z-index:4}
.kbr{position:absolute;right:14px;bottom:12px}
/* card box */
.box{left:48px;top:836px;width:280px;height:216px}
.box .cards{position:absolute;left:26px;right:26px;top:0;height:48px}
.box .cards i{position:absolute;bottom:-8px;width:100%;height:44px;transform:rotate(-1.5deg);background:var(--paper);border-top:2px solid var(--red);box-shadow:0 -1px 0 rgba(0,0,0,.2)}
.box .cards i:nth-child(2){bottom:-14px;transform:rotate(1deg);background:var(--manila);border-top-color:var(--manila)}
.box .cards i:nth-child(3){bottom:-20px;transform:none}
.box .front{position:absolute;left:0;right:0;top:36px;bottom:0;border-radius:4px;padding:20px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#6e5034,#553b25);border:3px solid #34241a;box-shadow:3px 5px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,220,170,.25)}
.box .front .kbr{color:#f0e2c6}
.box.glow .front{box-shadow:0 0 0 4px var(--amber),0 0 26px 6px rgba(246,168,0,.65),3px 5px 0 rgba(0,0,0,.4)}
.box.locked .front{filter:saturate(.45) brightness(.78)}
.dkttl{display:flex;align-items:center;gap:10px}
.plate{display:inline-block;white-space:nowrap;font:700 var(--t-body)/30px Oswald;letter-spacing:2px;color:#2a1e0e;padding:0 12px;background:linear-gradient(180deg,#d1b06c,#a2823f);border:1px solid #5e4720;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,240,200,.6)}
.box .row{margin-top:18px;font:600 var(--t-body)/22px "IBM Plex Sans Condensed";color:#f0e2c6}
.box .sub{margin-top:6px;font:500 var(--t-label)/20px "IBM Plex Sans Condensed";color:#dccbaa}
/* schedule clipboard on the desk */
.clipb{left:356px;top:792px;width:356px;height:260px;border-radius:6px;background:#7a5a3a;border:3px solid var(--board-dk);box-shadow:3px 5px 0 rgba(0,0,0,.4)}
.clipb::before{content:"";position:absolute;left:50%;top:-10px;width:110px;height:26px;margin-left:-55px;border-radius:4px;background:linear-gradient(180deg,#c8ccd0,#8f969b);border:2px solid #5d6367;z-index:1}
.clipb .sh{position:absolute;left:12px;right:12px;top:18px;bottom:12px;background:var(--paper);padding:20px 16px 10px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.clipb .hd{display:flex;align-items:center;border-bottom:2px solid var(--print);padding-bottom:4px}
.clipb .hd b{font:700 var(--t-body)/22px Oswald;letter-spacing:1px;color:var(--print);text-transform:uppercase}
.clipb .kbr{color:var(--print)}
.hrow{margin-top:8px}
.hrow .l{display:flex;justify-content:space-between;align-items:baseline}
.hrow .l em{font:700 var(--t-label)/20px "Courier Prime";font-style:normal;color:var(--ink)}
.sboxes{margin-top:4px;display:flex;gap:3px}
.sbx{width:21px;height:18px;border:1.5px solid var(--print);background:rgba(255,255,255,.4)}
.sbx.pl{background:repeating-linear-gradient(135deg,var(--plan-fill) 0 4px,var(--plan-fill2) 4px 7px);border-color:var(--plan)}
.sbx.op{background:repeating-linear-gradient(135deg,var(--op-fill) 0 4px,var(--op-fill2) 4px 7px);border-color:var(--op)}
.days{margin-top:6px;display:flex;gap:2px}
.day{width:11px;height:16px;border:1px solid var(--print);background:rgba(255,255,255,.4)}
.day.done{background:var(--print)}
.day.now{background:var(--red);border-color:var(--red)}
.clipb .foot{margin-top:10px;font:400 var(--t-label)/20px "Courier Prime";color:var(--ink)}
/* shortcut objects */
.sc{width:180px;height:94px;padding:12px 14px;border-radius:3px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:3px 4px 0 rgba(0,0,0,.4)}
.sc .t{display:flex;align-items:center;gap:10px;font:700 var(--t-body)/22px Oswald;letter-spacing:.8px;text-transform:uppercase}
.sc .r{display:flex;justify-content:space-between;align-items:center;font:500 var(--t-label)/20px "IBM Plex Sans Condensed";white-space:nowrap}
.sc-staff{background:var(--manila);color:#2e2312}
.sc-upg{background:linear-gradient(90deg,#284a68 0 10px,#33608a 10px);color:#eef1f4}
.sc-led{background:linear-gradient(90deg,#1f3d2e 0 12px,#2f5a43 12px);color:#eae6d2}
.sc-gd{background:linear-gradient(90deg,#6a1f1a 0 12px,#8a2b23 12px);color:#f4e7dc}
/* the office cat (Pip's live cat photos, godot/assets/cats/simple) in a frame on the desk */
.cat{left:866px;top:858px;width:160px;height:188px;padding:12px 12px 0;border-radius:4px;
  background:linear-gradient(180deg,#5b3d24,#3e2916);border:2px solid #2a1b0f;box-shadow:3px 5px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,170,.25)}
.cat .ph{width:132px;height:132px;background:url(assets/cat_doom_cat_360.webp) center/cover;border:3px solid #e8dcc0;box-shadow:inset 0 0 10px rgba(0,0,0,.4)}
.cat .nm{margin:8px auto 0;width:96px;height:24px;border-radius:2px;background:linear-gradient(180deg,#d1b06c,#a2823f);border:1px solid #5e4720;
  font:600 var(--t-label)/22px "IBM Plex Sans Condensed";text-align:center;color:#2a1e0e}
.cat.eldritch{box-shadow:0 0 0 2px rgba(150,80,200,.7),0 0 34px 12px rgba(122,59,143,.8),0 0 80px 30px rgba(122,59,143,.45),3px 5px 0 rgba(0,0,0,.45)}
.cat.eldritch .ph{filter:saturate(.75) brightness(.8) hue-rotate(-12deg)}
.smoke{position:absolute;pointer-events:none;border-radius:50%;filter:blur(16px);background:radial-gradient(circle,rgba(170,120,210,.55),rgba(122,59,143,0) 70%)}
/* commit stamp (and its other faces) */
.stamp{right:48px;top:856px;width:280px;height:196px;border-radius:6px;padding:14px 16px;
  background:linear-gradient(180deg,#7a5230,#5b3b1f);border:3px solid #3b2612;box-shadow:3px 5px 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,220,170,.3)}
.stamp.top{z-index:7}
.face{height:120px;border-radius:3px;background:var(--red);display:flex;align-items:center;justify-content:center;gap:14px;
  box-shadow:inset 0 0 0 3px #e8c9b8,inset 0 0 0 6px var(--red),inset 0 0 0 8px #e8c9b8}
.face .t{font:700 28px/32px Oswald;letter-spacing:1.5px;color:#fbf1e6;text-transform:uppercase}
.face .t.sm{font-size:var(--t-head);line-height:26px;letter-spacing:.6px}
.face .s{display:block;font:600 var(--t-label)/20px "IBM Plex Sans Condensed";letter-spacing:0;text-transform:none;color:#f6efe4}
.face.grey{background:#6a6056;box-shadow:inset 0 0 0 3px #d9cfc0,inset 0 0 0 6px #6a6056,inset 0 0 0 8px #d9cfc0}
.face.go{background:#2f5a43;box-shadow:inset 0 0 0 3px #d9e4d2,inset 0 0 0 6px #2f5a43,inset 0 0 0 8px #d9e4d2}
.snote{margin-top:14px;display:flex;justify-content:space-between;align-items:center;font:600 var(--t-label)/20px "IBM Plex Sans Condensed";color:#f2e2c4}
.spd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.spd button{height:36px;border:2px solid #c9b48c;border-radius:3px;font:600 var(--t-label)/32px Oswald;letter-spacing:1px;color:#ecdcbf;text-align:center}
.spd button.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* ---------- layers above the desk ---------- */
.dim{position:absolute;inset:0;background:rgba(28,18,22,.55);z-index:5}
.dim.light{background:rgba(28,18,22,.3)}

/* advisor note (state 1, the tutorial's first step) */
.note{position:absolute;z-index:6;left:84px;top:470px;width:470px;padding:16px 22px 16px;background:#f3ecd8;transform:rotate(-1deg);
  box-shadow:4px 6px 0 rgba(0,0,0,.4);border-top:6px solid var(--amber)}
.note .lbl{color:var(--plan)}
.note p{margin-top:8px;font:400 var(--t-body)/26px "Courier Prime";color:var(--ink)}
.note .ft{margin-top:12px;display:flex;justify-content:flex-end}
.note .ft button{height:36px;padding:0 12px;border:1.5px solid var(--ink2);border-radius:3px;display:flex;align-items:center;gap:10px;font:600 var(--t-body)/20px "IBM Plex Sans Condensed"}
.penarrow{position:absolute;z-index:6;pointer-events:none}

/* action card drawer (state 2) */
.mn{position:absolute;left:48px;top:232px;width:1512px;height:824px;z-index:6;border-radius:8px;padding:16px 22px;
  background:linear-gradient(180deg,#4b3a2c,#3e3024);border:3px solid #2e2219;box-shadow:0 12px 0 rgba(0,0,0,.35),inset 0 2px 8px rgba(0,0,0,.4)}
.mn-hd{display:flex;align-items:center;gap:14px;height:44px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 var(--t-label)/20px "IBM Plex Sans Condensed";color:#ecdcbf;padding:5px 12px;border:1.5px solid rgba(236,220,191,.45);border-radius:3px;white-space:nowrap}
.chip b{font:700 var(--t-body)/20px "Courier Prime";color:#fff}
.chip b.neg{color:#ff9a86}
.mn .btn-x{background:var(--paper);border-color:transparent}
.ac-rows{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ac-row{display:flex;gap:14px;height:132px}
.ac-div{width:36px;flex:none;border-radius:3px;background:linear-gradient(90deg,#b9a27a,#a58c62);display:flex;align-items:center;justify-content:center}
.ac-div span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 var(--t-label)/1 "IBM Plex Sans Condensed";letter-spacing:2px;color:#2e2416;text-transform:uppercase;white-space:nowrap}
.ac-slots{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ac-slot{position:relative;min-width:0}
.card{position:relative;width:100%;height:132px;padding:16px 14px 10px;display:flex;flex-direction:column;background:var(--paper);border-radius:2px;box-shadow:1px 2px 0 rgba(0,0,0,.35);
  background-image:linear-gradient(var(--red) 0 0),repeating-linear-gradient(180deg,transparent 0 23px,var(--paper-line) 23px 24px);background-size:100% 2px,100% 100%;background-position:0 58px,0 60px;background-repeat:no-repeat}
.card>*{flex-shrink:0}
.card.folder{background:var(--manila);background-image:none;padding-top:24px;clip-path:polygon(0 0,34% 0,38% 18px,100% 18px,100% 100%,0 100%);box-shadow:none;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.35))}
.card.folder::before{content:"FOLDER";position:absolute;left:12px;top:0;font:700 var(--t-label)/18px "IBM Plex Sans Condensed";letter-spacing:1px;color:#5c4520}
.ac-top{display:flex;align-items:center;gap:10px;min-width:0}
.ac-name{min-width:0;font:600 var(--t-head)/26px "IBM Plex Sans Condensed";color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-cost{margin-top:8px;font:500 var(--t-body)/22px "IBM Plex Sans Condensed";color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.folder .ac-cost{font-weight:700;color:#5c4520}
.ac-desc{margin-top:2px;font:400 var(--t-label)/20px "IBM Plex Sans Condensed";color:var(--ink2)}
.ac-st{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.rstamp{display:inline-block;white-space:nowrap;font:600 var(--t-label)/19px Oswald;letter-spacing:.3px;text-transform:uppercase;color:var(--red-ink);border:2px solid var(--red-ink);padding:0 5px;border-radius:2px;transform:rotate(-1.5deg);background:rgba(239,230,208,.35)}
.rstamp.grey{color:#6a5d4c;border-color:#6a5d4c}
.onf{position:absolute;right:6px;top:-6px;z-index:2;font:700 var(--t-label)/20px "Courier Prime";color:#2f2f2f;padding:0 8px;background:#f6f1e4;border:1.5px solid #5c5c5c;border-radius:10px;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.ac-slot.focus::after{content:"";position:absolute;inset:-6px;border:3px solid var(--amber);border-radius:4px;box-shadow:0 0 12px rgba(246,168,0,.7);pointer-events:none;z-index:3}
.addk{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font:600 var(--t-label)/20px "IBM Plex Sans Condensed";color:var(--ink)}
.ac-empty{border:2px dashed rgba(236,220,191,.18);border-radius:3px}

/* the schedule: the clipboard, lifted off the desk (state 3) */
.board{position:absolute;left:48px;top:232px;width:1512px;height:824px;z-index:6;border-radius:8px;
  background:linear-gradient(180deg,#866343,#6e5034);border:3px solid var(--board-dk);box-shadow:0 12px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,170,.25)}
.clip{position:absolute;left:50%;top:-14px;width:150px;height:40px;margin-left:-75px;border-radius:6px;z-index:2;
  background:linear-gradient(180deg,#d4d8dc,#9aa1a6 60%,#7d8489);border:2px solid #4f5559;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.clip::after{content:"";position:absolute;left:52px;top:9px;width:42px;height:12px;border-radius:6px;background:#5d6367;box-shadow:inset 0 2px 2px rgba(0,0,0,.5)}
.sheet{position:absolute;left:14px;right:14px;top:14px;bottom:14px;padding:26px 32px 0 56px;
  background-color:var(--paper);
  background-image:linear-gradient(rgba(239,230,208,.88),rgba(239,230,208,.88)),url(assets/tex_grid_graphpaper_aged_512.webp);background-size:auto,512px;
  box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 0 60px rgba(120,90,40,.12)}

/* ---------------- wall ---------------- */
function wall(st){
  var cx=104,cy=82,r=68;
  function pt(f,rr){var a=Math.PI*(1-f);return [(cx+Math.cos(a)*rr).toFixed(1),(cy-Math.sin(a)*rr).toFixed(1)];}
  function arc(a0,a1,col){var p0=pt(a0,r),p1=pt(a1,r);return '<path d="M'+p0[0]+' '+p0[1]+' A'+r+' '+r+' 0 0 1 '+p1[0]+' '+p1[1]+'" stroke="'+col+'" stroke-width="8" fill="none"/>';}
  var ticks='';for(var t=0;t<=10;t++){var a=pt(t/10,r-12),b=pt(t/10,r+2);ticks+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#4a4238" stroke-width="'+(t%5?1.5:2.5)+'"/>';}
  var ang=Math.PI*(1-st.rep/100), n=[(cx+Math.cos(ang)*(r-8)).toFixed(1),(cy-Math.sin(ang)*(r-8)).toFixed(1)];

  var neg=st.research.charAt(0)=='-';
  var dv='--doomc:'+st.c+';--doomglow:'+(st.glow||st.c)+(st.scr1?';--scr1:'+st.scr1+';--scr2:'+st.scr2:'');
  return art(st)+
   '<div class="wall cal"><div class="cal-yr">'+st.yr+'</div><div class="cal-mo">'+st.mo+'</div><div class="cal-sub lbl">'+st.sub+'</div></div>'+

  function cell(k,l,v,bad){return '<span class="cell">'+ic(k,28)+'<span><span class="lbl">'+l+'</span><b'+(bad?' class="neg"':'')+'>'+v+'</b></span></span>';}
}

      var r=e.getBoundingClientRect();
      if(r.width&&(r.right>sr.right+1||r.bottom>sr.bottom+1||r.left<sr.left-1||r.top<sr.top-1)&&!e.closest('.art,.dk,.dim,.layer'))
        out.push('OFFSTAGE '+e.className+' '+Math.round((r.left-sr.left)/s)+','+Math.round((r.top-sr.top)/s)+' '+Math.round(r.width/s)+'x'+Math.round(r.height/s));
    });
    var objs=[].slice.call(stage.querySelectorAll('.wall,.dko:not(.smoke),.note,.memo,.tape,.rcpt'));
    var LAYER=/note|memo|tape|rcpt/;
    objs.forEach(function(x,i){objs.slice(i+1).forEach(function(y){var A=x.getBoundingClientRect(),B=y.getBoundingClientRect();
      if(!(LAYER.test(y.className)&&/dko/.test(x.className))&&A.left<B.right-1&&B.left<A.right-1&&A.top<B.bottom-1&&B.top<A.bottom-1) out.push('OVERLAP '+x.className+' / '+y.className);});});
    var pre=document.createElement('pre');pre.id='chk';pre.textContent='CHECK '+(out.length?out.join('\n'):'OK');document.body.appendChild(pre);
  });
}
})();
</script>
</body>
</html>
