<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
/* =====================================================================
   A. THE DESK -- high-fidelity pass.
   One 1920x1080 stage, scaled uniformly to the window (Godot:
   stretch mode canvas_items, aspect expand), so 1280x720 is the same
   layout at 2/3 size.
   ===================================================================== */
:root{
  /* type scale: the only five sizes on the page */
  --t1:16px; --t2:18px; --t3:22px; --t4:28px; --t5:40px;
  /* spacing unit */
  --u:8px;
  /* CRT phosphor (planning = amber, operating = teal) */
  --amber:#F6A800; --amber-hi:#ffd27a; --amber-soft:#E8A33D; --amber-dim:#9a6c26; --amber-faint:#5a4018;
  --op:#86C9BE; --op-hi:#c4ebe4; --op-dim:#3f6460;
  /* paper and brass */
  --ink:#2a2118; --ink-soft:#5a4a38; --paper:#eadfc6;
  --brass-hi:#d9c189; --brass-lo:#9e8452; --brass-edge:#6e5a32;
  --stamp:#a8261d; --teal-ink:#2f6a62;
  /* grounds */
  --void:#0E0614; --warm-panel:#2B221A; --warm-line:#3A2E22;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0a08}
body{font-family:"Share Tech Mono",monospace;color:#E9F2F2}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--warm-panel);transform-origin:0 0}
.abs{position:absolute}

/* ===== the room: Pip's office art is the home screen ===== */
.room-bg{position:absolute;inset:0;background:url(assets/office_wide_dawn.webp) center 46%/cover no-repeat}
.room-grade,.room-glow{position:absolute;inset:0;pointer-events:none}
.room-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(23,10,28,.34) 0%,rgba(23,10,28,0) 24%,rgba(20,12,8,0) 58%,rgba(20,12,8,.6) 88%)}
.desk{position:absolute;left:0;right:0;top:940px;bottom:0;
  background:linear-gradient(180deg,rgba(46,30,16,.35),rgba(16,10,5,.7)),url(assets/tex_plywood_stained.webp) 0 0/512px 512px,#4a3622;background-blend-mode:normal,multiply,normal}
.desk:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#3a2a1a,#8a6a44 40%,#8a6a44 60%,#3a2a1a)}
.dim{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 34% 50%,rgba(14,8,10,.62),rgba(14,8,10,.48) 70%)}

/* ===== shared hardware ===== */
.hw{border-radius:10px;background:linear-gradient(160deg,#4a4038,#2c2520);
  box-shadow:0 14px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.35)}
.hw:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(assets/tex_painted_metal_panel.webp) 0 0/512px;opacity:.10;mix-blend-mode:overlay}
.screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8d7f6c,#3b332b 70%);box-shadow:0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(0,0,0,.5)}
.screw:after{content:"";position:absolute;left:2px;right:2px;top:4px;height:2px;background:rgba(0,0,0,.55);transform:rotate(35deg)}
.plate{background:linear-gradient(var(--brass-hi),var(--brass-lo));color:#241a0c;font:700 var(--t2)/1 "Barlow Condensed",sans-serif;letter-spacing:2px;text-align:center;border-radius:2px;
  box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.plate.wi{display:flex;align-items:center;justify-content:center;gap:10px}
.key{display:inline-block;font:700 var(--t1)/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;border:2px solid currentColor;border-radius:3px;padding:2px 6px;min-width:26px;text-align:center}

/* icons: Pip's, always beside a label, one size per kind of place */
.ic{display:block;flex:none;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5)}
.ic-kb{width:32px;height:32px}
.ic-plate{width:24px;height:24px}

/* ===== wall instruments: P(Doom) dial, reputation meter ===== */
.dialw{left:1408px;top:40px;width:264px;height:264px}
.dial-plate{left:1460px;top:312px;width:160px;height:32px}
.repw{left:1700px;top:48px;width:172px;height:288px;padding:12px}
.rep-face{height:120px;border-radius:6px;overflow:hidden;background:linear-gradient(rgba(240,228,200,.95),rgba(222,206,170,.95));box-shadow:inset 0 0 0 2px #1d1814,inset 0 6px 14px rgba(0,0,0,.35)}
.rep-num{margin-top:12px;height:64px;border-radius:5px;background:linear-gradient(#2a1f12,#1f170d);display:flex;align-items:center;justify-content:center;
  font:400 var(--t5)/1 "Share Tech Mono",monospace;color:var(--amber);text-shadow:0 0 8px rgba(246,168,0,.45);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.rep-plate{margin-top:14px;height:32px;letter-spacing:1.5px}

/* ===== shortcut rack ===== */
.keys{left:1268px;top:612px;width:276px;height:428px;padding:18px;display:flex;flex-direction:column;gap:12px}
.kb{position:relative;z-index:1;height:46px;display:flex;align-items:center;gap:12px;padding:0 12px 0 8px;border-radius:3px;
  background:linear-gradient(var(--brass-hi),var(--brass-lo));color:#241a0c;font:700 var(--t2)/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;
  box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.kb .lab{flex:1}
.kb.on{background:linear-gradient(#ffd36b,#e09a10);box-shadow:0 0 0 3px var(--amber),0 0 18px rgba(246,168,0,.35),0 2px 3px rgba(0,0,0,.5)}
.kb.off{opacity:.45}

/* ===== Commit housing (never moves) ===== */
.cmt{left:1584px;top:612px;width:296px;height:428px}
.cmt-plate{position:absolute;z-index:1;left:20px;right:20px;top:20px;height:40px;line-height:40px;font-size:var(--t3);letter-spacing:2.5px}
.cmt-btn{position:absolute;z-index:1;left:53px;top:96px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#ffd36b,#f6a800 45%,#b97400 100%);
  box-shadow:0 0 0 10px #1c1713,0 0 0 13px var(--brass-edge),0 10px 20px rgba(0,0,0,.6),0 0 40px rgba(246,168,0,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#2a1a04}
.cmt-btn b{font:700 var(--t5)/1 "Barlow Condensed",sans-serif;letter-spacing:2px}
.cmt-btn .key{border-color:#2a1a04}
.cmt-note{position:absolute;z-index:1;left:16px;right:16px;top:326px;text-align:center;font:400 var(--t2)/1.35 "Share Tech Mono",monospace;color:#d8c6a6}
.cmt-note b{font-weight:400;color:var(--amber);text-shadow:0 0 6px rgba(246,168,0,.35)}

/* ===== CRT (the plan lives here) ===== */
.crt{isolation:isolate}
.crt-body{position:absolute;inset:0;border-radius:30px;background:linear-gradient(160deg,#4d433a,#2f2822 55%,#251f1a);
  box-shadow:0 22px 48px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.09),inset 0 -5px 0 rgba(0,0,0,.4)}
.crt-body:after{content:"";position:absolute;inset:0;border-radius:30px;background:url(assets/tex_bakelite_cracked.webp) 0 0/512px;opacity:.16;mix-blend-mode:overlay}
.crt-screen{position:absolute;border-radius:22px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 42%,#38270f 0%,#2b1e0c 52%,#1d1509 100%);
  box-shadow:inset 0 0 0 3px #15110d,inset 0 0 80px rgba(0,0,0,.7),0 0 0 7px #1b1612,0 0 0 9px #3d342b}
.crt-scan{position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.11) 2px 3px)}
.crt-glass{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse 70% 45% at 22% 8%,rgba(255,240,210,.06),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(0,0,0,.42) 100%)}
.crt-in{position:absolute;inset:0;z-index:2;color:var(--amber);text-shadow:0 0 6px rgba(246,168,0,.38)}
.crt-foot{position:absolute;display:flex;align-items:center;justify-content:space-between}
.crt-brand{font:700 var(--t1)/1 "Barlow Condensed",sans-serif;letter-spacing:3px;color:#a39686;display:flex;align-items:center;gap:12px}
.crt-led{width:10px;height:10px;border-radius:50%;background:#7fd07a;box-shadow:0 0 8px #7fd07a}

/* ===== PLAN screen (state 3): THE MONTH AHEAD ===== */
.bigcrt{left:56px;top:40px;width:1196px;height:1000px}
.p-in{padding:24px 34px;display:flex;flex-direction:column}
.p-head{display:flex;justify-content:space-between;align-items:baseline;height:52px;border-bottom:2px solid var(--amber-dim)}
.p-title{font-size:var(--t4);letter-spacing:4px}
.p-date{font-size:var(--t2);color:var(--amber-soft)}

/* Attention: filled = hours LEFT, empty = spent */
.att{display:grid;grid-template-columns:150px 300px 170px 1fr;align-items:center;row-gap:0;padding:12px 0 10px;border-bottom:1px dashed var(--amber-faint)}
.att>*{height:36px;display:flex;align-items:center}
.att .l{font-size:var(--t1);letter-spacing:2px;color:var(--amber-soft)}
.att .l.op{color:var(--op)}
.att .v{font-size:var(--t2);color:var(--amber-hi);justify-content:flex-end;padding-right:28px}
.att .v.op{color:var(--op-hi)}
.att .why{font-size:var(--t1);color:var(--amber-soft);gap:6px}
.att .why .o{color:var(--op)}
.pips{gap:4px}
.pip{width:18px;height:18px;border:2px solid var(--amber);background:var(--amber);box-shadow:0 0 6px rgba(246,168,0,.45)}
.pip.used{background:transparent;border-color:var(--amber-faint);box-shadow:none}
.pip.spill{background:repeating-linear-gradient(135deg,rgba(134,201,190,.55) 0 2px,transparent 2px 5px);border-color:var(--op);box-shadow:none}
.pip.o{border-radius:50%;border-color:var(--op);background:var(--op);box-shadow:0 0 6px rgba(134,201,190,.4)}
.pip.o.used{background:transparent;border-color:var(--op-dim);box-shadow:none}
.res-b{display:inline-block;width:30px;height:28px;line-height:24px;text-align:center;border:1px solid var(--amber-dim);color:var(--amber);font-size:var(--t2)}
.res{gap:12px;font-size:var(--t2);color:var(--amber-hi)}
.sys{grid-column:1 / -1;font-size:var(--t1);color:var(--amber-soft);gap:12px}
.sys .tag{margin-left:0}
.tag{display:inline-block;font:400 var(--t1)/22px "Share Tech Mono",monospace;padding:0 6px;border:1px solid var(--op);color:var(--op);text-shadow:0 0 5px rgba(134,201,190,.35);
  background:repeating-linear-gradient(135deg,rgba(134,201,190,.14) 0 2px,transparent 2px 5px)}

/* the queue: one row per play, each with its own order and remove targets */
.q-h,.q-row{display:grid;grid-template-columns:46px 296px 150px 214px 72px 140px 1fr;align-items:center}
.q-h{height:42px;padding-top:10px;font-size:var(--t1);letter-spacing:1.5px;color:var(--amber-dim);text-shadow:none;border-bottom:1px solid var(--amber-faint)}
.q-row{height:35px;font-size:var(--t2);border-bottom:1px solid rgba(138,98,36,.26)}
.q-row .n{color:var(--amber-soft)}
.q-row .k{color:var(--amber-soft)}
.q-row .k.top{color:var(--amber-dim)}
.q-row .op{color:var(--op)}
.q-row .pool{display:flex;align-items:center;gap:10px}
.q-row .dash{color:var(--amber-dim)}
.q-ctl{display:flex;justify-content:flex-end;gap:8px}
.q-ctl b{font-weight:400;width:30px;height:26px;line-height:24px;text-align:center;border:1px solid var(--amber-dim);color:var(--amber-soft);font-size:var(--t1)}
.q-ctl b.na{border-color:var(--amber-faint);color:var(--amber-faint);text-shadow:none}
.q-row.spillrow{background:linear-gradient(90deg,rgba(134,201,190,.07),rgba(134,201,190,0) 70%)}
.q-tools{display:flex;justify-content:space-between;align-items:center;height:56px}
.q-btn{display:inline-block;border:1px solid var(--amber-dim);padding:5px 14px;font-size:var(--t2);color:var(--amber);margin-right:12px}
.q-tot{font-size:var(--t2);color:var(--amber-hi)}
.q-tot span{color:var(--amber-soft)}

/* at Commit: what the plan will leave */
.ac{margin-top:auto;border:1px solid var(--amber-dim);display:grid;grid-template-columns:190px 340px 1fr 1fr;height:96px;position:relative}
.ac>div{padding:16px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ac>div+div{border-left:1px dashed var(--amber-faint)}
.ac .h{font-size:var(--t1);letter-spacing:2px;color:var(--amber-soft)}
.ac .t{font-size:var(--t3);letter-spacing:3px;color:var(--amber)}
.ac .b{font-size:var(--t3);color:var(--amber-hi);white-space:nowrap}
.ac .b em{font-style:normal;color:var(--amber-soft)}
.ac .s{font-size:var(--t1);color:var(--amber-soft)}

.rq{display:flex;align-items:center;gap:12px}
.rq-label{font:700 var(--t1)/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;color:#cbbda8}
.rq-sw{display:flex;background:#1b1612;border-radius:6px;padding:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.rq-sw span{font:600 var(--t1)/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;color:#a39686;padding:9px 14px;border-radius:4px;min-width:92px;text-align:center}
.rq-sw span.on{background:linear-gradient(#d9b56a,#a8823e);color:#21180c}
.esc-plate{font:700 var(--t1)/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;color:#cbbda8;border:2px solid var(--brass-edge);border-radius:4px;padding:8px 14px;display:flex;gap:8px;align-items:center}
.esc-plate .key{border-color:#8f7a52;color:#e0d2b6}

/* self-check output (only with ?check=1) */
#check{position:fixed;left:0;top:0;z-index:99;background:#000;color:#0f0;font:12px monospace;white-space:pre;max-height:100vh;overflow:auto}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
var Q = new URLSearchParams(location.search);
var STATE = String(Q.get("state") || "3");

/* ------------------------------------------------------------------
   Scale the 1920x1080 stage uniformly to the window.
   ------------------------------------------------------------------ */
var S = document.getElementById("stage");
function fit(){
  var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  var x = (window.innerWidth - 1920*s)/2, y = (window.innerHeight - 1080*s)/2;
  S.style.transform = "translate("+x+"px,"+y+"px) scale("+s+")";
  S.dataset.scale = s;
}
fit(); window.addEventListener("resize", fit);

/* ------------------------------------------------------------------
   THE RUN (fork/design/hifi/run-state.md). One company, one month.
   ------------------------------------------------------------------ */
// November 2017 queue (state 3). [play, where it lives ("" = top level), pool, hours, money, reputation]
var NOV_QUEUE = [
  ["Hire: Safety Researcher","Hire Staff","plan",1,60000,0],
  ["Read the Literature","Scouting","plan",1,0,0],
  ["Read the Literature","Scouting","plan",1,0,0],
  ["Post Online","Scouting","plan",1,0,0],
  ["Safety Audit","","op",2,40000,0],
  ["Work Your Connections","","op",2,0,6],
  ["Go to Meetups","Scouting","op",1,300,0],
  ["Networking","Publicity","op",1,0,0],
  ["Tour Offices","Office","op",1,0,0],
  ["Office Maintenance","Operations","op",1,5000,0],
  ["Order Office Supplies","Operations","op",1,2000,0]
];
var NOV = { month:"NOVEMBER", year:"2017", date:"Wed 1 Nov 2017", money:140000, compute:65, research:-12, papers:0,
  rep:32, doom:40.2, band:"HIGH", trend:"rising", artBand:1, planTotal:12, opTotal:8, reserve:0 };

/* Book the queue the way the game does (month_plan.gd _debit_hours): each play
   bills its own pool; operating work past the operating hours spills into
   planning hours; planning work never uses operating hours. */
function book(d, queue){
  var opLeft = d.opTotal, plan = 0, spill = 0, money = 0, rep = 0;
  var rows = queue.map(function(r){
    var row = {name:r[0], from:r[1], pool:r[2], hrs:r[3], money:r[4], rep:r[5], spill:0};
    if (r[2] === "op"){ var fromOp = Math.min(r[3], opLeft); opLeft -= fromOp; row.spill = r[3]-fromOp; spill += row.spill; }
    else plan += r[3];
    money += r[4]; rep += r[5];
    return row;
  });
  var p = {}; for (var k in d) p[k] = d[k];
  p.rows = rows; p.planWork = plan; p.opWork = d.opTotal - opLeft + spill; p.spill = spill;
  p.planLeft = d.planTotal - plan - spill; p.opLeft = opLeft;
  p.qMoney = money; p.qRep = rep;
  p.held = p.planLeft + p.opLeft;           // untyped; unspent remainder (+ explicit reserve, 0 here)
  p.moneyAfter = d.money - money; p.repAfter = d.rep - rep;
  return p;
}

/* ------------------------------------------------------------------
   Icons (Pip's, godot/assets/icons/; "new_" = new, needs art)
   ------------------------------------------------------------------ */
var I = "assets/icons/";
var ICON = {
  "ACTIONS":I+"ui_guide_actions_64.png", "PLAN":I+"ui_config_date_64.png", "STAFF":I+"ui_staff_management_64.png",
  "UPGRADES":I+"button_upgrade_normal_64.png", "LEDGER":I+"ui_budget_finance_64.png", "IN-TRAY":I+"new_inbox_tray.svg",
  "GUIDE":I+"ui_guide_book_64.png",
  "P(DOOM)":I+"doom.png", "REPUTATION":I+"reputation.png", "MONEY":I+"money.png"
};
function ic(key, cls){ return ICON[key] ? '<img class="ic '+cls+'" src="'+ICON[key]+'" alt="">' : ""; }

/* ------------------------------------------------------------------
   helpers
   ------------------------------------------------------------------ */
function el(tag, cls, html, style){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; if(style) e.setAttribute("style",style); return e; }
function add(e, parent){ (parent||S).appendChild(e); return e; }
function money(n){ return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US"); }
function pad2(n){ return String(n).padStart(2,"0"); }
function screws(box, inset){
  [[inset,inset],[null,inset],[inset,null],[null,null]].forEach(function(p){
    var s = el("i","screw"); s.style.left = p[0]==null ? "auto" : p[0]+"px"; s.style.right = p[0]==null ? inset+"px" : "auto";
    s.style.top = p[1]==null ? "auto" : p[1]+"px"; s.style.bottom = p[1]==null ? inset+"px" : "auto"; box.appendChild(s);
  });
}

/* ------------------------------------------------------------------
   The room and its doom layer ("doom is a layer, not a repaint":
   one ambient grade + one glow source; the room keeps its shape).
   ------------------------------------------------------------------ */
var DOOM_LAYER = {
  0:{ grade:"rgba(246,168,0,.05)", glow:"radial-gradient(ellipse 260px 180px at 1392px 486px,rgba(246,168,0,.16),transparent 70%)" },
  1:{ grade:"rgba(233,117,46,.09)", glow:"radial-gradient(ellipse 280px 190px at 1392px 486px,rgba(233,117,46,.22),transparent 70%)" }
};
function room(d){
  var L = DOOM_LAYER[d.artBand] || DOOM_LAYER[0];
  add(el("div","room-bg"));
  add(el("div","room-grade",null,"background:"+L.grade+";mix-blend-mode:screen"));
  add(el("div","room-glow",null,"background:"+L.glow+";mix-blend-mode:screen"));
  add(el("div","room-shade"));
  add(el("div","desk"));
}

/* P(Doom) dial: level and band only, never a delta (ADR-0015) */
function doomDial(d){
  var cx=159, cy=150, R=126, start=-225, sweep=270;
  function pt(v,r){ var a=(start + sweep*v/100)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  function arc(v0,v1,r){ var p0=pt(v0,r), p1=pt(v1,r); var large=(sweep*(v1-v0)/100)>180?1:0; return "M"+p0[0].toFixed(1)+" "+p0[1].toFixed(1)+" A"+r+" "+r+" 0 "+large+" 1 "+p1[0].toFixed(1)+" "+p1[1].toFixed(1); }
  // DOOM_STATUS_BANDS (theme_manager.gd): NOMINAL <15, ELEVATED <37, HIGH <52, SEVERE <67, EXTREME <80, CATASTROPHIC <92, TERMINAL
  var bands=[[0,15,"#3F8A5C"],[15,37,"#F6A800"],[37,52,"#E9752E"],[52,67,"#E24A3B"],[67,80,"#B31217"],[80,92,"#7a1418"],[92,100,"#3b0a10"]];
  var s='<svg viewBox="-4 -6 326 326" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="face" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#efe3c6"/><stop offset="1" stop-color="#cdbb93"/></radialGradient>'+
    '<linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7448"/><stop offset=".5" stop-color="#5c4a2a"/><stop offset="1" stop-color="#3a2e1a"/></linearGradient></defs>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="150" fill="#241e19" stroke="url(#bezel)" stroke-width="6"/><circle cx="'+cx+'" cy="'+cy+'" r="138" fill="url(#face)"/>';
  bands.forEach(function(b){ s+='<path d="'+arc(b[0],b[1],R-24)+'" stroke="'+b[2]+'" stroke-width="12" fill="none"/>'; });
  for (var v=0; v<=100; v+=5){ var a=pt(v,R-32), b2=pt(v,R-(v%25===0?46:38)); s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b2[0].toFixed(1)+'" y2="'+b2[1].toFixed(1)+'" stroke="#2a2118" stroke-width="'+(v%25===0?3:1.5)+'"/>'; }

  s+='<rect x="'+(cx-62)+'" y="'+(cy+28)+'" width="124" height="44" rx="5" fill="#21180d" stroke="#6e5a32" stroke-width="2"/>';
  s+='<text x="'+cx+'" y="'+(cy+61)+'" text-anchor="middle" font-family="Share Tech Mono" font-size="28" fill="#F6A800">'+d.doom.toFixed(1)+'%</text>';
  s+='<text x="'+cx+'" y="'+(cy+98)+'" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="18" letter-spacing="1.5" fill="#2a2118">'+d.band+(d.trend?' &#183; '+d.trend:'')+'</text>';
  var n=pt(d.doom,R-30), tl=pt(d.doom+50,16);
  s+='<line x1="'+tl[0].toFixed(1)+'" y1="'+tl[1].toFixed(1)+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'" stroke="#8c1d12" stroke-width="5" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="11" fill="#3a2e22" stroke="#b89a5e" stroke-width="3"/>';
  s+='<ellipse cx="'+(cx-40)+'" cy="'+(cy-70)+'" rx="80" ry="34" fill="#fff" opacity=".07"/></svg>';
  var w=document.createElement("div"); w.innerHTML=s; var svg=w.firstChild; svg.setAttribute("class","abs dialw"); add(svg);
  add(el("div","abs plate wi dial-plate",ic("P(DOOM)","ic-plate")+"<span>P(DOOM)</span>"));
}
function repMeter(d){
  var r = add(el("div","abs hw repw"));
  var face = el("div","rep-face"); r.appendChild(face);
  var cx=74, cy=104, R=84;
  function pt(v,rr){ var a=(-160 + 140*v/100)*Math.PI/180; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; }
  var s='<svg width="148" height="120" viewBox="0 0 148 120" xmlns="http://www.w3.org/2000/svg">';
  var a0=pt(0,R-30), a1=pt(5,R-30);   // reputation 0 ends the run (game_state.gd); the mark's width is drawn, not a threshold
  s+='<path d="M'+a0[0].toFixed(1)+' '+a0[1].toFixed(1)+' A'+(R-30)+' '+(R-30)+' 0 0 1 '+a1[0].toFixed(1)+' '+a1[1].toFixed(1)+'" stroke="#a8261d" stroke-width="8" fill="none"/>';
  for (var v=0; v<=100; v+=10){ var p=pt(v,R-36), q=pt(v,R-(v%50===0?50:44)); s+='<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#2a2118" stroke-width="'+(v%50===0?3:1.5)+'"/>'; }
  [0,50,100].forEach(function(v){ var p=pt(v,R-18); s+='<text x="'+(v===0?8:v===100?140:p[0]).toFixed(1)+'" y="'+(v===50?p[1]+6:p[1]+22).toFixed(1)+'" text-anchor="'+(v===0?'start':v===100?'end':'middle')+'" font-family="Barlow Condensed" font-weight="700" font-size="16" fill="#2a2118">'+v+'</text>'; });
  var n=pt(d.rep,R-38);
  s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'" stroke="#2a2118" stroke-width="3"/><circle cx="'+cx+'" cy="'+cy+'" r="7" fill="#3a2e22"/></svg>';
  face.innerHTML = s;
  r.appendChild(el("div","rep-num",String(Math.round(d.rep))));

/* the shortcut rack: every menu, one labelled plate each, with its key */
var SHORTCUTS = [["ACTIONS","A"],["PLAN","P"],["STAFF","E"],["UPGRADES","U"],["LEDGER","L"],["IN-TRAY","R"],["GUIDE","F1"]];
function shortcutRack(active, list){
  var k = add(el("div","abs hw keys"));
  (list||SHORTCUTS).forEach(function(s){
    k.appendChild(el("div","kb"+(active===s[0]?" on":"")+(s[2]?" off":""),ic(s[0],"ic-kb")+"<span class=lab>"+s[0]+"</span><span class=key>"+s[1]+"</span>"));
  });
}
/* Commit: same place in every PLAN view. Its Enter shows only when no menu owns the keys. */
function commit(d, menuOpen){
  var c = add(el("div","abs hw cmt"));
  c.appendChild(el("div","plate cmt-plate","COMMIT THE MONTH"));
  c.appendChild(el("div","cmt-btn","<b>COMMIT</b>"+(menuOpen?"":"<span class=key>Enter</span>")));
  c.appendChild(el("div","cmt-note","Held for events<br><b>"+d.held+" hr</b>"));
}

/* ------------------------------------------------------------------
   STATE 3 -- the month's plan: lean into the terminal (P)
   ------------------------------------------------------------------ */
function attentionBars(p){
  var s = "";
  // planning: filled = left; then the hour operating work took; then planning's own spend
  for (var i=0;i<p.planTotal;i++){
    var cls = i < p.planLeft ? "pip" : (i < p.planLeft + p.spill ? "pip spill" : "pip used");
    s += '<i class="'+cls+'"></i>';
  }
  var o = "";
  for (var j=0;j<p.opTotal;j++) o += '<i class="pip o'+(j < p.opLeft ? "" : " used")+'"></i>';
  return "<span class=l>PLANNING</span><span class=pips>"+s+"</span><span class=v>"+p.planLeft+" of "+p.planTotal+" left</span>"+
         "<span class=why>"+p.planWork+" hr planning work + <span class=o>"+p.spill+" hr operating (spill)</span></span>"+
         "<span class='l op'>OPERATING</span><span class=pips>"+o+"</span><span class='v op'>"+p.opLeft+" of "+p.opTotal+" left</span>"+
         "<span class=why><span class=o>"+(p.opWork-p.spill)+" hr operating work</span></span>"+
         "<span class=l>RESERVE</span><span class=res><span class=res-b>-</span>"+p.reserve+" hr<span class=res-b>+</span></span><span></span>"+
         "<span class=why>set aside now, untyped</span>"+
         "<span class=sys>&gt; <span class=tag>SPILL</span> "+p.spill+" hr of operating work is drawn from planning. Planning work never draws on operating hours.</span>";
}
function planScreen(p){
  room(p); doomDial(p); repMeter(p); shortcutRack("PLAN"); commit(p, true);
  add(el("div","dim"));
  var t = add(el("div","abs crt bigcrt")); t.appendChild(el("div","crt-body")); screws(t, 16);
  var scr = el("div","crt-screen",null,"left:40px;top:36px;right:40px;bottom:84px"); t.appendChild(scr);
  var inn = el("div","crt-in p-in"); scr.appendChild(inn); scr.appendChild(el("div","crt-scan")); scr.appendChild(el("div","crt-glass"));

  inn.appendChild(el("div","p-head","<span class=p-title>THE MONTH AHEAD &middot; "+p.month+" "+p.year+"</span><span class=p-date>"+p.date+" &middot; "+p.rows.length+" plays</span>"));
  inn.appendChild(el("div","att",attentionBars(p)));
  inn.appendChild(el("div","q-h","<span>#</span><span>PLAY</span><span>FROM</span><span>POOL</span><span>HOURS</span><span>COST</span><span style='text-align:right'>ORDER</span>"));
  p.rows.forEach(function(r,i){
    var cost = [r.money?money(r.money):"", r.rep?r.rep+" rep":""].filter(Boolean).join(" + ") || "<span class=dash>--</span>";
    var pool = r.pool==="op" ? "<span class=op>operating</span>"+(r.spill?"<span class=tag>SPILL "+r.spill+"</span>":"") : "planning";
    var up = i===0 ? "<b class=na>^</b>" : "<b>^</b>", dn = i===p.rows.length-1 ? "<b class=na>v</b>" : "<b>v</b>";
    inn.appendChild(el("div","q-row"+(r.spill?" spillrow":""),
      "<span class=n>"+pad2(i+1)+"</span><span>"+r.name+"</span>"+
      "<span class='k"+(r.from?"":" top")+"'>"+(r.from||"top level")+"</span>"+
      "<span class=pool>"+pool+"</span><span class='"+(r.pool==="op"?"op":"")+"'>"+r.hrs+" hr</span><span>"+cost+"</span>"+
      "<span class=q-ctl>"+up+dn+"<b>x</b></span>"));
  });
  inn.appendChild(el("div","q-tools","<span><span class=q-btn>Undo [Z]</span><span class=q-btn>Clear [C]</span></span>"+
    "<span class=q-tot><span>queued cost</span> "+money(p.qMoney)+(p.qRep?" + "+p.qRep+" rep":"")+"</span>"));
  inn.appendChild(el("div","ac",
    "<div><span class=t>AT COMMIT</span><span class=s>Wed 1 Nov</span></div>"+
    "<div><span class=h>MONEY</span><span class=b>"+money(p.money)+" <em>-&gt;</em> "+money(p.moneyAfter)+"</span></div>"+
    "<div><span class=h>REPUTATION</span><span class=b>"+p.rep+" <em>-&gt;</em> "+p.repAfter+"</span></div>"+
    "<div><span class=h>HELD FOR EVENTS</span><span class=b>"+p.held+" hr <em>untyped</em></span></div>"));

  var f = el("div","crt-foot",null,"left:46px;right:46px;bottom:20px;height:44px");
  f.appendChild(el("div","crt-brand","<i class=crt-led></i>LAB TERMINAL 1"));
  var rq = el("div","rq","<span class=rq-label>RESEARCH QUALITY</span>");
  var sw = el("div","rq-sw"); ["Rushed","Standard","Thorough"].forEach(function(x){ sw.appendChild(el("span",x==="Standard"?"on":"",x)); });
  rq.appendChild(sw); f.appendChild(rq);
  f.appendChild(el("div","esc-plate","<span class=key>P</span><span class=key>Esc</span><span>BACK TO DESK</span>"));
  t.appendChild(f);
}

/* ------------------------------------------------------------------
   layout self-check (?check=1): overflow, text outside its box,
   elements outside the stage, overlaps, font sizes under 16px
   ------------------------------------------------------------------ */
function selfCheck(){
  var sc = parseFloat(S.dataset.scale)||1;
  var leaves = Array.prototype.filter.call(document.querySelectorAll("#stage *"), function(e){
    return Array.prototype.some.call(e.childNodes, function(n){ return n.nodeType===3 && n.textContent.trim(); });
  });
  var out = [], st = S.getBoundingClientRect(), sizes = {};
  leaves.forEach(function(e){
    var cs = getComputedStyle(e), txt = "'"+e.textContent.trim().slice(0,30)+"'";
    sizes[cs.fontSize] = (sizes[cs.fontSize]||0)+1;
    if (cs.display!=="inline" && e.clientWidth>0 && e.scrollWidth > e.clientWidth+1) out.push("OVERFLOW-X "+e.className+" "+txt);
    var r = e.getBoundingClientRect();
    if (r.left<st.left-1||r.top<st.top-1||r.right>st.right+1||r.bottom>st.bottom+1) out.push("OFF-STAGE "+txt);
    var box = e.closest(".crt-screen,.cmt,.keys,.repw,.kb,.q-row,.ac");
    if (box && box!==e){ var b=box.getBoundingClientRect();
      if (r.right>b.right+1||r.bottom>b.bottom+1||r.left<b.left-1||r.top<b.top-1) out.push("OUTSIDE "+e.className+" "+txt); }
    if (parseFloat(cs.fontSize)<16) out.push("SMALL "+cs.fontSize+" "+txt);
  });
  var R = leaves.map(function(e){ return e.getBoundingClientRect(); });
  for (var i=0;i<leaves.length;i++) for (var j=i+1;j<leaves.length;j++){
    if (leaves[i].contains(leaves[j])||leaves[j].contains(leaves[i])) continue;
    var a=R[i], b=R[j], w=Math.min(a.right,b.right)-Math.max(a.left,b.left), h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
    if (w>2&&h>2) out.push("OVERLAP '"+leaves[i].textContent.trim().slice(0,24)+"' x '"+leaves[j].textContent.trim().slice(0,24)+"'");
  }
  out.push("FONT SIZES (css px at 1920): "+Object.keys(sizes).sort().map(function(k){ return k+" x"+sizes[k]; }).join(", "));
  var pre = document.createElement("pre"); pre.id="check"; pre.textContent = "CHECK-BEGIN\n"+out.join("\n")+"\nCHECK-END"; document.body.appendChild(pre);
}

(VIEWS[STATE] || VIEWS["3"])();
