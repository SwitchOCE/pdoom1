<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P(Doom)1 G Modernised</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* G. The Existing UI, Modernised -- high-fidelity run.
   One 1920x1080 stage, scaled uniformly to the window (the game's canvas_items
   stretch), so 1280x720 shows the same layout at 2/3 size.
   ?state=1..6 picks the game moment (fork/design/hifi/run-state.md).
   ?check=1 runs the layout check and writes the result to body[data-check]. */
:root{
  --steel:#1C2730; --steel2:#24323d;
  --aub:#2A1630; --aub-line:#5b3a63; --aub-edge:#7a4f84;
  --warm:#2B221A; --line:#5A4632; --line-cool:#3c5160;
  --amber:#F6A800; --amber-soft:#E8A33D; --text:#EEE8DC; --muted:#BDB2A0; --dim:#958b7b;
  --plan:#E2B866; --plan-fill:#D9A54A; --op:#7FCABD; --op-fill:#5FB3A6; --held:#B39AC0;
  --red:#E8574A; --orange:#E9752E;
  --mono:'IBM Plex Mono',Consolas,monospace; --sans:'IBM Plex Sans','Segoe UI',sans-serif;
  /* type scale: 16 label, 18 body, 20 emphasis, 22 mode, 28 band, 36 gauge */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d080c}
body{color:var(--text);font-family:var(--sans);font-size:18px}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#1a1218}
.abs{position:absolute}

/* ---- the office (Pip's office_wide_day; empty, lit by the monitors) ---- */
.art{position:absolute;inset:0;background:url(assets/office_wide_day.webp) center 38%/cover no-repeat;filter:brightness(.8) saturate(.9) contrast(1.04)}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,22,30,.28),rgba(14,22,30,0) 30%,rgba(20,10,20,.18))}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(20,9,24,0) 50%,rgba(20,9,24,.6) 100%)}

/* ---- icons: one size per kind of place ---- */
.ico{display:inline-block;flex:none;vertical-align:middle;border-radius:5px}
.i24{width:24px;height:24px}.i28{width:28px;height:28px}.i32{width:32px;height:32px}.i40{width:40px;height:40px}

/* ---- key caps ---- */
.key{display:inline-block;flex:none;font-family:var(--mono);font-size:16px;font-weight:600;line-height:20px;min-width:26px;text-align:center;padding:0 5px;border:1px solid rgba(238,232,220,.42);border-bottom-width:2px;border-radius:3px;color:var(--muted)}
.key.amb{border-color:rgba(246,168,0,.6);color:var(--amber)}
.key.dark{border-color:rgba(42,26,8,.55);color:#2a1a08}

/* ---- top resource bar ---- */
.topbar{left:0;top:0;width:1920px;height:56px;background:linear-gradient(#26343f,#1a252e);border-bottom:1px solid var(--line-cool);box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;padding:0 24px}
.tb-month{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--amber);letter-spacing:.05em;width:232px}
.tb-res{display:flex;align-items:center;gap:10px;padding:0 24px;border-left:1px solid var(--line-cool);height:30px}
.tb-res .k{font-size:16px;color:var(--muted)}
.tb-res .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tb-res .v.neg{color:var(--red)}
.flag{font-family:var(--mono);font-size:16px;font-weight:600;color:#ffd9d3;background:rgba(232,87,74,.22);border:1px solid rgba(232,87,74,.7);border-radius:3px;padding:0 7px;line-height:22px}
.tb-sp{flex:1}
.tb-menu{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:10px}

/* ---- mode banner (terminal) ---- */
.banner{left:0;top:56px;width:1920px;height:52px;background:linear-gradient(rgba(36,16,22,.92),rgba(36,16,22,.84)),url(assets/tex_amber_scanlines_512.webp);border-bottom:1px solid rgba(246,168,0,.35);display:flex;align-items:center;padding:0 24px}
.banner .mode{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--amber);letter-spacing:.06em;width:232px}
.banner .sub{font-family:var(--mono);font-size:16px;color:var(--amber-soft);padding-left:24px}
.switch{margin-left:auto;display:flex;align-items:center;gap:12px}
.vlab{font-size:16px;color:var(--amber-soft)}
.seg{display:flex;border:1px solid rgba(246,168,0,.55);border-radius:4px;overflow:hidden}
.seg span{font-family:var(--mono);font-size:16px;padding:4px 16px;color:var(--amber-soft)}
.seg span.on{background:var(--amber);color:#2a1a08;font-weight:600}

/* ---- left rail: Pip's left-bound list, one button per menu ---- */
.rail{left:24px;top:132px;width:232px;display:flex;flex-direction:column;gap:10px}
.rb{height:52px;display:flex;align-items:center;gap:12px;padding:0 12px 0 10px;background:linear-gradient(90deg,rgba(48,26,55,.94),rgba(40,21,46,.9));border:1px solid var(--aub-line);border-left:4px solid var(--aub-edge);border-radius:4px;font-size:18px;font-weight:500;box-shadow:0 4px 14px rgba(10,4,12,.35)}
.rb .lbl{flex:1}
.rb .cnt{font-family:var(--mono);font-size:16px;color:var(--muted)}
.rb.gap{margin-top:16px}

/* ---- panels ---- */
.panel{border-radius:6px;box-shadow:0 12px 36px rgba(8,3,10,.5)}
.p-warm{background:rgba(41,32,25,.95);border:1px solid var(--line)}
.p-steel{background:rgba(27,38,47,.94);border:1px solid var(--line-cool)}
.ph{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.ph .t{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.08em;color:var(--amber)}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.xbtn{font-family:var(--mono);font-size:16px;line-height:22px;color:var(--muted);border:1px solid rgba(238,232,220,.3);border-radius:3px;padding:0 8px}
.sec{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.sh{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--muted)}

/* ---- P(Doom) card ---- */
.doom{left:1480px;top:132px;width:416px}
.doom .body{display:flex;align-items:center;gap:24px;padding:16px 22px 18px}
.ring{position:relative;width:168px;height:168px;flex:none}
.ring svg{position:absolute;inset:0}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:34px;font-weight:600}
.dside{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.band{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:.06em;line-height:32px}
.trend{display:flex;align-items:center;gap:8px;align-self:flex-start;font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.06em;padding:2px 10px 2px 4px;border-radius:3px}
.ladder{display:flex;gap:3px;height:16px;align-items:center}
.ladder i{display:block;height:8px;border-radius:2px;opacity:.5}
.ladder i.on{height:16px;opacity:1;box-shadow:0 0 8px currentColor}
.dlab{font-size:16px;color:var(--muted)}

/* ---- Attention card ---- */
.attn{left:1480px;width:416px}
.att{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;row-gap:12px;column-gap:12px;margin-top:14px}
.att .n{font-size:16px}
.att .left{font-family:var(--mono);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.att .left.zero{color:var(--orange)}
.pips{display:flex;gap:4px}
.pip{width:12px;height:18px;border-radius:2px;border:1px solid;flex:none}
.pip.pl{border-color:var(--plan-fill)}.pip.pl.f{background:var(--plan-fill)}
.pip.op{border-color:var(--op-fill)}.pip.op.f{background:var(--op-fill)}
.pip.spill{border-color:var(--op-fill);background:repeating-linear-gradient(135deg,rgba(95,179,166,.9) 0 2px,transparent 2px 5px)}
.legend{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted);margin-top:12px}
.kv{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:8px;font-size:16px}
.kv .v{font-family:var(--mono);font-size:16px;text-align:right}
.kv .v.held{color:var(--held)}
.kv .k2{color:var(--muted)}
.rule{font-size:16px;line-height:22px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:44px;border-radius:4px;font-size:18px;font-weight:500}
.btn.ghost{border:1px solid rgba(246,168,0,.55);color:var(--amber);background:rgba(246,168,0,.08)}
.btn.ghost.on{background:rgba(246,168,0,.18)}
.btn.plain{border:1px solid rgba(238,232,220,.3);color:var(--text);background:rgba(255,255,255,.02)}
.btn.off{opacity:.45}

/* ---- bottom bar + Commit ---- */
.bottombar{left:0;top:1016px;width:1920px;height:64px;background:linear-gradient(#1f2c36,#172028);border-top:1px solid var(--line-cool);display:flex;align-items:center;padding:0 24px}
.bb-q{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:10px}
.commit{left:1480px;top:1024px;width:416px;height:48px;border-radius:5px;background:linear-gradient(#ffc23a,#F6A800);color:#2a1a08;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 0 20px rgba(246,168,0,.32)}

/* ---- Plan drawer: THE MONTH AHEAD ---- */
.pmenu{left:700px;top:132px;width:768px;height:872px;display:flex;flex-direction:column}
.ptable{padding:0 12px}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) 132px 96px 108px;column-gap:10px;align-items:center;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.prow.head{height:38px;font-family:var(--mono);font-size:16px;color:var(--dim);letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.14)}
.prow.play{height:54px;position:relative}
.prow.play::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px}
.prow.play.pl::before{background:var(--plan-fill)}
.prow.play.op::before{background:var(--op-fill)}
.prow .no{font-family:var(--mono);font-size:16px;color:var(--dim);padding-left:6px}
.nmc{display:flex;align-items:center;gap:10px;min-width:0}
.nmc .ico{background:#111a1d;border:1px solid rgba(255,255,255,.08);box-sizing:content-box;padding:2px}
.nmc .tx{min-width:0;display:flex;flex-direction:column}
.nmc .nm{font-size:18px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmc .src{font-size:16px;line-height:20px;color:var(--dim);white-space:nowrap}
.x2{font-family:var(--mono);font-size:16px;color:var(--amber-soft);margin-left:8px}
.exp{width:28px;height:28px;flex:none;}
.exp.on{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;color:var(--amber-soft);border:1px solid rgba(246,168,0,.45);border-radius:3px}
.hr{font-family:var(--mono);font-size:16px;line-height:20px;display:flex;flex-direction:column}
.hr.pl{color:var(--plan)}.hr.op{color:var(--op)}
.hr .sp{color:var(--plan);display:flex;align-items:center;gap:6px}
.hr .sp .pip{width:10px;height:14px}
.mo{font-family:var(--mono);font-size:16px;color:var(--muted);text-align:right}
.ctl{display:flex;gap:6px;justify-content:flex-end}
.ctl span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;color:var(--muted);border:1px solid rgba(238,232,220,.25);border-radius:3px}
.ctl span.x{color:#f0a493;border-color:rgba(232,87,74,.45)}
.ctl span.dis{opacity:.3}
.pbody{padding:0 12px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.pbody::-webkit-scrollbar{display:none}
.pmenu.over .pbody{padding-right:26px;box-shadow:inset 0 -16px 14px -12px rgba(8,3,10,.7)}
.pmenu.over .ptable,.pmenu.over .ptot{padding-right:26px}
.prail{position:absolute;width:6px;border-radius:3px;background:rgba(238,232,220,.12)}
.prail i{position:absolute;left:0;top:0;width:6px;border-radius:3px;background:rgba(246,168,0,.7)}
.prow.sub{height:44px;background:rgba(0,0,0,.16)}

.prow.sub .nm{color:#dcd3c4}
.ptot{padding:0 12px;border-top:1px solid rgba(255,255,255,.14)}
.prow.tot{height:48px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:600}
.prow.tot .hr,.prow.tot .mo{color:var(--text)}
.prow.after{height:46px;border-bottom:none}
.prow.after .lab{font-size:16px;color:var(--muted)}
.prow.after .mo{color:var(--text)}
.rq{display:flex;align-items:center;gap:8px}
.rq .sh{margin-right:12px}
.rq .opt{font-size:16px;padding:5px 14px;border:1px solid rgba(238,232,220,.25);border-radius:3px;color:var(--muted)}
.rq .opt.on{border-color:var(--amber);color:var(--amber);background:rgba(246,168,0,.1)}
.pfoot{margin-top:auto;display:flex;gap:10px;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.pfoot .btn{flex:1}
</style>
</head>
<body>
<div id="stage"></div>
<script>
var Q = new URLSearchParams(location.search);
var STATE = parseInt(Q.get('state') || '3', 10);

/* ---------------------------------------------------------------- data */
/* Game values from fork/design/hifi/run-state.md and godot/data/. */
var GAME = {
  3: { month:'NOVEMBER 2017', date:'Wed 1 Nov 2017', money:'$140,000', compute:'65', research:'-12', neg:true,
       papers:'0', rep:'32', doom:40.2, rising:true, staff:'0', ledger:'clean', view:'plan' }
};
var S = GAME[STATE] || GAME[3];

/* The month's plan (run-state state 3). pool: pl = planning, op = operating.
   Adjacent repeats share one group row; [+] opens one row per play (rule 4). */
var PLAN = [
  {no:'1',   n:'Hire: Safety Researcher', src:'Hire Staff', k:'hire_safety', pool:'pl', hr:1, mo:'$60,000'},
  {no:'2-3', n:'Read the Literature', x:2, src:'Scouting',  k:'read',        pool:'pl', hr:2, mo:'--'},
  {no:'4',   n:'Post Online',            src:'Scouting',   k:'post',        pool:'pl', hr:1, mo:'--'},
  {no:'5',   n:'Safety Audit',           src:'Actions',    k:'audit',       pool:'op', hr:2, mo:'$40,000'},
  {no:'6',   n:'Work Your Connections',  src:'Actions',    k:'connections', pool:'op', hr:2, mo:'6 rep'},
  {no:'7',   n:'Go to Meetups',          src:'Scouting',   k:'meetups',     pool:'op', hr:1, mo:'$300'},
  {no:'8',   n:'Networking',             src:'Publicity',  k:'networking',  pool:'op', hr:1, mo:'--'},
  {no:'9',   n:'Tour Offices',           src:'Office',     k:'tour',        pool:'op', hr:1, mo:'--'},
  {no:'10',  n:'Office Maintenance',     src:'Operations', k:'maintenance', pool:'op', hr:1, mo:'$5,000'},
  {no:'11',  n:'Order Office Supplies',  src:'Operations', k:'supplies',    pool:'op', hr:1, mo:'$2,000', spill:1}
];

/* Pip's icons (godot/assets/icons/, mapping in godot/data/icon_mapping.json) plus new_* drawings. */
var IC = {
  money:'money.png', compute:'compute.png', research:'research.png', papers:'paper.png', reputation:'reputation.png',
  doom:'doom.png', rising:'indicator_doom_rising_64.png', attention:'resource_action_points_64.png',
  actions:'ui_guide_actions_64.png', upgrades:'button_upgrade_normal_64.png', staff:'ui_staff_management_64.png',
  ledger:'ui_budget_finance_64.png', guide:'ui_guide_book_64.png', feedback:'ui_control_bug_64.png', menu:'ui_system_settings_64.png',
  undo:'ui_control_back_64.png', clear:'ui_control_clear_64.png',
  hire_safety:'employee_role_safety_specialist_64.png', read:'resource_papers_small_64.png', post:'new_post_online_64.png',
  audit:'employee_role_auditor_64.png', connections:'action_publicity_network_64.png', meetups:'new_meetups_64.png',
  networking:'network_64.png', tour:'action_facility_expand_office_64.png', maintenance:'employee_role_engineer_64.png',
  supplies:'new_supplies_64.png'
};
function ic(k,sz){return '<img class="ico i'+sz+'" src="assets/icons/'+IC[k]+'" alt="">';}
function add(html){var d=document.createElement('div');d.innerHTML=html.trim();var n=d.firstChild;document.getElementById('stage').appendChild(n);return n;}
function pips(total,filled,cls,spill){var s='';for(var i=0;i<total;i++){var c='pip '+cls;if(i<filled)c+=' f';else if(spill&&i<filled+spill)c='pip spill';s+='<span class="'+c+'"></span>';}return '<div class="pips">'+s+'</div>';}

/* ThemeManager.DOOM_STOPS / get_doom_stroke_color (godot/autoload/theme_manager.gd) */
var STOPS=[[0,[.30,.80,.35]],[15,[.30,.80,.35]],[30,[.88,.78,.18]],[45,[.92,.50,.13]],[60,[.82,.20,.17]],[74,[.48,.07,.14]],[87,[.40,.06,.48]],[100,[.28,.03,.46]]];
function doomRGB(p){for(var i=0;i<STOPS.length-1;i++){var a=STOPS[i],b=STOPS[i+1];if(p<=b[0]){var t=(p-a[0])/((b[0]-a[0])||1);return [0,1,2].map(function(j){return a[1][j]+(b[1][j]-a[1][j])*t;});}}return STOPS[STOPS.length-1][1];}
function doomStroke(p){var c=doomRGB(p),lum=.2126*c[0]+.7152*c[1]+.0722*c[2];if(lum<.22){var t=(.22-lum)/.22*.8,B=[.90,.40,.85];c=c.map(function(v,j){return v+(B[j]-v)*t;});}return 'rgb('+c.map(function(v){return Math.round(v*255);}).join(',')+')';}
var BANDS=[[15,'NOMINAL'],[37,'ELEVATED'],[52,'HIGH'],[67,'SEVERE'],[80,'EXTREME'],[92,'CATASTROPHIC'],[101,'TERMINAL']];
function bandIndex(p){for(var i=0;i<BANDS.length;i++)if(p<BANDS[i][0])return i;return 6;}

/* which layer is on top: only it shows Enter / Esc (council rule) */
var LAYER = (S.view==='plan');

/* ---------------------------------------------------------------- the office */
add('<div class="art"></div>');
add('<div class="grade"></div>');
add('<div class="vig"></div>');

/* ---------------------------------------------------------------- top bar */
add('<div class="abs topbar">'+
  '<div class="tb-month">'+S.month+'</div>'+
  '<div class="tb-res">'+ic('money',28)+'<span class="k">Money</span><span class="v">'+S.money+'</span></div>'+
  '<div class="tb-res">'+ic('compute',28)+'<span class="k">Compute</span><span class="v">'+S.compute+'</span></div>'+
  '<div class="tb-res">'+ic('research',28)+'<span class="k">Research</span><span class="v'+(S.neg?' neg':'')+'">'+S.research+'</span>'+(S.neg?'<span class="flag">BELOW ZERO</span>':'')+'</div>'+
  '<div class="tb-res">'+ic('papers',28)+'<span class="k">Papers</span><span class="v">'+S.papers+'</span></div>'+
  '<div class="tb-res">'+ic('reputation',28)+'<span class="k">Reputation</span><span class="v">'+S.rep+'</span></div>'+
  '<div class="tb-sp"></div>'+
  '<div class="tb-menu">'+ic('menu',28)+'Menu'+(LAYER?'':' <span class="key">Esc</span>')+'</div>'+
'</div>');

/* ---------------------------------------------------------------- banner */
add('<div class="abs banner"><span class="mode">## PLAN</span><span class="sub">'+S.date+'</span>'+
  '<div class="switch"><span class="vlab">View</span><div class="seg"><span class="on">PLAN</span><span>WATCH</span></div><span class="key amb">V</span></div></div>');

/* ---------------------------------------------------------------- rail */
function rb(k,lbl,key,cnt,gap){return '<div class="rb'+(gap?' gap':'')+'">'+ic(k,28)+'<span class="lbl">'+lbl+'</span>'+(cnt!==undefined?'<span class="cnt">'+cnt+'</span>':'')+'<span class="key">'+key+'</span></div>';}
add('<div class="abs rail">'+
  rb('actions','Actions','A')+
  rb('upgrades','Upgrades','U')+
  rb('staff','Staff','E',S.staff)+
  rb('ledger','Ledger','L',S.ledger)+
  rb('guide','Guide','F1',undefined,true)+
'</div>');

/* ---------------------------------------------------------------- P(Doom) */
(function(){
  var r=70, c=2*Math.PI*r, col=doomStroke(S.doom), bi=bandIndex(S.doom);
  var lad='', lo=0;
  BANDS.forEach(function(b,i){var hi=Math.min(b[0],100),mid=(lo+hi)/2;lad+='<i class="'+(i===bi?'on':'')+'" style="flex:'+(hi-lo)+';background:'+doomStroke(mid)+';color:'+doomStroke(mid)+'"></i>';lo=hi;});
  add('<div class="abs panel p-steel doom">'+
    '<div class="ph"><span class="t" style="display:flex;align-items:center;gap:10px">'+ic('doom',24)+'P(DOOM)</span></div>'+
    '<div class="body">'+
      '<div class="ring"><svg width="168" height="168" viewBox="0 0 168 168">'+
        '<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="14"/>'+
        '<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="14" stroke-dasharray="'+(c*S.doom/100)+' '+c+'" transform="rotate(-90 84 84)"/>'+
      '</svg><div class="pct" style="color:'+col+'">'+S.doom.toFixed(1)+'%</div></div>'+
      '<div class="dside">'+
        '<div class="band" style="color:'+col+'">'+BANDS[bi][1]+'</div>'+
        (S.rising?'<span class="trend" style="color:'+col+';border:1px solid '+col+'">'+ic('rising',24)+'RISING</span>':'')+
        '<div><div class="ladder">'+lad+'</div></div>'+
        '<div class="dlab">Band '+(bi+1)+' of 7</div>'+
      '</div>'+
    '</div></div>');
})();

/* ---------------------------------------------------------------- Attention card */
/* State 3 (ADR-0011 amendment 2026-07-28): 12 planning + 8 operating.
   Planning work 4 hr; operating work 9 hr = 8 operating + 1 spilled into planning.
   Bars filled = hours LEFT. The hatched cell is the planning hour operating work used. */
(function(){
  var html='<div class="ph"><span class="t" style="display:flex;align-items:center;gap:10px">'+ic('attention',24)+'ATTENTION</span><span class="r">20 hr this month</span></div>'+
    '<div class="sec" style="border-top:none;padding-top:4px">'+
      '<div class="att">'+
        '<span class="n">Planning</span>'+pips(12,7,'pl',1)+'<span class="left">7 left</span>'+
        '<span class="n">Operating</span>'+pips(8,0,'op')+'<span class="left zero">0 left</span>'+
      '</div>'+
      '<div class="legend"><span class="pip spill"></span>1 operating hour drawn from planning</div>'+
    '</div>'+
    '<div class="sec"><div class="kv">'+
      '<span>Held for events at Commit</span><span class="v held">7 hr</span>'+
      '<span class="k2">Reserve (needs operating hours)</span><span class="v" style="color:var(--muted)">none</span>'+
    '</div></div>'+
    '<div class="sec"><div class="rule">Operating work can use planning hours. Planning work can never use operating hours.</div></div>'+
    '<div class="sec"><div class="btn ghost on">Close plan <span class="key amb">Q</span></div></div>';
  var card = add('<div class="abs panel p-steel attn">'+html+'</div>');
  card.style.top = (1004 - card.offsetHeight) + 'px';
})();

/* ---------------------------------------------------------------- bottom bar + Commit */
add('<div class="abs bottombar"><span class="bb-q">'+ic('feedback',24)+'Feedback <span class="key">N</span></span></div>');
add('<div class="abs commit">COMMIT THE MONTH &gt;'+(LAYER?'':' <span class="key dark">Enter</span>')+'</div>');

/* ---------------------------------------------------------------- Plan drawer */
if (S.view==='plan') {
  var OPEN = Q.get('expand')==='read';
  function ctl(first,last){return '<span class="ctl"><span class="'+(first?'dis':'')+'">&#94;</span><span class="'+(last?'dis':'')+'">v</span><span class="x">x</span></span>';}
  function hrs(p,h){var s='<span class="hr '+p.pool+'"><span>'+h+' '+(p.pool==='pl'?'plan':'op')+'</span>';
    if(p.spill)s+='<span class="sp"><span class="pip spill"></span>1 from plan</span>';return s+'</span>';}
  var rows='';
  PLAN.forEach(function(p,i){
    var exp = p.x ? '<span class="exp on">'+(OPEN?'-':'+')+'</span>' : '<span class="exp"></span>';
    rows+='<div class="prow play '+p.pool+'"><span class="no">'+p.no+'</span>'+
      '<span class="nmc">'+exp+ic(p.k,32)+'<span class="tx"><span class="nm">'+p.n+(p.x?'<span class="x2">x'+p.x+'</span>':'')+'</span><span class="src">'+p.src+'</span></span></span>'+
      hrs(p,p.hr)+'<span class="mo">'+p.mo+'</span>'+ctl(i===0,i===PLAN.length-1)+'</div>';
    if (p.x && OPEN) { for (var k=0;k<p.x;k++) rows+='<div class="prow sub"><span class="no">'+(parseInt(p.no,10)+k)+'</span>'+
      '<span class="nmc"><span class="exp"></span>'+ic(p.k,32)+'<span class="tx"><span class="nm">'+p.n+'</span></span></span>'+hrs({pool:p.pool},1)+'<span class="mo">'+p.mo+'</span>'+ctl(false,false)+'</div>'; }
  });
  add('<div class="abs panel p-warm pmenu">'+
    '<div class="ph"><span class="t">THE MONTH AHEAD</span><span class="r">runs top to bottom<span class="xbtn">x</span><span class="key">Esc</span></span></div>'+
    '<div class="ptable"><div class="prow head"><span style="padding-left:6px">#</span><span>PLAY</span><span>HOURS</span><span style="text-align:right">COST</span><span style="text-align:right">ORDER</span></div></div>'+
    '<div class="pbody">'+rows+'</div>'+
    '<div class="ptot">'+
      '<div class="prow tot"><span></span><span>Total: 11 plays</span><span class="hr">4 plan, 9 op</span><span class="mo" style="grid-column:4 / 6">$107,300 + 6 rep</span></div>'+
      '<div class="prow after"><span></span><span class="lab">After Commit</span><span class="mo" style="grid-column:3 / 6">$32,700, 26 rep</span></div>'+
    '</div>'+
    '<div class="sec"><div class="rq"><span class="sh">RESEARCH QUALITY</span><span class="opt">Rushed</span><span class="opt on">Standard</span><span class="opt">Thorough</span></div></div>'+
    '<div class="pfoot"><div class="btn plain">'+ic('undo',24)+'Undo <span class="key">Z</span></div><div class="btn plain">'+ic('clear',24)+'Clear <span class="key">C</span></div><div class="btn plain off">'+ic('attention',24)+'Reserve hours <span class="key">R</span></div></div>'+
  '</div>');
  var pm=document.querySelector('.pmenu'), pb=pm.querySelector('.pbody');
  if (pb.scrollHeight > pb.clientHeight+1) {
    pm.classList.add('over');
    var th=Math.max(40,Math.round((pb.clientHeight-8)*pb.clientHeight/pb.scrollHeight));
    var rail=document.createElement('div'); rail.className='prail';
    rail.style.cssText='left:'+(pb.offsetLeft+pb.offsetWidth-14)+'px;top:'+(pb.offsetTop+4)+'px;height:'+(pb.clientHeight-8)+'px';
    rail.innerHTML='<i style="height:'+th+'px"></i>'; pm.appendChild(rail);
  }
}

/* ---------------------------------------------------------------- layout check (?check=1) */
if (Q.get('check')) {
  var bad=[];
  document.querySelectorAll('#stage *').forEach(function(e){
    var cs=getComputedStyle(e);
    var txt=[].some.call(e.childNodes,function(n){return n.nodeType===3&&n.textContent.trim();});
    if(txt && parseFloat(cs.fontSize)<16) bad.push('small:'+e.className+':'+cs.fontSize+':'+e.textContent.trim().slice(0,20));
    if(txt && (e.scrollWidth>e.clientWidth+1) && cs.overflow!=='visible') bad.push('clip:'+e.className+':'+e.textContent.trim().slice(0,24));
    if(txt && e.scrollWidth>e.clientWidth+1 && cs.textOverflow==='ellipsis') bad.push('ellipsis:'+e.textContent.trim().slice(0,24));
    var r=e.getBoundingClientRect(); if(r.width&&(r.right>1920.5||r.bottom>1080.5||r.left<-.5||r.top<-.5)) bad.push('off:'+e.className);
  });
  document.querySelectorAll('.panel').forEach(function(p){var pr=p.getBoundingClientRect();
    p.querySelectorAll('*').forEach(function(e){var r=e.getBoundingClientRect(); if(r.width&&(r.right>pr.right+1||r.bottom>pr.bottom+1||r.left<pr.left-1)) bad.push('out:'+p.className+'>'+e.className+':'+e.textContent.trim().slice(0,20));});});
  /* panels must not overlap each other */
  var ps=[].slice.call(document.querySelectorAll('.panel,.rail,.commit'));
  ps.forEach(function(a,i){ps.slice(i+1).forEach(function(b){var A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
    if(A.left<B.right-1&&B.left<A.right-1&&A.top<B.bottom-1&&B.top<A.bottom-1) bad.push('overlap:'+a.className+' / '+b.className);});});
  document.body.setAttribute('data-check', bad.length?bad.join(' | '):'CLEAN');
}

/* ---------------------------------------------------------------- scale to the window */
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080),st=document.getElementById('stage');
  st.style.transform='scale('+s+')';st.style.left=Math.round((innerWidth-1920*s)/2)+'px';st.style.top=Math.round((innerHeight-1080*s)/2)+'px';}
if (!Q.get('check')) { fit(); addEventListener('resize',fit); }
</script>
</body>
</html>
