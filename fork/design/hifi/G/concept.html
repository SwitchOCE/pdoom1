<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P(Doom)1 G Modernised</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* G. The Existing UI, Modernised -- high-fidelity run.
   One 1920x1080 stage, scaled uniformly to the window (the game's canvas_items
   stretch), so 1280x720 shows the same layout at 2/3 size.
   ?state=1..6 picks the game moment (fork/design/hifi/run-state.md).
   ?check=1 runs the layout check and writes the result to body[data-check]. */
:root{
  --steel:#1C2730; --steel2:#24323d;
  --aub:#2A1630; --aub-line:#5b3a63; --aub-edge:#7a4f84;
  --warm:#2B221A; --line:#5A4632; --line-cool:#3c5160;
  --amber:#F6A800; --amber-soft:#E8A33D; --text:#EEE8DC; --muted:#BDB2A0; --dim:#958b7b;
  --plan:#E2B866; --plan-fill:#D9A54A; --op:#7FCABD; --op-fill:#5FB3A6; --held:#C9D2D8;
  --red:#E8574A; --orange:#E9752E;
  --mono:'IBM Plex Mono',Consolas,monospace; --sans:'IBM Plex Sans','Segoe UI',sans-serif;
  /* type scale: 16 label, 18 body, 20 emphasis, 22 mode, 28 band, 36 gauge */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d080c}
body{color:var(--text);font-family:var(--sans);font-size:18px}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#1a1218}
.abs{position:absolute}

/* ---- the office (Pip's office_wide_day; empty, lit by the monitors) ---- */
.art{position:absolute;inset:0;background:url(assets/office_wide_day.webp) center 38%/cover no-repeat;filter:brightness(.8) saturate(.9) contrast(1.04)}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,22,30,.28),rgba(14,22,30,0) 30%,rgba(20,10,20,.18))}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(20,9,24,0) 50%,rgba(20,9,24,.6) 100%)}

/* ---- icons: one size per kind of place ---- */
.ico{display:inline-block;flex:none;vertical-align:middle;border-radius:5px}
.i24{width:24px;height:24px}.i28{width:28px;height:28px}.i32{width:32px;height:32px}.i40{width:40px;height:40px}

/* ---- key caps ---- */
.key{display:inline-block;flex:none;font-family:var(--mono);font-size:16px;font-weight:600;line-height:20px;min-width:26px;text-align:center;padding:0 5px;border:1px solid rgba(238,232,220,.42);border-bottom-width:2px;border-radius:3px;color:var(--muted)}
.key.amb{border-color:rgba(246,168,0,.6);color:var(--amber)}
.key.dark{border-color:rgba(42,26,8,.55);color:#2a1a08}

/* ---- top resource bar ---- */
.topbar{left:0;top:0;width:1920px;height:56px;background:linear-gradient(#26343f,#1a252e);border-bottom:1px solid var(--line-cool);box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;padding:0 24px}
.tb-month{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--amber);letter-spacing:.05em;width:232px}
.tb-res{display:flex;align-items:center;gap:10px;padding:0 24px;border-left:1px solid var(--line-cool);height:30px}
.tb-res .k{font-size:16px;color:var(--muted)}
.tb-res .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tb-res .v.neg{color:var(--red)}
.flag{font-family:var(--mono);font-size:16px;font-weight:600;color:#ffd9d3;background:rgba(232,87,74,.22);border:1px solid rgba(232,87,74,.7);border-radius:3px;padding:0 7px;line-height:22px}
.tb-sp{flex:1}
.tb-menu{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:10px}

/* ---- mode banner (terminal) ---- */
.banner{left:0;top:56px;width:1920px;height:52px;background:linear-gradient(rgba(36,16,22,.92),rgba(36,16,22,.84)),url(assets/tex_amber_scanlines_512.webp);border-bottom:1px solid rgba(246,168,0,.35);display:flex;align-items:center;padding:0 24px}
.banner .mode{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--amber);letter-spacing:.06em;width:232px}
.banner .sub{font-family:var(--mono);font-size:16px;color:var(--amber-soft);padding-left:24px}
.switch{margin-left:auto;display:flex;align-items:center;gap:12px}
.vlab{font-size:16px;color:var(--amber-soft)}
.seg{display:flex;border:1px solid rgba(246,168,0,.55);border-radius:4px;overflow:hidden}
.seg span{font-family:var(--mono);font-size:16px;padding:4px 16px;color:var(--amber-soft)}
.seg span.on{background:var(--amber);color:#2a1a08;font-weight:600}

/* ---- left rail: Pip's left-bound list, one button per menu ---- */
.rail{left:24px;top:132px;width:232px;display:flex;flex-direction:column;gap:10px}
.rb{height:52px;display:flex;align-items:center;gap:12px;padding:0 12px 0 10px;background:linear-gradient(90deg,rgba(48,26,55,.94),rgba(40,21,46,.9));border:1px solid var(--aub-line);border-left:4px solid var(--aub-edge);border-radius:4px;font-size:18px;font-weight:500;box-shadow:0 4px 14px rgba(10,4,12,.35)}
.rb .lbl{flex:1}
.rb .cnt{font-family:var(--mono);font-size:16px;color:var(--muted)}
.rb.gap{margin-top:16px}

/* ---- panels ---- */
.panel{border-radius:6px;box-shadow:0 12px 36px rgba(8,3,10,.5)}
.p-warm{background:rgba(41,32,25,.95);border:1px solid var(--line)}
.p-steel{background:rgba(27,38,47,.94);border:1px solid var(--line-cool)}
.ph{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.ph .t{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.08em;color:var(--amber)}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted)}
.xbtn{font-family:var(--mono);font-size:16px;line-height:22px;color:var(--muted);border:1px solid rgba(238,232,220,.3);border-radius:3px;padding:0 8px}
.sec{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.sh{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--muted)}

/* ---- P(Doom) card ---- */
.doom{left:1480px;top:132px;width:416px}
.doom .body{display:flex;align-items:center;gap:24px;padding:16px 22px 18px}
.ring{position:relative;width:168px;height:168px;flex:none}
.ring svg{position:absolute;inset:0}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:34px;font-weight:600}
.dside{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.band{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em;line-height:28px;white-space:nowrap}
.trend{display:flex;align-items:center;gap:8px;align-self:flex-start;font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.06em;padding:2px 10px 2px 4px;border-radius:3px}
.ladder{display:flex;gap:3px;height:16px;align-items:center}
.ladder i{display:block;height:8px;border-radius:2px;opacity:.5}
.ladder i.on{height:16px;opacity:1;box-shadow:0 0 8px currentColor}
.dlab{font-size:16px;color:var(--muted)}

/* ---- Attention card ---- */
.attn{left:1480px;width:416px}
.att{display:grid;grid-template-columns:88px 1fr 72px;align-items:center;row-gap:12px;column-gap:12px;margin-top:14px}
.att .n{font-size:16px}
.att .left{font-family:var(--mono);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.att .left.zero{color:var(--orange)}
.pips{display:flex;gap:4px}
.pip{width:12px;height:18px;border-radius:2px;border:1px solid;flex:none}
.pip.pl{border-color:var(--plan-fill)}.pip.pl.f{background:var(--plan-fill)}
.pip.op{border-color:var(--op-fill)}.pip.op.f{background:var(--op-fill)}
.pip.spill{border-color:var(--op-fill);background:repeating-linear-gradient(135deg,rgba(95,179,166,.9) 0 2px,transparent 2px 5px)}
.legend{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted);margin-top:12px}
.kv{display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:8px;font-size:16px}
.kv .v{font-family:var(--mono);font-size:16px;text-align:right}
.kv .v.held{color:var(--held)}
.kv .k2{color:var(--muted)}
.rule{font-size:16px;line-height:22px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:44px;border-radius:4px;font-size:18px;font-weight:500}
.btn.ghost{border:1px solid rgba(246,168,0,.55);color:var(--amber);background:rgba(246,168,0,.08)}
.btn.ghost.on{background:rgba(246,168,0,.18)}
.btn.plain{border:1px solid rgba(238,232,220,.3);color:var(--text);background:rgba(255,255,255,.02)}
.btn.off{opacity:.45}

/* ---- bottom bar + Commit ---- */
.bottombar{left:0;top:1016px;width:1920px;height:64px;background:linear-gradient(#1f2c36,#172028);border-top:1px solid var(--line-cool);display:flex;align-items:center;padding:0 24px}
.bb-q{font-size:16px;color:var(--muted);display:flex;align-items:center;gap:10px}
.commit{left:1480px;top:1024px;width:416px;height:48px;border-radius:5px;background:linear-gradient(#ffc23a,#F6A800);color:#2a1a08;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 0 20px rgba(246,168,0,.32)}

/* ---- Plan drawer: THE MONTH AHEAD ---- */
.pmenu{left:700px;top:132px;width:768px;height:872px;display:flex;flex-direction:column}
.ptable{padding:0 12px}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) 132px 96px 108px;column-gap:10px;align-items:center;padding:0 8px;border-bottom:1px solid rgba(255,255,255,.06)}
.prow.head{height:38px;font-family:var(--mono);font-size:16px;color:var(--dim);letter-spacing:.06em;border-bottom:1px solid rgba(255,255,255,.14)}
.prow.play{height:50px;position:relative}
.prow.play::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px}
.prow.play.pl::before{background:var(--plan-fill)}
.prow.play.op::before{background:var(--op-fill)}
.prow .no{font-family:var(--mono);font-size:16px;color:var(--dim);padding-left:6px}
.nmc{display:flex;align-items:center;gap:10px;min-width:0}
.nmc .ico{background:#111a1d;border:1px solid rgba(255,255,255,.08);box-sizing:content-box;padding:2px}
.nmc .tx{min-width:0;display:flex;flex-direction:column}
.nmc .nm{font-size:18px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmc .src{font-size:16px;line-height:20px;color:var(--dim);white-space:nowrap}
.x2{font-family:var(--mono);font-size:16px;color:var(--amber-soft);margin-left:8px}
.hr{font-family:var(--mono);font-size:16px;line-height:20px;display:flex;flex-direction:column}
.hr.pl{color:var(--plan)}.hr.op{color:var(--op)}
.hr .sp{color:var(--plan);display:flex;align-items:center;gap:6px}
.hr .sp .pip{width:10px;height:14px}
.mo{font-family:var(--mono);font-size:16px;color:var(--muted);text-align:right}
.ctl{display:flex;gap:6px;justify-content:flex-end}
.ctl span{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px;color:var(--muted);border:1px solid rgba(238,232,220,.25);border-radius:3px}
.ctl span.x{color:#f0a493;border-color:rgba(232,87,74,.45)}
.ctl span.dis{opacity:.3}
.pbody{padding:0 12px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.pbody::-webkit-scrollbar{display:none}
.pmenu.over .pbody{padding-right:26px;box-shadow:inset 0 -16px 14px -12px rgba(8,3,10,.7)}
.pmenu.over .ptable,.pmenu.over .ptot{padding-right:26px}
.prail{position:absolute;width:6px;border-radius:3px;background:rgba(238,232,220,.12)}
.prail i{position:absolute;left:0;top:0;width:6px;border-radius:3px;background:rgba(246,168,0,.7)}
.prow.sub{height:44px;background:rgba(0,0,0,.16)}

.prow.sub .nm{color:#dcd3c4}
.ptot{padding:0 12px;border-top:1px solid rgba(255,255,255,.14)}
.prow.tot{height:48px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:600}
.prow.tot .hr,.prow.tot .mo{color:var(--text)}
.prow.after{height:46px;border-bottom:none}
.prow.after .lab{font-size:16px;color:var(--muted)}
.prow.after .mo{color:var(--text)}
.rq{display:flex;align-items:center;gap:8px}
.rq .sh{margin-right:12px}
.rq .opt{font-size:16px;padding:5px 14px;border:1px solid rgba(238,232,220,.25);border-radius:3px;color:var(--muted)}
.rq .opt.on{border-color:var(--amber);color:var(--amber);background:rgba(246,168,0,.1)}
.pfoot{margin-top:auto;display:flex;gap:10px;padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.pfoot .btn{flex:1}

/* ---- doom layer over the office (docs/art/PALETTE_AND_DOOM_INTENSITY.md):
   one ambient grade + one glow source; the room and the controls never move ---- */
.glow{position:absolute;border-radius:50%;pointer-events:none}
.sky{position:absolute;pointer-events:none}
.smoke{position:absolute;left:0;top:560px;width:1920px;height:520px;pointer-events:none;opacity:.5}

/* ---- warnings on top-bar values (the game's own danger thresholds) ---- */
.flag.warn{color:#ffe2a8;background:rgba(246,168,0,.16);border-color:rgba(246,168,0,.7)}
.tb-res .v.warnv{color:#ffc65a}

/* ---- rail states ---- */
.rb.off{opacity:.45}
.rb.hint{border-color:rgba(246,168,0,.85);border-left-color:var(--amber);background:linear-gradient(90deg,rgba(90,58,20,.95),rgba(58,34,30,.92));box-shadow:0 0 0 2px rgba(246,168,0,.35),0 0 24px rgba(246,168,0,.45)}
.rb.on{border-color:rgba(246,168,0,.6);border-left-color:var(--amber);background:linear-gradient(90deg,rgba(78,50,24,.95),rgba(52,32,30,.92))}

/* ---- plan card (home) ---- */
.qrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;column-gap:10px;height:40px;font-size:16px}
.qrow .no{font-family:var(--mono);color:var(--dim)}
.qrow .qn{display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0}
.qrow .h{font-family:var(--mono);font-size:16px;color:var(--muted)}
.qrow .h.pl{color:var(--plan)}.qrow .h.op{color:var(--op)}
.empty{font-size:16px;color:var(--muted)}
.qtot{display:flex;justify-content:space-between;font-size:16px;font-weight:600;border-top:1px solid rgba(255,255,255,.1);margin-top:6px;padding-top:10px}
.qtot .v{font-family:var(--mono)}
.commit.idle{background:#33404a;color:#c3ccd2;box-shadow:none}

/* ---- advisor (state 1, the tutorial's first step) ---- */
.advisor{left:280px;top:132px;width:440px}
.advisor .body{padding:16px 20px 18px}
.advisor .say{font-size:18px;line-height:27px}
.advisor .where{font-size:16px;line-height:24px;color:var(--muted);margin-top:10px}
.pointer{position:absolute;width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-right:14px solid rgba(246,168,0,.85)}
.p-amb{background:rgba(38,30,22,.96);border:1px solid rgba(246,168,0,.7)}

/* ---- Actions menu (state 2) ---- */
.amenu{left:280px;top:132px;width:600px;height:872px;display:flex;flex-direction:column}
.alist{padding:8px 10px;flex:1}
.arow{display:grid;grid-template-columns:40px minmax(0,1fr) 30px;column-gap:14px;align-items:center;height:45px;padding:0 10px;border-radius:4px}
.arow .ic{width:40px;height:40px;border-radius:5px;overflow:hidden;background:#111a1d;border:1px solid rgba(255,255,255,.08)}
.arow .ic img{width:100%;height:100%;display:block}
.arow .tx{min-width:0;display:flex;flex-direction:column}
.arow .nm{font-size:18px;line-height:22px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:8px}
.arow .ct{font-size:16px;line-height:20px;color:var(--muted);white-space:nowrap}
.arow .ct .why{color:var(--orange)}
.arow .gl{font-family:var(--mono);font-size:20px;font-weight:600;text-align:center;color:var(--amber)}
.arow .gl.add{color:var(--op)}
.arow.blk .nm{color:#b5aa98}.arow.blk .ic{opacity:.5}
.arow.sel{background:rgba(127,202,189,.13);outline:1px solid rgba(127,202,189,.65)}
.agrp{height:8px}
.chip{font-family:var(--mono);font-size:16px;font-weight:600;line-height:20px;border-radius:3px;padding:0 6px;color:#2a1a08;background:var(--amber-soft)}
.chip.new{background:var(--op);color:#0f2421}
.chip.soon{background:#5b5248;color:#e4dccd}
.detail{left:904px;width:480px}
.detail .body{padding:18px 20px 20px}
.detail .t{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600}
.detail .t .ico{background:#111a1d;border:1px solid rgba(255,255,255,.08)}
.detail .c{font-family:var(--mono);font-size:16px;color:var(--op);margin:12px 0 10px}
.detail p{font-size:18px;line-height:27px}
.detail .fit{font-size:16px;line-height:24px;color:var(--muted);margin-top:10px}
.detail .acts{display:flex;gap:10px;margin-top:18px}
.detail .acts .btn{flex:1}
.btn.teal{background:rgba(95,179,166,.2);border:1px solid rgba(127,202,189,.75);color:#d3f3ee}
.conn{position:absolute;height:2px;background:rgba(127,202,189,.75)}

/* ---- WATCH: playback, feed, event (states 4, 5) ---- */
.pback{display:flex;align-items:center;gap:14px;margin-left:28px}
.pbar{position:relative;width:300px;height:8px;border-radius:4px;background:rgba(246,168,0,.18)}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--amber)}
.pday{font-family:var(--mono);font-size:16px;color:var(--amber-soft)}
.speed{display:flex;gap:6px}
.speed span{font-family:var(--mono);font-size:16px;line-height:24px;color:var(--amber-soft);border:1px solid rgba(246,168,0,.4);border-radius:3px;padding:0 9px}
.speed span.on{background:rgba(246,168,0,.2);color:var(--amber)}
.switch.dim{opacity:.45}
.feed{left:24px;width:560px}
.fl{display:grid;align-items:start;grid-template-columns:104px minmax(0,1fr);column-gap:12px;font-size:16px;line-height:22px;padding:6px 18px}
.fl .d{font-family:var(--mono);color:var(--amber-soft)}
.fl.more{color:var(--muted)}
.fl.now{background:rgba(246,168,0,.08)}
.slip{left:624px;top:148px;width:700px}
.slip .art2{height:252px;background:#1b1512 url(assets/event_records_drawer.webp) center/cover no-repeat;border-radius:6px 6px 0 0;position:relative;border-bottom:1px solid var(--line)}
.slip .tag{position:absolute;right:16px;top:14px;font-family:var(--mono);font-size:16px;font-weight:600;color:var(--amber);background:rgba(20,12,8,.8);border:1px solid rgba(246,168,0,.6);border-radius:3px;padding:2px 10px}
.slip .body{padding:18px 24px 22px}
.slip .ttl{font-size:28px;font-weight:600;line-height:34px}
.slip .dt{font-family:var(--mono);font-size:16px;color:var(--amber-soft);margin-top:4px}
.slip p{font-size:18px;line-height:27px;margin:14px 0 6px}
.eopt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;column-gap:14px;min-height:60px;padding:8px 16px;border:1px solid rgba(238,232,220,.22);border-radius:4px;margin-top:10px}
.eopt .on1{font-size:18px;font-weight:500}
.eopt .ef{font-size:16px;color:var(--muted)}
.eopt .c{font-family:var(--mono);font-size:16px;color:var(--amber-soft);text-align:right}
.eopt .c.free{color:#9fd1a8}
.eopt.sel{border-color:rgba(246,168,0,.8);background:rgba(246,168,0,.1)}
.cash{display:flex;gap:24px;font-size:16px;color:var(--muted);margin-top:14px}
.cash b{font-family:var(--mono);font-weight:600;color:var(--text)}
.staffrow{display:flex;align-items:center;gap:12px;font-size:16px}
.staffrow .ico{background:#111a1d;border:1px solid rgba(255,255,255,.08)}

/* ---- Month Review (state 5) ---- */
.review{left:624px;top:148px;width:700px}
.review .lede{font-size:28px;font-weight:600;line-height:34px}
.review .body{padding:20px 24px 22px}
.review .att{display:block;margin:0}
.mv{display:grid;grid-template-columns:96px 1fr auto;align-items:center;row-gap:0;column-gap:14px;margin-top:10px}
.mv span{height:40px;line-height:40px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);font-size:18px}
.mv .s{color:var(--muted);font-size:16px}
.mv .ft{font-family:var(--mono);font-size:16px}
.mv .dl{font-family:var(--mono);font-size:16px;justify-content:flex-end}
.dl.bad{color:#f0a493}.dl.good{color:#9fd1a8}

</style>
</head>
<body>
<div id="stage"></div>
<script>
var Q = new URLSearchParams(location.search);
var STATE = parseInt(Q.get('state') || '3', 10);
if (!(STATE>=1 && STATE<=6)) STATE = 3;

/* ================================================================ data */
/* Values from fork/design/hifi/run-state.md and godot/data/; where the game code gives a
   different value the game wins (see notes.md, "Fixtures"). */
var GAME = {
  1: { month:'JULY 2017', date:'Tue 4 Jul 2017', money:'$245,000', compute:'100', research:'0', papers:'0', rep:'50',
       doom:20.0, rising:false, staff:'0', ledger:'clean', mode:'plan', view:'home', art:0, att:[12,8] },
  2: { month:'NOVEMBER 2017', date:'Wed 1 Nov 2017', money:'$140,000', compute:'65', research:'-12', neg:true, papers:'0', rep:'32',
       doom:40.2, rising:true, staff:'0', ledger:'clean', mode:'plan', view:'actions', art:1, att:[9,8] },
  3: { month:'NOVEMBER 2017', date:'Wed 1 Nov 2017', money:'$140,000', compute:'65', research:'-12', neg:true, papers:'0', rep:'32',
       doom:40.2, rising:true, staff:'0', ledger:'clean', mode:'plan', view:'plan', art:1 },
  4: { month:'NOVEMBER 2017', date:'Tue 14 Nov 2017', money:'$37,400', compute:'65', research:'-6', neg:true, papers:'0', rep:'34',
       doom:40.2, rising:true, staff:'1', ledger:'clean', mode:'watch', view:'event', art:1, day:10 },
  5: { month:'DECEMBER 2017', date:'Fri 1 Dec 2017', money:'$12,400', moneyFlag:'LOW', compute:'65', research:'-6', neg:true, papers:'0', rep:'34',
       doom:56.7, rising:true, staff:'2', ledger:'clean', mode:'watch', view:'review', art:2, day:22 },
  6: { month:'APRIL 2018', date:'Mon 2 Apr 2018', money:'$12,300', moneyFlag:'LOW', compute:'65', research:'4', papers:'0', rep:'21', repFlag:'LOW',
       doom:81.4, rising:true, staff:'2', ledger:'clean', mode:'plan', view:'home', art:3, att:[12,8] }
};
var S = GAME[STATE];

/* State 3: the month's plan. pool pl = planning, op = operating. Every play has its own row
   and its own controls, repeats included (council round 1, G3). */
var PLAN = [
  {no:'1',   n:'Hire: Safety Researcher', src:'Hire Staff', k:'hire_safety', pool:'pl', hr:1, mo:'$60,000'},
  {no:'2',   n:'Read the Literature',    src:'Scouting',   k:'read',        pool:'pl', hr:1, mo:'--'},
  {no:'3',   n:'Read the Literature',    src:'Scouting',   k:'read',        pool:'pl', hr:1, mo:'--'},
  {no:'4',   n:'Post Online',            src:'Scouting',   k:'post',        pool:'pl', hr:1, mo:'--'},
  {no:'5',   n:'Safety Audit',           src:'Actions',    k:'audit',       pool:'op', hr:2, mo:'$40,000'},
  {no:'6',   n:'Work Your Connections',  src:'Actions',    k:'connections', pool:'op', hr:2, mo:'6 rep'},
  {no:'7',   n:'Go to Meetups',          src:'Scouting',   k:'meetups',     pool:'op', hr:1, mo:'$300'},
  {no:'8',   n:'Networking',             src:'Publicity',  k:'networking',  pool:'op', hr:1, mo:'--'},
  {no:'9',   n:'Tour Offices',           src:'Office',     k:'tour',        pool:'op', hr:1, mo:'--'},
  {no:'10',  n:'Go to Meetups',          src:'Scouting',   k:'meetups',     pool:'op', hr:1, mo:'$300'},
  {no:'11',  n:'Order Office Supplies',  src:'Operations', k:'supplies',    pool:'op', hr:1, mo:'$2,000', spill:1}
];

/* Pip's icons (godot/assets/icons/; mapping godot/data/icon_mapping.json) plus new_* drawings. */
var IC = {
  money:'money.png', compute:'compute.png', research:'research.png', papers:'paper.png', reputation:'reputation.png',
  doom:'doom.png', rising:'indicator_doom_rising_64.png', attention:'resource_action_points_64.png',
  actions:'ui_guide_actions_64.png', upgrades:'button_upgrade_normal_64.png', staff:'ui_staff_management_64.png',
  ledger:'ui_budget_finance_64.png', guide:'ui_guide_book_64.png', feedback:'ui_control_bug_64.png', menu:'ui_system_settings_64.png',
  undo:'ui_control_back_64.png', clear:'ui_control_clear_64.png',
  /* plays */
  hire_safety:'employee_role_safety_specialist_64.png', read:'resource_papers_small_64.png', post:'new_post_online_64.png',
  audit:'employee_role_auditor_64.png', connections:'action_publicity_network_64.png', meetups:'new_meetups_64.png',
  networking:'network_64.png', tour:'ui_infrastructure_facilities_64.png',
  supplies:'new_supplies_64.png',
  /* top-level actions (state 2) */
  fundraise:'resource_money_64.png', financing:'action_funding_loan_64.png', hire:'button_hire_normal_64.png',
  advertise:'new_advertise_64.png', onboard:'employee_status_training_64.png', safety:'action_research_alignment_64.png',
  capability:'action_research_capability_control_64.png', publish:'paper.png', buycompute:'action_facility_upgrade_compute_64.png',
  operations:'ui_control_settings_64.png', office:'action_facility_expand_office_64.png', scouting:'action_research_monitoring_64.png',
  travel:'new_travel_64.png', publicity:'new_publicity_64.png', strategic:'ui_guide_strategy_64.png'
};
function ic(k,sz){return '<img class="ico i'+sz+'" src="assets/icons/'+IC[k]+'" alt="">';}
function add(html,parent){var d=document.createElement('div');d.innerHTML=html.trim();var n=d.firstChild;(parent||document.getElementById('stage')).appendChild(n);return n;}
function pips(total,filled,cls,spill){var s='';for(var i=0;i<total;i++){var c='pip '+cls;if(i<filled)c+=' f';else if(spill&&i<filled+spill)c='pip spill';s+='<span class="'+c+'"></span>';}return '<div class="pips">'+s+'</div>';}
function key(k,cls){return '<span class="key'+(cls?' '+cls:'')+'">'+k+'</span>';}

/* ThemeManager.DOOM_STOPS / get_doom_stroke_color / DOOM_STATUS_BANDS (godot/autoload/theme_manager.gd) */
var STOPS=[[0,[.30,.80,.35]],[15,[.30,.80,.35]],[30,[.88,.78,.18]],[45,[.92,.50,.13]],[60,[.82,.20,.17]],[74,[.48,.07,.14]],[87,[.40,.06,.48]],[100,[.28,.03,.46]]];
function doomRGB(p){for(var i=0;i<STOPS.length-1;i++){var a=STOPS[i],b=STOPS[i+1];if(p<=b[0]){var t=(p-a[0])/((b[0]-a[0])||1);return [0,1,2].map(function(j){return a[1][j]+(b[1][j]-a[1][j])*t;});}}return STOPS[STOPS.length-1][1];}
function doomStroke(p){var c=doomRGB(p),lum=.2126*c[0]+.7152*c[1]+.0722*c[2];if(lum<.22){var t=(.22-lum)/.22*.8,B=[.90,.40,.85];c=c.map(function(v,j){return v+(B[j]-v)*t;});}return 'rgb('+c.map(function(v){return Math.round(v*255);}).join(',')+')';}
var BANDS=[[15,'NOMINAL'],[37,'ELEVATED'],[52,'HIGH'],[67,'SEVERE'],[80,'EXTREME'],[92,'CATASTROPHIC'],[101,'TERMINAL']];
/* Text on dark needs 4.5:1. ThemeManager's stroke floor (luminance 0.22) leaves the deep tiers near
   1.8:1 as text, so labels lift the stroke colour toward a pale tint of itself (ring keeps the game colour). */
function lin(v){return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);}
function doomText(p){var m=doomStroke(p).match(/\d+/g).map(function(v){return v/255;});var t=0,c=m;
  while(t<1){c=m.map(function(v){return v+(1-v)*t;});var L=.2126*lin(c[0])+.7152*lin(c[1])+.0722*lin(c[2]);if((L+.05)/(.018+.05)>=4.6)break;t+=.05;}
  return 'rgb('+c.map(function(v){return Math.round(v*255);}).join(',')+')';}
function bandIndex(p){for(var i=0;i<BANDS.length;i++)if(p<BANDS[i][0])return i;return 6;}

/* Only the topmost open layer shows Enter / Esc (council rule). */
var LAYER = (S.view==='actions'||S.view==='plan');   /* a menu is open */
var EVENT = (S.view==='event'||S.view==='review');   /* a dialog owns the keys */
var KEYS = !EVENT;                                   /* background key caps visible */

function build(){
/* ================================================================ the office + doom layer */
/* Art bands (docs/art/PALETTE_AND_DOOM_INTENSITY.md, operational ladder): 0 Cosy amber faint,
   1 Uneasy orange low (slightly dimmed, cooler), 2 Spooky red-orange medium (shadows lengthen,
   desaturated), 3 Eldritch violet high (dark dread, smoke). One ambient grade + one glow source.
   The glow sits on the two lit CRTs; from band 3 the window sky turns red-purple. */
(function(){
  var A = [
    {f:'brightness(.84) saturate(.95) contrast(1.03)', amb:'rgba(40,24,8,.10)', glow:'246,168,0', ga:.22},
    {f:'brightness(.8) saturate(.9) contrast(1.04)',   amb:'rgba(14,22,30,.16)', glow:'233,117,46', ga:.30},
    {f:'brightness(.68) saturate(.7) contrast(1.08)',  amb:'rgba(10,14,24,.30)', glow:'226,74,59', ga:.42},
    {f:'brightness(.5) saturate(.5) contrast(1.12)',   amb:'rgba(16,6,22,.42)', glow:'122,59,143', ga:.75}
  ][S.art];
  add('<div class="art" style="filter:'+A.f+'"></div>');
  add('<div class="grade" style="background:linear-gradient(180deg,'+A.amb+','+A.amb.replace(/[\d.]+\)$/,'0)')+' 45%,'+A.amb+')"></div>');
  if (S.art===3) {
    /* window sky: doomy red-purple behind the back windows */
    add('<div class="sky" style="left:1080px;top:330px;width:560px;height:200px;background:radial-gradient(ellipse at 50% 50%,rgba(150,40,90,.55),rgba(90,30,120,.35) 55%,rgba(60,20,80,0) 80%);mix-blend-mode:color"></div>');
    add('<div class="sky" style="left:1080px;top:330px;width:560px;height:200px;background:radial-gradient(ellipse at 50% 50%,rgba(170,60,120,.22),rgba(170,60,120,0) 70%);mix-blend-mode:screen"></div>');
    /* the screens take the violet glow (hue first, then light) */
    [[226,706,170,130],[606,546,70,56]].forEach(function(g){
      add('<div class="glow" style="left:'+(g[0]-g[2])+'px;top:'+(g[1]-g[3])+'px;width:'+(g[2]*2)+'px;height:'+(g[3]*2)+'px;background:radial-gradient(ellipse,rgba(150,70,200,.95),rgba(150,70,200,0) 70%);mix-blend-mode:color"></div>');
    });
    /* smoke wisps along the floor */
    add('<svg class="smoke" viewBox="0 0 1920 520" preserveAspectRatio="none"><defs><filter id="sm"><feTurbulence type="fractalNoise" baseFrequency=".004 .012" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .48  0 0 0 0 .23  0 0 0 0 .56  0 0 0 1.3 -.55"/></filter>'+
      '<linearGradient id="smf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="smm"><rect width="1920" height="520" fill="url(#smf)"/></mask></defs>'+
      '<rect width="1920" height="520" filter="url(#sm)" mask="url(#smm)"/></svg>');
  }
  /* the one glow source, on the lit monitors */
  [[226,706,230,170],[606,546,110,90]].forEach(function(g){
    add('<div class="glow" style="left:'+(g[0]-g[2])+'px;top:'+(g[1]-g[3])+'px;width:'+(g[2]*2)+'px;height:'+(g[3]*2)+'px;background:radial-gradient(ellipse,rgba('+A.glow+','+A.ga+'),rgba('+A.glow+',0) 70%);mix-blend-mode:screen"></div>');
  });
  add('<div class="vig" style="background:radial-gradient(ellipse 75% 70% at 50% 48%,rgba(20,9,24,0) 50%,rgba(20,9,24,'+(S.art===3?.82:.6)+') 100%)"></div>');
})();

/* ================================================================ top bar */
function res(k,lbl,v,cls,flag,fcls){return '<div class="tb-res">'+ic(k,28)+'<span class="k">'+lbl+'</span><span class="v'+(cls?' '+cls:'')+'">'+v+'</span>'+(flag?'<span class="flag'+(fcls?' '+fcls:'')+'">'+flag+'</span>':'')+'</div>';}
add('<div class="abs topbar">'+
  '<div class="tb-month">'+S.month+'</div>'+
  res('money','Money',S.money,S.moneyFlag?'neg':'',S.moneyFlag)+
  res('compute','Compute',S.compute)+
  res('research','Research',S.research,S.neg?'neg':'',S.neg?'BELOW ZERO':'')+
  res('papers','Papers',S.papers)+
  res('reputation','Reputation',S.rep,S.repFlag?'warnv':'',S.repFlag,'warn')+
  '<div class="tb-sp"></div>'+
  '<div class="tb-menu">'+ic('menu',28)+'Menu'+((LAYER||EVENT)?'':' '+key('Esc'))+'</div>'+
'</div>');

/* ================================================================ banner */
if (S.mode==='watch') {
  var done = S.view==='review';
  add('<div class="abs banner"><span class="mode">## WATCH</span><span class="sub">'+S.date+'</span>'+
    '<div class="pback"><div class="pbar"><i style="width:'+Math.round(S.day/22*100)+'%"></i></div><span class="pday">'+(done?'November played out':'workday '+S.day+' of 22')+'</span></div>'+
    (done?'':'<div class="speed" style="margin-left:24px"><span class="on">||</span><span>1x</span><span>2x</span><span>4x</span></div>')+
    '<div class="switch dim"><span class="vlab">View</span><div class="seg"><span>PLAN</span><span class="on">WATCH</span></div></div></div>');
} else {
  add('<div class="abs banner"><span class="mode">## PLAN</span><span class="sub">'+S.date+'</span>'+
    '<div class="switch"><span class="vlab">View</span><div class="seg"><span class="on">PLAN</span><span>WATCH</span></div>'+key('V','amb')+'</div></div>');
}

/* ================================================================ rail */
function rb(k,lbl,k2,cnt,o){o=o||{};return '<div class="rb'+(o.gap?' gap':'')+(o.on?' on':'')+(o.off?' off':'')+(o.hint?' hint':'')+'">'+ic(k,28)+'<span class="lbl">'+lbl+'</span>'+(cnt!==undefined?'<span class="cnt">'+cnt+'</span>':'')+(KEYS?key(k2):'')+'</div>';}
var W = S.mode==='watch';
var rail = add('<div class="abs rail">'+
  rb('actions','Actions','A',undefined,{on:S.view==='actions',off:W,hint:STATE===1})+
  rb('upgrades','Upgrades','U',undefined,{off:W})+
  rb('staff','Staff','E',S.staff)+
  rb('ledger','Ledger','L',S.ledger)+
  rb('guide','Guide','F1',undefined,{gap:true})+
'</div>');

/* ================================================================ P(Doom) card */
(function(){
  var r=70, c=2*Math.PI*r, ring=doomStroke(S.doom), col=doomText(S.doom), bi=bandIndex(S.doom);
  var lad='', lo=0;
  BANDS.forEach(function(b,i){var hi=Math.min(b[0],100),mid=(lo+hi)/2;lad+='<i class="'+(i===bi?'on':'')+'" style="flex:'+(hi-lo)+';background:'+doomStroke(mid)+';color:'+doomStroke(mid)+'"></i>';lo=hi;});
  /* the game's own free warning at band 5+ (main_ui.gd: "Very close to game over!") */
  var warn = '<div class="dlab">Band '+(bi+1)+' of 7</div>';
  var hwarn = bi>=5 ? '<span class="r" style="color:'+col+';font-weight:600">Very close to game over</span>' : '';
  add('<div class="abs panel p-steel doom">'+
    '<div class="ph"><span class="t" style="display:flex;align-items:center;gap:10px">'+ic('doom',24)+'P(DOOM)</span>'+hwarn+'</div>'+
    '<div class="body">'+
      '<div class="ring"><svg width="168" height="168" viewBox="0 0 168 168">'+
        '<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="14"/>'+
        '<circle cx="84" cy="84" r="'+r+'" fill="none" stroke="'+ring+'" stroke-width="14" stroke-dasharray="'+(c*S.doom/100)+' '+c+'" transform="rotate(-90 84 84)"/>'+
      '</svg><div class="pct" style="color:'+col+'">'+S.doom.toFixed(1)+'%</div></div>'+
      '<div class="dside">'+
        '<div class="band" style="color:'+col+'">'+BANDS[bi][1]+'</div>'+
        (S.rising?'<span class="trend" style="color:'+col+';border:1px solid '+col+'">'+ic('rising',24)+'RISING</span>':'')+
        '<div><div class="ladder">'+lad+'</div></div>'+ warn +
      '</div>'+
    '</div></div>');
})();

/* ================================================================ lower right card */
function card(html){return add('<div class="abs panel p-steel attn" style="bottom:76px">'+html+'</div>');}
function attnHead(r){return '<div class="ph"><span class="t" style="display:flex;align-items:center;gap:10px">'+ic('attention',24)+'ATTENTION</span><span class="r">'+r+'</span></div>';}
function attnBars(pl,op,spill){return '<div class="att">'+
  '<span class="n">Planning</span>'+pips(12,pl,'pl',spill)+'<span class="left'+(pl?'':' zero')+'">'+pl+' left</span>'+
  '<span class="n">Operating</span>'+pips(8,op,'op')+'<span class="left'+(op?'':' zero')+'">'+op+' left</span></div>';}

if (S.view==='home') {
  card(attnHead('20 hr this month')+
    '<div class="sec" style="border-top:none;padding-top:4px">'+attnBars(12,8)+'</div>'+
    '<div class="sec"><div class="sh">THIS MONTH</div><div class="empty" style="margin-top:10px">Nothing queued yet</div></div>'+
    '<div class="sec"><div class="btn ghost">'+ic('actions',24)+'Choose actions '+key('A','amb')+'</div></div>');
} else if (S.view==='actions') {
  card(attnHead('20 hr this month')+
    '<div class="sec" style="border-top:none;padding-top:4px">'+attnBars(9,8)+'</div>'+
    '<div class="sec"><div class="sh">THIS MONTH</div><div style="margin-top:6px">'+
      '<div class="qrow"><span class="no">1</span><span class="qn">'+ic('hire_safety',24)+'Hire: Safety Researcher</span><span class="h pl">1 plan</span></div>'+
      '<div class="qrow"><span class="no">2-3</span><span class="qn">'+ic('read',24)+'Read the Literature<span class="x2">x2</span></span><span class="h pl">2 plan</span></div>'+
      '<div class="qtot"><span>3 plays</span><span class="v">$60,000</span></div></div></div>'+
    '<div class="sec"><div class="btn ghost">Open plan '+key('Q','amb')+'</div></div>');
} else if (S.view==='plan') {
  /* State 3 (ADR-0011 amendment 2026-07-28): 12 planning + 8 operating. Planning work 4 hr;
     operating work 9 hr = 8 operating + 1 spilled into planning. Filled = hours LEFT. */
  card(attnHead('20 hr this month')+
    '<div class="sec" style="border-top:none;padding-top:4px">'+attnBars(7,0,1)+
      '<div class="legend"><span class="pip spill"></span>1 operating hour drawn from planning</div></div>'+
    '<div class="sec"><div class="kv">'+
      '<span>Held for events at Commit</span><span class="v held">7 hr</span>'+
      '<span class="k2">Reserved, up to 7 hr</span><span class="v" style="color:var(--muted)">none yet</span>'+
    '</div></div>'+
    '<div class="sec"><div class="rule">Operating work can use planning hours. Planning work can never use operating hours.</div></div>'+
    '<div class="sec"><div class="btn ghost on">Close plan '+key('Q','amb')+'</div></div>');
} else {
  /* WATCH: the plan ran at Commit; what is left is the untyped hold for events. */
  var rev = S.view==='review';
  card(attnHead(rev?'November, closed':'held after Commit')+
    '<div class="sec" style="border-top:none;padding-top:4px"><div class="att">'+
      '<span class="n">Held</span>'+(function(){var s='';for(var i=0;i<7;i++)s+='<span class="pip" style="border-color:var(--held);'+(i<(rev?0:7)?'background:var(--held)':'')+'"></span>';return '<div class="pips">'+s+'</div>';})()+
      '<span class="left'+(rev?' zero':'')+'">'+(rev?'0 left':'7 left')+'</span></div>'+
      '<div class="kv" style="margin-top:14px">'+
        (rev?'<span>Used on Talent Opportunity</span><span class="v held">1 hr</span><span class="k2">Unspent, evaporated</span><span class="v" style="color:var(--muted)">6 hr</span>'
            :'<span>Spent at Commit</span><span class="v">13 hr</span><span class="k2">This reply would cost</span><span class="v held">1 hr</span>')+
      '</div></div>'+
    '<div class="sec"><div class="sh">STAFF AT WORK</div><div class="staffrow" style="margin-top:12px">'+ic('hire_safety',32)+
      '<span>'+(rev?'2 Safety Researchers':'1 Safety Researcher')+'</span></div></div>');
}

/* ================================================================ bottom bar + Commit */
add('<div class="abs bottombar"><span class="bb-q">'+ic('feedback',24)+'Feedback'+(KEYS?' '+key('N'):'')+'</span></div>');
if (S.mode==='watch') add('<div class="abs commit idle">'+(S.view==='review'?'MONTH COMPLETE':'MONTH IN PLAY')+'</div>');
else add('<div class="abs commit">COMMIT THE MONTH &gt;'+(LAYER?'':' '+key('Enter','dark'))+'</div>');

/* ================================================================ state 1: the advisor's first step */
/* The game's hand-off line after the cold open (GameConfig.first_lever_hint_text), pointed at
   where Scouting lives in G: inside Actions, whose rail button glows. */
if (STATE===1) {
  var adv = add('<div class="abs panel p-amb advisor">'+
    '<div class="ph"><span class="t">ADVISOR</span><span class="r"><span class="xbtn">x</span></span></div>'+
    '<div class="body"><div class="say">You do not know anything yet. Go and find out -- scouting.</div>'+
      '<div class="where">Scouting is in <b style="color:var(--text);font-weight:500">Actions</b>, the glowing button.</div></div>'+
  '</div>');
  add('<div class="pointer" style="left:264px;top:'+(132+26-12)+'px"></div>');
}

/* ================================================================ state 2: Actions menu */
/* All 17 top-level actions the game shows in Nov 2017 (core.json, minus
   action_bar_renderer.gd's hidden ids interview_next / hire_best, minus Team Building, locked
   until 2 staff). Doors open beside their row; the detail card owns Enter / Esc. */
if (S.view==='actions') {
  var A = [
    ['fundraise','Fundraising','4 choices','door'],
    ['financing','Financing','7 choices','door'],
    '-',
    ['hire','Hire Staff','7 roles, 1 plan hr each','door',1],
    ['advertise','Advertise a Role','Not playable yet','soon'],
    ['connections','Work Your Connections','2 op hr, 6 rep','add'],
    ['onboard','Onboard New Hires','<span class="why">no hires waiting</span>','blk'],
    '-',
    ['safety','Safety Research','1 plan hr, 10 research -- <span class="why">22 short</span>','blk'],
    ['capability','Capability Research','1 plan hr, 10 research -- <span class="why">22 short</span>','blk'],
    ['publish','Publish Safety Paper','1 plan hr, 20 research -- <span class="why">32 short</span>','blk'],
    '-',
    ['buycompute','Purchase Compute','$50,000, no hours','add'],
    ['audit','Safety Audit','2 op hr, $40,000','add',0,0,'sel'],
    ['operations','Operations','3 choices','door'],
    ['office','Office','4 choices','door'],
    '-',
    ['scouting','Scouting','3 choices','door',2],
    ['travel','Travel &amp; Conferences','4 choices -- Submit Paper <span class="why">27 research short</span>','door'],

  ];

    var gl = st==='door'?'<span class="gl">&gt;</span>':(st==='add'?'<span class="gl add">+</span>':'<span class="gl"></span>');
    var chips=(a[4]?'<span class="chip">'+a[4]+' in plan</span>':'')+(a[5]?'<span class="chip new">NEW</span>':'')+(st==='soon'?'<span class="chip soon">COMING SOON</span>':'');

  });
  var m = add('<div class="abs panel p-warm amenu"><div class="ph"><span class="t" style="display:flex;align-items:center;gap:10px">'+ic('actions',24)+'ACTIONS</span><span class="r"><span>Hours left: <span style="color:var(--plan);font-family:var(--mono)">9 plan</span>, <span style="color:var(--op);font-family:var(--mono)">8 op</span></span><span class="xbtn">x</span></span></div><div class="alist">'+h+'</div></div>');

    '<div class="body"><div class="t">'+ic('audit',40)+'Safety Audit</div>'+
    '<div class="c">2 operating hours, $40,000</div>'+
    '<p>Comprehensive safety review</p>'+

    '<div class="acts"><div class="btn teal">Add to plan '+key('Enter')+'</div><div class="btn plain">Back '+key('Esc')+'</div></div></div>'+
  '</div>');
  det.style.top = Math.round(sy - det.offsetHeight/2) + 'px';
  add('<div class="conn" style="left:880px;top:'+Math.round(sy-1)+'px;width:24px"></div>');
}

/* ================================================================ state 3: the Plan drawer */
if (S.view==='plan') {
  function ctl(first,last){return '<span class="ctl"><span class="'+(first?'dis':'')+'">&#94;</span><span class="'+(last?'dis':'')+'">v</span><span class="x">x</span></span>';}

    '<div class="ph"><span class="t">THE MONTH AHEAD</span><span class="r">runs top to bottom<span class="xbtn">x</span>'+key('Esc')+'</span></div>'+
    '<div class="ptable"><div class="prow head"><span style="padding-left:6px">#</span><span>PLAY</span><span>HOURS</span><span style="text-align:right">COST</span><span style="text-align:right">ORDER</span></div></div>'+
    '<div class="pbody">'+rows+'</div>'+
    '<div class="ptot">'+
      '<div class="prow tot"><span></span><span>Total: 11 plays</span><span class="hr">4 plan, 9 op</span><span class="mo" style="grid-column:4 / 6">$102,600 + 6 rep</span></div>'+
      '<div class="prow after"><span></span><span class="lab">After these costs</span><span class="mo" style="grid-column:3 / 6">$37,400, 26 rep</span></div>'+
    '</div>'+
    '<div class="sec"><div class="rq"><span class="sh">RESEARCH QUALITY</span><span class="opt">Rushed</span><span class="opt on">Standard</span><span class="opt">Thorough</span></div></div>'+
    '<div class="pfoot"><div class="btn plain">'+ic('undo',24)+'Undo '+key('Z')+'</div><div class="btn plain">'+ic('clear',24)+'Clear '+key('C')+'</div><div class="btn plain">'+ic('attention',24)+'Reserve hours '+key('R')+'</div></div>'+
  '</div>');
  var pm=document.querySelector('.pmenu'), pb=pm.querySelector('.pbody');
  if (pb.scrollHeight > pb.clientHeight+1) {
    pm.classList.add('over');
    var th=Math.max(40,Math.round((pb.clientHeight-8)*pb.clientHeight/pb.scrollHeight));
    var prl=document.createElement('div'); prl.className='prail';
    prl.style.cssText='left:'+(pb.offsetLeft+pb.offsetWidth-14)+'px;top:'+(pb.offsetTop+4)+'px;height:'+(pb.clientHeight-8)+'px';
    prl.innerHTML='<i style="height:'+th+'px"></i>'; pm.appendChild(prl);
  }
}

/* ================================================================ states 4 and 5: the feed */
/* Every queued play executed at Commit on Wed 1 Nov (game_manager.gd); the lines are the
   game's own result messages (actions.gd, hiring_pipeline.gd), cut where they carry a
   random name or number. */
if (S.mode==='watch') {
  /* One shared list of the Commit lines, in queue order (plays 1-11). null = folded into the
     "+ N more" line: the hire names a random researcher, Tour Offices prints random lease
     quotes, and the rest are folded for space. Both states show the same lines. */
  var COMMIT = [
    null,                                                        /* 1 hire */
    null, null,                                                  /* 2-3 read */
    null,                                                        /* 4 post */
    'Safety audit (+scrutiny, +3 reputation)',                   /* 5 */
    null,                                                        /* 6 connections */
    null,                                                        /* 7 meetups */
    'Networking (+3 reputation)',                                /* 8 */
    null,                                                        /* 9 tour offices */
    'Worked the room (+1.5 reputation). No leads you have room for.', /* 10 meetups */
    'Office supplies restocked (+50 stationery, now at 100)'     /* 11 */
  ];
  var shown = COMMIT.filter(function(t){return t;});
  var FL = [['','+ '+(COMMIT.length-shown.length)+' more lines from Wed 1 Nov','more']]
    .concat(shown.map(function(t){return ['Wed 1 Nov',t];}))
    .concat(STATE===4 ? [['Tue 14 Nov','Talent Opportunity: needs a reply.','now']]
                      : [['Tue 14 Nov','Fast-tracked hiring process! (+1 safety researcher)'],
                         ['Fri 1 Dec','Month Review -- December 2017','now']]);
  var fh=''; FL.forEach(function(l){fh+='<div class="fl'+(l[2]?' '+l[2]:'')+'"><span class="d">'+l[0]+'</span><span>'+l[1]+'</span></div>';});
  var fd = add('<div class="abs panel p-steel feed"><div class="ph"><span class="t">FEED</span><span class="r">November 2017</span></div><div style="padding:6px 0 10px">'+fh+'</div></div>');
  fd.style.bottom = '76px';
}

/* ================================================================ state 4: the event */

if (S.view==='event') {

/* ================================================================ layout check (?check=1) */
if (Q.get('check')) Promise.all([].map.call(document.querySelectorAll('img'),function(im){return im.complete?0:new Promise(function(r){im.onload=im.onerror=r;});})).then(runCheck);
function runCheck(){
  var bad=[];
  document.querySelectorAll('#stage *').forEach(function(e){
    if (e.closest('svg')) return;
    var cs=getComputedStyle(e);
    var txt=[].some.call(e.childNodes,function(n){return n.nodeType===3&&n.textContent.trim();});
    if(txt && parseFloat(cs.fontSize)<16) bad.push('small:'+e.className+':'+cs.fontSize+':'+e.textContent.trim().slice(0,20));
    if(txt && (e.scrollWidth>e.clientWidth+1) && cs.overflow!=='visible') bad.push('clip:'+e.className+':'+e.textContent.trim().slice(0,24));
    if(txt && cs.display!=='inline' && e.scrollWidth>e.clientWidth+1 && cs.overflow==='visible') bad.push('overflow:'+e.className+':'+e.textContent.trim().slice(0,24));
    if(txt && e.scrollWidth>e.clientWidth+1 && cs.textOverflow==='ellipsis') bad.push('ellipsis:'+e.textContent.trim().slice(0,24));
    var r=e.getBoundingClientRect(); if(r.width&&!e.classList.contains('glow')&&!e.classList.contains('sky')&&(r.right>1920.5||r.bottom>1080.5||r.left<-.5||r.top<-.5)) bad.push('off:'+e.className);
  });
  document.querySelectorAll('.panel').forEach(function(p){var pr=p.getBoundingClientRect();
    p.querySelectorAll('*').forEach(function(e){if(e.closest('.pbody')&&e!==e.closest('.pbody'))return;var r=e.getBoundingClientRect(); if(r.width&&(r.right>pr.right+1||r.bottom>pr.bottom+1||r.left<pr.left-1)) bad.push('out:'+p.className+'>'+e.className+':'+e.textContent.trim().slice(0,20));});});
  /* text lines inside a box must not wrap onto each other: every element that should be one line */
  document.querySelectorAll('.left,.dlab,.pday,.ft,.dl,.s,.nm,.ct,.k,.v,.lbl,.cnt,.t,.qn,.src,.d,.btn,.chip,.key,.trend,.band').forEach(function(e){
    var cs=getComputedStyle(e),lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.35;
    if(e.getBoundingClientRect().height>lh*1.6 && !e.classList.contains('btn')) bad.push('wrap:'+e.className+':'+e.textContent.trim().slice(0,24));
  });
  /* content wider than its box (grids and rows), and a plan list that scrolls when it should fit */
  document.querySelectorAll('.panel *,.rail *,.topbar *,.banner *').forEach(function(e){
    if (e.closest('svg')||e.classList.contains('pbody')) return;
    var cs=getComputedStyle(e); if(cs.display==='inline') return;
    if(e.scrollWidth>e.clientWidth+1 && e.clientWidth>0) bad.push('wide:'+e.className+':'+e.textContent.trim().slice(0,24));
  });
  var pbx=document.querySelector('.pbody'); if(pbx && pbx.scrollHeight>pbx.clientHeight+1) bad.push('scroll:plan list');
  document.querySelectorAll('img').forEach(function(im){ if(!im.complete||im.naturalWidth===0) bad.push('img:'+im.getAttribute('src')); });
  var ps=[].slice.call(document.querySelectorAll('.panel,.rail,.commit'));
  ps.forEach(function(a,i){ps.slice(i+1).forEach(function(b){var A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
    if(A.left<B.right-1&&B.left<A.right-1&&A.top<B.bottom-1&&B.top<A.bottom-1) bad.push('overlap:'+a.className+' / '+b.className);});});
  document.body.setAttribute('data-check', bad.length?bad.join(' | '):'CLEAN');
}

}

/* ================================================================ scale to the window */
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080),st=document.getElementById('stage');
  st.style.transform='scale('+s+')';st.style.left=Math.round((innerWidth-1920*s)/2)+'px';st.style.top=Math.round((innerHeight-1080*s)/2)+'px';}
var built=false;
function go(){ if(built) return; built=true; build(); if (!Q.get('check')) { fit(); addEventListener('resize',fit); } }
/* load every face the page uses before laying out, so measured heights are final */
var FACES=['400 16px "IBM Plex Sans"','500 16px "IBM Plex Sans"','600 16px "IBM Plex Sans"','400 16px "IBM Plex Mono"','500 16px "IBM Plex Mono"','600 16px "IBM Plex Mono"'];
if (document.fonts && document.fonts.load) { Promise.all(FACES.map(function(f){return document.fonts.load(f);})).then(go,go); setTimeout(go, 3000); } else { go(); }
</script>
