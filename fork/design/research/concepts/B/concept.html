<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P(Doom)1 - Mainframe OS</title>
<style>
:root {
  color-scheme: light;
  --ui: Tahoma, "Segoe UI", sans-serif;
  --mono: Consolas, "Lucida Console", monospace;
  --ink: #30232e;
  --muted: #675565;
  --paper: #efe7d5;
  --rule: #c9bba5;
  --beige: #bcb1a2;
  --ivory: #fff1d9;
  --amber: #ffd08a;
  --coral: #ff9975;
  --danger: #8d3e37;
}
* { box-sizing: border-box; }
body { margin: 0; background: #382936; font: 18px/1.28 var(--ui); color: var(--ink); }
button, select, a { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid #a34d23;
  outline-offset: -3px;
}
button:active:not(:disabled) { filter: brightness(.93); }
h1, h2, h3, p, figure { margin: 0; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
.shell {
  width: 1920px; height: 1080px; position: relative; overflow: hidden;
  border: 2px solid #7c636b;
  background:
    linear-gradient(117deg, #442e45 17%, transparent 71%, #6b443566),
    linear-gradient(160deg, #523b50, #754f52);
}
.wallpaper {
  position: absolute; inset: 112px 0 67px; pointer-events: none;
  background:
    linear-gradient(90deg, #493346b8 1%, #53374892 34%, #6d3d4055 64%, #75423720),
    linear-gradient(0deg, #57394bea, transparent 24%),
    url("assets/office_wide_dawn.webp") right 52% / cover;
}
.wallpaper::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(transparent 0 3px, #291b2945 3px 4px);
}
.m5 .wallpaper { box-shadow: inset -170px 0 310px #9a4a381f; }
.shell::after {
  content: ""; position: absolute; z-index: 23; inset: 0; border: 1px solid #ffffff34; pointer-events: none;
}
.status-bar, .taskbar {
  position: absolute; left: 0; right: 0; z-index: 20; color: var(--ivory);
  background:
    linear-gradient(#64495bea, #3e2c3eee),
    url("assets/tex_painted_metal_panel_512.png") center / 360px;
  box-shadow: inset 0 1px #a58791, inset 0 -2px #2b1d2a, 0 4px 12px #291b2bb0;
}
.status-bar {
  top: 0; height: 112px; display: grid; align-items: center;
  grid-template-columns: 262px 237px 700px 240px 1fr; padding: 12px 38px; gap: 18px;
}
.masthead { display: flex; align-items: center; gap: 14px; }
.masthead-mark {
  width: 52px; height: 48px; display: grid; place-items: center;
  background: #322331; box-shadow: inset 1px 1px #af8b95, inset -1px -1px #271a26;
}
.masthead-mark .pixel { width: 34px; height: 34px; }
.masthead-name { font: bold 28px/1 var(--mono); letter-spacing: -.6px; }
.masthead-sub, .bar-label, .instrument-label {
  color: #e7ced0; font: bold 14px/1.15 var(--mono); letter-spacing: 1.1px; text-transform: uppercase;
}
.masthead-sub { margin-top: 7px; }
.calendar { border-left: 1px solid #9b7884; padding-left: 20px; }
.calendar-date { margin-top: 5px; font: bold 28px/1.12 var(--mono); }
.attention-unit { padding-left: 20px; border-left: 1px solid #9b7884; }
.attention-grid { margin-top: 6px; display: grid; grid-template-columns: 245px 220px 1fr; gap: 12px; }
.hours-module {
  background: #362737; color: #f9e7d0; border: 1px solid #a38991; border-top-color: #281b28;
  box-shadow: inset 1px 1px #291a2a; padding: 5px 9px 6px; min-height: 57px;
}
.hours-caption { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hours-module b { font: bold 17px/1.05 var(--mono); white-space: nowrap; }
.pips { margin-top: 7px; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; }
.pip { height: 10px; border: 1px solid #9c7887; background: #5b3e50; }
.pip.free { border-color: #dfab71; background: #eac18a; }
.pips.ops .pip.free { border-color: #9bbeb1; background: #a7c8b2; }
.reserve-line { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.reserve-buttons { display: flex; gap: 3px; }
.reserve-buttons button {
  width: 30px; height: 27px; padding: 0; font: bold 18px/1 var(--mono);
}
.reserve-note { color: #ebcfc6; font-size: 14px; margin-top: 3px; }
.instrument {
  min-width: 0; background: #302333; border: 1px solid #a58390; border-top-color: #291a27;
  box-shadow: inset 2px 2px #221824; padding: 6px 12px 7px; min-height: 78px;
}
.instrument.doom { padding-inline: 16px; }
.instrument-line { display: flex; align-items: baseline; gap: 13px; white-space: nowrap; }
.instrument-value { font: bold 35px/1.12 var(--mono); color: var(--amber); }
.doom .instrument-value { font-size: 40px; }
.m5 .doom .instrument-value { color: var(--coral); }
.instrument-state { font: bold 16px/1 var(--mono); color: #ffb698; }
.meter {
  height: 8px; background: #664d61; border: 1px solid #9e7c8d; position: relative; margin-top: 4px;
}
.meter i { display: block; height: 100%; background: #c1bea0; }
.doom .meter i { background: #efb274; }
.m5 .doom .meter i { background: var(--coral); }
.meter::after {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), #322135 0 10%);
}
.desktop { position: absolute; inset: 136px 38px 86px; }
.os-window {
  background: var(--beige);
  border: 2px solid; border-color: #f5e6d5 #402c3b #402c3b #f5e6d5;
  box-shadow: inset 1px 1px #dcc7b8, inset -1px -1px #745e64, 4px 5px 0 #2d1d35ac, 0 12px 25px #2b1e3545;
  padding: 4px;
}
.os-title {
  min-height: 38px; background: linear-gradient(90deg, #402d45, #674862 74%, #785666);
  color: #fff3dd; display: flex; align-items: center; justify-content: space-between;
  padding: 3px 7px 3px 10px; gap: 8px; border-bottom: 1px solid #271d2c;
}
.os-title h1, .os-title h2, .os-title h3 {
  display: flex; align-items: center; gap: 10px;
  font: bold 18px/1 var(--mono); letter-spacing: .35px;
}
.os-title .title-end { display: flex; align-items: center; gap: 9px; }
.title-context { font: 16px/1 var(--mono); color: #f7dcc9; }
.os-control {
  color: var(--ink); border: 2px solid; border-color: #f9ecd7 #69545a #69545a #f9ecd7;
  min-height: 32px; padding: 3px 11px; background: linear-gradient(#e5d8bf, #c6b6a8);
  font-size: 16px; font-weight: bold; text-align: left;
}
.os-control:disabled { color: #634f5a; background: #d9cdb9; }
.os-control:hover:not(:disabled) { background: #ffe0a9; }
.os-control.close { min-height: 27px; min-width: 28px; padding: 0 6px; text-align: center; font: bold 18px/1 var(--mono); }
.os-control.tray-control { display: flex; align-items: center; gap: 9px; height: 42px; min-width: 114px; }
.pixel { width: 23px; height: 23px; image-rendering: pixelated; flex: none; }
.window-inner { border: 1px solid; border-color: #665358 #f6ead1 #f6ead1 #665358; }
.plan-window { position: absolute; inset: 0 602px 0 0; display: flex; flex-direction: column; }
.plan-grid { display: grid; grid-template-columns: 474px 1fr; min-height: 0; flex: 1; }
.action-directory {
  min-height: 0; display: flex; flex-direction: column; padding: 13px 12px 12px;
  background: #c7b8a9; border-right: 2px solid #8a7475;
}
.directory-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 2px 6px 8px;
}
.directory-head h2 { font-size: 21px; letter-spacing: -.2px; }
.dir-count { color: var(--muted); font: 16px/1 var(--mono); }
.action-list { border-top: 1px solid #8d7873; overflow-y: auto; }
.action-group {
  display: flex; align-items: center; min-height: 23px; padding: 2px 10px;
  font: bold 14px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase;
  color: #f9ecd7; background: #594855;
}
.action-line {
  display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; align-items: center; gap: 2px 7px;
  width: 100%; min-height: 34px; padding: 3px 8px 3px 10px;
  color: var(--ink); background: #eee2c9;
  border: 0; border-bottom: 1px solid #b9a68f; box-shadow: inset 0 1px #fff2d9;
  font-size: 17px; line-height: 1.08; text-align: left;
}
.action-line:has(.action-reason) { min-height: 46px; }
.action-line strong { font-weight: bold; }
.action-line .action-cost { font: 16px/1.06 var(--mono); white-space: nowrap; color: #4a3a47; }
.action-line .action-reason { grid-column: 1 / -1; font: bold 16px/1.12 var(--ui); color: var(--danger); }
.action-line.is-blocked { background: #ded0bb; }
.action-line:not(.is-blocked):hover, .action-line.is-open, .choice-line:not(.is-blocked):hover {
  background: #ffda99; box-shadow: inset 3px 0 #a76739;
}
.action-line .door-indicator, .action-line .add-indicator { font: bold 19px/1 var(--mono); color: #5f3a34; text-align: right; }
.door-indicator::before { content: "\25B8"; }
.add-indicator::before { content: "+"; }
.directory-foot {
  margin-top: auto; padding: 9px 7px 0; display: flex; gap: 12px; align-items: center;
  color: #4e3745; font-size: 16px;
}
.plan-body {
  background: var(--paper); min-width: 0; min-height: 0; display: flex; flex-direction: column;
  padding: 23px 24px 14px; overflow: hidden;
}
.document-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-end; margin-bottom: 15px; }
.document-head h2 { font-size: 46px; line-height: 1.12; letter-spacing: -1.6px; }
.document-state {
  color: #794229; background: #ead2ab; border: 1px solid #b58a67;
  white-space: nowrap; font: bold 15px/1.1 var(--mono); padding: 6px 8px;
}
.docket { display: flex; flex-direction: column; }
.sheet-line {
  display: grid; grid-template-columns: 63px minmax(0, 1fr) 209px 98px; align-items: center;
  column-gap: 8px; min-height: 42px; padding: 3px 9px; border-bottom: 1px solid var(--rule);
  font-size: 17px; text-align: left;
}
.sheet-line:nth-child(even) { background: #f8efdc; }
.sheet-line.table-head {
  color: #f9ecd7; background: #5a4c59; min-height: 33px; font: bold 15px/1 var(--mono); letter-spacing: .45px;
}
.sheet-pos { color: #6f5661; font: bold 16px/1 var(--mono); }
.sheet-cost { font: 17px/1 var(--mono); }
.row-tools { display: flex; justify-content: flex-end; gap: 3px; }
.row-tools button { width: 29px; min-height: 27px; padding: 1px 0; text-align: center; font: bold 17px/1 var(--mono); }
.row-tools .os-control:disabled { opacity: .47; }
.queue-lines {
  flex: 1; min-height: 0; max-height: 284px; overflow-y: auto; scrollbar-color: #a78f89 #e2d6bf;
  border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
}
.queue-empty {
  position: relative; min-height: 283px;
  background:
    linear-gradient(90deg, transparent 78%, #c9bba544 78% 78.2%, transparent 78.2%),
    repeating-linear-gradient(#f8efdc 0 41px, #d9ccb6 41px 42px, #efe7d5 42px 83px, #d9ccb6 83px 84px);
  display: flex; align-items: flex-start; justify-content: flex-start;
}
.queue-empty p {
  padding: 11px 14px; margin: 35px 17px; background: #f6ecd8; color: #574351;
  border: 1px solid #c9b69b; box-shadow: 2px 2px #c9b69b68;
  font-weight: bold; font-size: 22px;
}
.queue-tools {
  display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 10px 0 16px;
}
.queue-tools .queue-count { margin-right: auto; color: var(--muted); font-size: 16px; }
.timeline { margin-top: 5px; }
.timeline h2 { font-size: 25px; margin-bottom: 11px; letter-spacing: -.25px; }
.runway {
  display: grid; grid-template-columns: 237px repeat(3, 1fr);
  border: 1px solid var(--rule); color: #412f40;
  background: linear-gradient(90deg, #f4ead4, #efe1c5);
}
.runway > div { min-width: 0; }
.runway-head {
  padding: 8px 7px; min-height: 32px; border-bottom: 1px solid var(--rule);
  font: bold 14px/1 var(--mono); background: #d8c9b3; letter-spacing: .15px;
}
.runway-head:not(:first-child) { border-left: 1px solid #b8a48d; }
.runway-name {
  display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--rule); font-size: 16px; font-weight: bold;
}
.runway-track {
  position: relative; min-height: 53px; grid-column: span 3; border-bottom: 1px solid var(--rule);
  background: repeating-linear-gradient(90deg, #c4ad935e 0 1px, transparent 1px calc(100% / 3));
}
.runway-print {
  position: absolute; left: 0; top: 12px; display: flex; align-items: center; justify-content: flex-end; min-height: 29px;
  font: bold 16px/1 var(--mono); padding: 2px 9px 2px 6px; background: #ddab75; border: 1px solid #a26945;
  color: #392c39; border-right: 4px solid #805044; white-space: nowrap;
}
.runway-print.paper-bar { background: #b8c4ad; border-color: #779084; border-right-color: #527268; }
.runway-empty { grid-column: 1 / -1; min-height: 107px; padding: 14px 10px; color: var(--muted); font-size: 18px; }
.plan-settings {
  margin-top: auto; padding-top: 13px; border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.quality-options { display: flex; align-items: center; gap: 5px; }
.quality-options .os-control[aria-pressed="true"] {
  background: #c2c8af; border-color: #76645b #f9ecd7 #f9ecd7 #76645b;
}
.side-stack { position: absolute; top: 0; right: 0; bottom: 0; width: 575px; display: flex; flex-direction: column; gap: 17px; }
.ledger-body {
  display: grid; grid-template-columns: 1fr 1fr; background: #e6d7be;
}
.stat-cell { min-height: 95px; padding: 11px 14px; border: 1px solid var(--rule); }
.stat-cell .stat-label { font: bold 15px/1 var(--mono); text-transform: uppercase; letter-spacing: .7px; color: #624b59; }
.stat-cell strong { display: block; margin-top: 5px; font: bold 35px/1 var(--mono); }
.stat-cell .deficit { color: var(--danger); display: flex; align-items: center; gap: 12px; }
.stat-cell .deficit span { font-size: 15px; padding: 4px 6px; border: 1px solid #ae7967; background: #f3d4bf; }
.staff-body { background: #d9d9c3; color: #344539; }
.staff-summary {
  display: flex; align-items: center; gap: 13px; min-height: 69px; padding: 8px 12px;
}
.staff-summary > div { flex: 1; }
.staff-summary strong { display: block; font-size: 20px; }
.staff-summary small { color: #46574c; font-size: 16px; }
.staff-avatar, .staff-empty-icon {
  width: 45px; height: 45px; border: 2px solid #526452; object-fit: cover;
}
.staff-empty-icon { padding: 7px; background: #6d7e68; image-rendering: pixelated; }
.mail-window { margin-top: auto; }
.mail-status {
  display: flex; align-items: center; gap: 13px;
  min-height: 59px; padding: 9px 13px; background: #e7d5b6; font-weight: bold;
}
.mail-status .pixel { width: 30px; height: 30px; }
.taskbar {
  bottom: 0; height: 69px; display: flex; align-items: center; gap: 9px; padding: 9px 38px;
}
.tray-control.active {
  background: #f1cc95; border-color: #684532 #f8e0bc #f8e0bc #684532;
  box-shadow: inset 0 0 0 1px #b8865b;
}
.tray-divider { height: 37px; width: 2px; border-left: 1px solid #2e2130; background: #aa8996; margin: 0 4px; }
.taskbar-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.commit-summary { color: #f0d7cd; font-size: 16px; text-align: right; }
.commit-month {
  min-height: 46px; min-width: 236px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 5px 13px; background: linear-gradient(#ffda9b, #e7a66d);
  border-color: #ffe8bc #75463a #75463a #ffe8bc;
  font: bold 22px/1 var(--mono); color: #392936;
}
.commit-month .pixel { width: 25px; height: 25px; }
.popup {
  position: absolute; z-index: 10; left: 471px; width: 607px; box-shadow: 5px 7px #302034bc, 0 12px 30px #3020336e;
}
.popup-content { background: var(--paper); padding: 9px; }
.choice-line {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 5px 10px;
  padding: 9px 10px; min-height: 41px; width: 100%; text-align: left; font-size: 18px;
  background: #e9dac0; border: 0; border-bottom: 1px solid #b8a58e; box-shadow: inset 0 1px #fbf2dd;
}
.choice-line.is-blocked { background: #ded0bb; }
.choice-line .action-cost { font: 16px/1.15 var(--mono); text-align: right; }
.choice-line .action-reason { color: var(--danger); font-weight: bold; font-size: 16px; }
.app-window { position: absolute; left: 0; top: 0; width: 1066px; z-index: 11; }
.proc-window { width: 1236px; }
.proc-window .app-frame { padding: 25px 25px 28px; }
.proc-window .proc-grid { grid-template-columns: 1fr 398px; }
.proc-window .proc-photo { min-height: 260px; }
.app-frame { background: var(--paper); padding: 25px; }
.app-heading { margin: 0 0 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 15px; }
.app-heading h2 { font-size: 40px; line-height: 1.12; letter-spacing: -.9px; }
.app-heading p { color: var(--muted); font-size: 17px; }
.proc-grid { display: grid; grid-template-columns: 1fr 329px; gap: 15px; }
.proc-list { border: 1px solid var(--rule); }
.proc-headers, .proc-item { display: grid; grid-template-columns: 1fr 104px 121px; align-items: center; gap: 9px; padding: 6px 10px; }
.proc-headers { background: #5a4c59; color: #f9ecd7; font: bold 15px/1.1 var(--mono); min-height: 33px; }
.proc-item { min-height: 55px; border-bottom: 1px solid var(--rule); background: #f8efdc; font-size: 17px; }
.proc-item:nth-child(odd) { background: #ebdfc7; }
.proc-item.selected { background: #f7d399; box-shadow: inset 3px 0 #9e673d; }
.proc-item > button:first-child {
  font-weight: bold; text-align: left; background: transparent; padding: 3px 0; border: 0;
}
.proc-item > span { font: 17px/1.1 var(--mono); }
.proc-item > b { color: var(--danger); font-size: 16px; }
.proc-detail { border: 1px solid #aa978a; background: #ded2bd; display: flex; flex-direction: column; }
.proc-photo { position: relative; min-height: 194px; background: url("assets/office_lab_aisle.webp") center 51% / cover; }
.proc-photo::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 3px, #49363e66 3px 4px); }
.proc-copy { padding: 15px; }
.proc-copy h3 { margin-bottom: 6px; font-size: 23px; }
.proc-copy p { font-size: 17px; }
.proc-copy .proc-state { margin-top: 16px; font-weight: bold; }
.proc-copy .proc-state.is-blocked { color: var(--danger); }
.records { display: grid; margin-top: 16px; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.record { border: 1px solid var(--rule); background: #f8efdc; padding: 12px; min-height: 84px; }
.record h3 { font-size: 22px; }
.record p { color: var(--muted); }
.record.staff-card { display: flex; align-items: center; gap: 14px; }
.record .staff-avatar { width: 81px; height: 81px; }
.guide-list { margin: 13px 0 0; padding-left: 20px; }
.guide-list li { margin: 8px 0; }
.watch-layout { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1.57fr) minmax(0, 1fr); gap: 22px; }
.office-window, .watch-mail { display: flex; flex-direction: column; }
.camera {
  height: 548px; position: relative;
  background:
    linear-gradient(0deg, #4c263c85, transparent 34%),
    linear-gradient(83deg, #6f38392c, #dc765930),
    url("assets/office_lab_aisle.webp") center 50% / cover;
  overflow: hidden;
}
.camera::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(transparent 0 4px, #231c3451 4px 5px);
}
.operator { position: absolute; width: 265px; height: 273px; left: 46%; bottom: -12px; }
.operator-head {
  position: absolute; width: 96px; height: 117px; left: 119px; top: 15px;
  background: linear-gradient(100deg, #302335 4%, #352632 70%, #735047 98%);
  border-radius: 53% 44% 43% 50%; transform: rotate(-9deg);
  clip-path: polygon(0 27%, 9% 14%, 24% 4%, 48% 0, 70% 3%, 85% 12%, 93% 27%, 92% 44%, 100% 61%, 92% 68%, 92% 75%, 90% 80%, 82% 89%, 75% 94%, 75% 100%, 23% 100%, 24% 89%, 12% 80%, 3% 61%);
  box-shadow: inset -3px 2px 3px #a2775b99;
}
.operator-head::after, .operator-back::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: .22; mix-blend-mode: screen;
  background: url("assets/tex_painted_metal_panel_512.png") center / 145px;
}
.operator-back {
  position: absolute; inset: 114px 5px -14px 44px;
  border-radius: 53% 44% 0 0; transform: rotate(-12deg);
  background:
    linear-gradient(70deg, transparent 65%, #22192345 66%, transparent 70%) 25px 0,
    linear-gradient(117deg, #262231, #352635 76%, #725143);
  box-shadow: inset -4px 4px 6px #a2775b4f;

const fixture = later

  : { money: 245000, compute: 100, research: 0, papers: 0, reputation: 50, doom: "20.0" };
const state = {
  ...fixture, role: later ? "Safety Researcher" : "", reserve: 0, quality: "Standard",
  queue: [], procSelection: 2, purchases: new Set(), watch: view === "watch",
  app: view === "place2" ? "proc" : null, popup: null, reply: "", commitReserve: 0, review: false
};

const patterns = {
  monitor: [
    "............","..aaaaaaaa..",".accccccccb.",".acddccdccb.",".acccdccccb.",".acccddcccb.",
    ".accccccccb.",".abbbbbbbbb.","....abba....","..aaaaaaaa..","............","............"
  ],
  plan: [
    "...aaaaaa...","..abccccca..","..abccccba..","..acdddcca..","..acccccca..","..acdddcca..",
    "..acccccca..","..acdddcca..","..acccccca..","..aaaaaaaa..","............","............"
  ],
  staff: [
    "............","....aaaa....","...acccca...","...acbbca...","...acccca...","....acca....",
    "..aabbbbaa..",".abbbddbbba.",".abbbbbbbba.","..aaaaaaaa..","............","............"
  ],
  ledger: [
    "............","..aaaaaaaa..",".abccccccca.",".abdddcccca.",".abccccccca.",".abdddcccca.",
    ".abccccccca.",".abdddcccca.",".abccccccca.","..aaaaaaaa..","............","............"
  ],
  proc: [
    ".....aa.....","...aabbaa...","..abbbbaa...",".acccccccca.",".adccdccdda.",".adccdccdda.",
    ".adccdccdda.",".adccdccdda.",".adccdccdda.","..aaaaaaaa..","............","............"
  ],
  mail: [
    "............","............",".aaaaaaaaaa.",".abccccccba.",".adabccabad.",".adcaabacca.",
    ".adcccaccca.",".adccccccca.",".aaaaaaaaaa.","............","............","............"
  ],
  guide: [
    "............",".aaa..aaaa..",".acaaaaccba.",".acdccadcca.",".accccadcca.",".acdccaccca.",
    ".accccadcca.",".acdccaccca.",".accccadcca.","..aaaaaaaa..","............","............"
  ],
  play: [
    "............","..aaaaaaaa..",".abccccccca.",".abcdccccca.",".abcddcccca.",".abcdddccca.",
    ".abcddcccca.",".abcdccccca.",".abccccccca.","..aaaaaaaa..","............","............"
  ]
};
const iconSources = Object.fromEntries(Object.entries(patterns).map(([name, rows]) => {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 12;
  const ctx = canvas.getContext("2d");
  const palette = { a: "#482c40", b: "#ae7457", c: "#efc587", d: "#fff0c7" };
  if (name === "monitor") Object.assign(palette, { a: "#b4837f", b: "#b58775", c: "#3f2e42", d: "#f3b369" });
  if (name === "staff") Object.assign(palette, { b: "#7b9d87", c: "#edae84", d: "#c4cc9d" });
  if (name === "ledger") Object.assign(palette, { b: "#7b9d87", c: "#e6d2a1", d: "#916147" });
  rows.forEach((row, y) => [...row].forEach((pixel, x) => {
    if (pixel === ".") return;
    ctx.fillStyle = palette[pixel];
    ctx.fillRect(x, y, 1, 1);
  }));
  return [name, canvas.toDataURL()];
}));

const icon = name => '<img class="pixel" width="23" height="23" alt="" src="' + iconSources[name] + '">';
const money = number => "$" + number.toLocaleString("en-US");
const names = { plan: "PLAN.EXE", staff: "STAFF", ledger: "LEDGER", proc: "PROCUREMENT", mail: "MAIL", guide: "Player Guide" };
const actionGroups = [
  ["Funding & people", [
    { id: "fundraise", name: "Fundraising" },
    { id: "hire_staff", name: "Hire Staff" },
    { id: "advertise", name: "Advertise a Role", reason: "Coming soon", price: "Cost pending" },
    { id: "use_connections", name: "Work Your Connections", cost: { attention: 2, reputation: 6 }, hours: "op" },
    { id: "onboard_next", name: "Onboard New Hires", reason: later ? "No hires awaiting onboarding" : "Nobody hired yet", price: "1 hr + step cost" }
  ]],
  ["Research & infrastructure", [
    { id: "safety_research", name: "Safety Research", cost: { attention: 1, research: 10 }, hours: "plan" },
    { id: "capability_research", name: "Capability Research", cost: { attention: 1, research: 10 }, hours: "plan" },
    { id: "publish_paper", name: "Publish Safety Paper", cost: { attention: 1, research: 20 }, hours: "plan" },
    { id: "travel", name: "Travel & Conferences" },
    { id: "buy_compute", name: "Purchase Compute", cost: { money: 50000 }, price: "$50,000 / 0 hr" },
    { id: "audit_safety", name: "Safety Audit", cost: { attention: 2, money: 40000 }, hours: "op", later: true }
  ]],
  ["Lab operations", [
    { id: "operations", name: "Operations" },
    { id: "office", name: "Office" },
    { id: "publicity", name: "Publicity" },
    { id: "financing", name: "Financing" },
    { id: "scouting", name: "Scouting" },
    { id: "strategic", name: "Strategic", later: true }
  ]]
];
const actionIndex = new Map(actionGroups.flatMap(([, actions]) => actions).map(action => [action.id, action]));
const choiceExtras = {
  sign_lease_coworking_corner: { price: "1 plan hr + quote", reason: "Tour offices first" },
  sign_lease_walkup_office: { price: "1 plan hr + quote", reason: "Tour offices first" },
  sign_lease_university_annex: { price: "1 plan hr + quote", reason: "Tour offices first" },
  attend_conference_trip: { price: "Varies by trip", reason: "Select a conference trip" },
  send_delegation: { reason: "Coming soon" },
  accept_financing_offer: { price: "1 plan hr + offer terms", reason: "No offers received" },
  pay_bills: { price: "1 plan hr + bill amount", reason: "No payable bills" },
  scout_shitpost: { cost: { attention: 1, reputation: 1 } }
};
const child = (door, id) => ({ ...catalog[door].find(action => action.id === id), ...choiceExtras[id] });

if (later) {
  const read = child("scouting", "scout_read");
  const hire = child("hire_staff", "hire_safety_researcher");
  state.queue.push(
    child("scouting", "scout_meetups"), { ...hire, name: "Hire: " + hire.name }, read,
    child("operations", "office_maintenance"), child("publicity", "network"),
    ...Array.from({ length: 10 }, () => read)
  );
}

const upgrades = [
  { name: "Buy Comfy Office Chairs", price: 0, detail: "Nicer chairs for the lab." },
  { name: "Accounting Software", price: 0, detail: "Basic bookkeeping software." },
  { name: "Supply Management System", price: 25000, detail: "Auto-orders office supplies when stock runs low." },
  { name: "Secure Cloud Provider", price: 160000, detail: "Limits the lab's capability growth from research breakthroughs." },
  { name: "Upgrade Computer System", price: 200000, detail: "Adds 1 research to capability research actions." },
  { name: "Research Automation Suite", price: 600000, detail: "Research effectiveness scales with compute." },
  { name: "High-Performance Computing Cluster", price: 800000, detail: "Adds 20 compute and improves research effectiveness by 25%." }
];

function availableHours() {
  let operating = 8;
  let planning = 12;
  for (const action of state.queue) {
    const hours = action.cost?.attention ?? 0;
    if (action.hours === "plan") {
      planning -= hours;
    } else {
      const operatingSpend = Math.min(operating, hours);
      operating -= operatingSpend;
      planning -= hours - operatingSpend;
    }
  }
  return { planning, operating, unspent: planning + operating };
}

function openWatch() {
  state.commitReserve = availableHours().unspent;
  if (later && state.queue[0]?.id === "scout_meetups") state.money -= state.queue[0].cost.money;
  state.watch = true;
}

if (state.watch) openWatch();

function costs(action) {
  const cost = action.cost || {};
  const parts = [];
  if (action.price) parts.push(action.price);
  else if (cost.attention) parts.push(cost.attention + " " + (action.hours ? action.hours + " " : "") + "hr");
  if (!action.price && cost.money) parts.push(money(cost.money));
  if (cost.research) parts.push(cost.research + " research");
  if (cost.reputation) parts.push(cost.reputation + " rep");
  if (cost.papers) parts.push(cost.papers + (cost.papers === 1 ? " paper" : " papers"));
  return parts.join(" / ") || "No cost";
}

function blockedReason(action) {
  if (action.reason) return action.reason;
  const cost = action.cost || {};
  const { planning, unspent } = availableHours();
  if (action.hours === "plan" && cost.attention > planning) return planning === 0 ? "No planning hours left" : "Needs more planning hours";
  if (cost.attention && cost.attention > unspent - state.reserve) return "Not enough unreserved hours";
  if (cost.research > state.research) return "Needs " + cost.research + " research";
  if (cost.money > state.money) return "Not enough cash for this plan";
  if (cost.papers > state.papers) return "Needs " + cost.papers + (cost.papers === 1 ? " paper" : " papers");
  if (cost.reputation > state.reputation) return "Needs " + cost.reputation + " reputation";
  return "";
}

function osButton(label, attributes = "", classes = "") {
  return '<button type="button" class="os-control ' + classes + '" ' + attributes + '>' + label + "</button>";
}

function panel(title, symbol, className, contents, end = "") {
  return '<section class="os-window ' + className + '"><header class="os-title"><h2>' +
    icon(symbol) + title + '</h2><div class="title-end">' + end + '</div></header>' + contents + '</section>';
}

function trayButton(app, label = names[app]) {
  const active = state.app === app || (app === "plan" && !state.app && !state.watch);
  return osButton(icon(app) + label, 'data-app="' + app + '" aria-pressed="' + active + '"',
    "tray-control" + (active ? " active" : ""));
}

function meter(value) {
  return '<div class="meter" aria-hidden="true"><i style="width:' + value + '%"></i></div>';
}

function typedHours(label, free, total, style) {
  const pips = Array.from({ length: total }, (_, i) => '<i class="pip' + (i < free ? " free" : "") + '"></i>').join("");
  return '<div class="hours-module"><div class="hours-caption"><span class="bar-label">' + label +
    '</span><b>' + free + ' / ' + total + ' h free</b></div><div class="pips ' + style + '" style="--n:' + total + '" aria-hidden="true">' +
    pips + "</div></div>";
}

function renderFrame() {
  shell.classList.toggle("m5", later);
  const hours = availableHours();
  const phase = state.watch ? "WATCH" : "PLAN";
  const reserveButtons = state.watch ? "" :
    '<div class="reserve-buttons">' +
      osButton("-", 'data-reserve="-1" aria-label="Release one hour from reserve"' + (state.reserve === 0 ? " disabled" : "")) +
      osButton("+", 'data-reserve="1" aria-label="Set aside one hour in reserve"' + (state.reserve === hours.unspent ? " disabled" : "")) +
    '</div>';
  bar.innerHTML =
    '<div class="masthead"><span class="masthead-mark">' + icon("monitor") + '</span><div><div class="masthead-name">MAINFRAME</div><div class="masthead-sub">Lab Workstation</div></div></div>' +
    '<div class="calendar"><span class="bar-label">' + phase + '</span><div class="calendar-date">' + (state.watch ? shortDate : month) + '</div></div>' +
    '<section class="attention-unit" aria-label="Attention"><div class="bar-label">Attention</div><div class="attention-grid">' +
      typedHours("Planning", state.watch ? 0 : hours.planning, 12, "planning") +
      typedHours("Operating", state.watch ? 0 : hours.operating, 8, "ops") +
      '<div class="hours-module"><div class="reserve-line"><span class="bar-label">Reserve</span><b>' + (state.watch ? state.commitReserve : state.reserve) +
      ' h</b>' + reserveButtons + '</div><div class="reserve-note">' + (state.watch ? "Available for events" : "Set aside for events") + '</div></div></div></section>' +
    '<section class="instrument doom" aria-label="P(Doom)"><div class="instrument-label">P(Doom)</div><div class="instrument-line"><strong class="instrument-value">' +
      state.doom + '%</strong>' + (later ? '<span class="instrument-state">&#8593; Rising</span>' : '') + '</div>' + meter(+state.doom) + '</section>' +
    '<section class="instrument" aria-label="Reputation"><div class="instrument-label">Reputation</div><div class="instrument-value">' +
      state.reputation + '</div>' + meter(state.reputation) + '</section>';
  const leftButtons = state.watch
    ? osButton(icon("monitor") + "WATCH", 'data-app="watch" aria-pressed="' + !state.app + '"', "tray-control" + (state.app ? "" : " active")) +
      trayButton("mail", state.reply || !later ? "MAIL" : "MAIL (1)") + trayButton("staff") + trayButton("ledger")
    : trayButton("plan") + '<span class="tray-divider" aria-hidden="true"></span>' +
      ["staff", "ledger", "proc", "mail"].map(app => trayButton(app)).join("");
  taskbar.innerHTML = leftButtons + '<span class="tray-divider" aria-hidden="true"></span>' + trayButton("guide") +
    '<div class="taskbar-right">' +
    (state.watch
      ? '<span class="commit-summary">' + (state.reply || !later ? "Watching the month" : "Paused for reply") + '</span>'
      : osButton("Commit the month" + icon("play"), 'data-commit', "commit-month")) +
    '</div>';
}

function actionLine(action) {
  const door = catalog[action.id];
  const hint = blockedReason(action);
  const price = door ? door.length + " choices / varies" : costs(action);
  return '<button type="button" class="action-line' + (hint ? " is-blocked" : "") + (state.popup === action.id ? " is-open" : "") +
    '" data-action="' + action.id + '"' + (hint ? ' aria-disabled="true"' : '') +
    (door ? ' aria-expanded="' + (state.popup === action.id) + '"' : "") + '><strong>' + action.name +
    '</strong><span class="action-cost">' + price + '</span><span class="' + (hint ? "" : door ? "door-indicator" : "add-indicator") +
    '" aria-hidden="true"></span>' + (hint ? '<span class="action-reason">' + hint + '</span>' : "") + '</button>';
}

function docketGroups() {
  const groups = [];
  state.queue.forEach((action, i) => {
    const previous = groups.at(-1);
    if (previous?.action.id === action.id) previous.end = i;
    else groups.push({ action, start: i, end: i });
  });
  return groups;
}

function docketLines() {
  if (!state.queue.length) return '<div class="queue-empty"><p>No actions queued</p></div>';
  return docketGroups().map(({ action, start, end }) => {
    const repeated = start !== end;
    const rowName = action.name + (repeated ? " &times;" + (end - start + 1) : "");
    return '<div class="sheet-line"><span class="sheet-pos">' + String(start + 1).padStart(2, "0") + (repeated ? "-" + (end + 1) : "") +
      '</span><strong>' + rowName + '</strong><span class="sheet-cost">' + costs(action) + (repeated ? " each" : "") +
      '</span><div class="row-tools">' +
      osButton("&uarr;", 'data-move="' + start + '" data-step="-1" aria-label="Move ' + action.name + ' up"' + (!start ? " disabled" : "")) +
      osButton("&darr;", 'data-move="' + end + '" data-step="1" aria-label="Move ' + action.name + ' down"' + (end === state.queue.length - 1 ? " disabled" : "")) +
      osButton("&times;", 'data-remove="' + end + '" aria-label="Remove one ' + action.name + '"') + "</div></div>";
  }).join("");
}

function renderTimeline() {
  const months = later ? ["Nov 2017", "Dec 2017", "Jan 2018"] : ["Jul 2017", "Aug 2017", "Sep 2017"];
  return '<section class="timeline"><h2>Already under way</h2><div class="runway"><div class="runway-head">WORK IN PROGRESS</div>' +
    months.map(name => '<div class="runway-head">' + name + "</div>").join("") +
    (later
      ? '<div class="runway-name">Candidate interview</div><div class="runway-track"><div class="runway-print" style="width:55%">~mid-Dec 2017</div></div>' +
        '<div class="runway-name">Paper submission decision</div><div class="runway-track"><div class="runway-print paper-bar" style="width:86%">~Jan 2018</div></div>'
      : '<div class="runway-empty">No work in progress</div>') +
    '</div></section>';
}

function renderPlan() {
  const groupMarkup = actionGroups.map(([group, actions]) => {
    return '<div class="action-group">' + group + '</div>' + actions.filter(action => !action.later || later).map(actionLine).join("");
  }).join("");
  const qualityOptions = ["Rushed", "Standard", "Thorough"].map(name =>
    osButton(name, 'data-quality="' + name + '" aria-pressed="' + (name === state.quality) + '"')).join("");
  return panel(names.plan, "plan", "plan-window", '<div class="plan-grid window-inner">' +
    '<aside class="action-directory" aria-label="Actions"><div class="directory-head"><h2>Action directory</h2>' +
    '<span class="dir-count">' + (later ? 17 : 15) + ' entries</span></div><div class="action-list">' + groupMarkup +
    '</div><div class="directory-foot"><span><b>&#9656;</b> Open folder</span><span><b>+</b> Queue action</span></div></aside>' +
    '<article class="plan-body"><div class="document-head"><h2>The month ahead</h2><span class="document-state">DRAFT</span></div>' +
    '<div class="docket"><div class="sheet-line table-head"><span>ORDER</span><span>QUEUED ACTION</span><span>COST</span><span></span></div>' +
    '<div class="queue-lines" aria-label="Queued actions" tabindex="0">' + docketLines() + '</div>' +
    '<div class="queue-tools"><span class="queue-count">' + state.queue.length + ' queued</span>' +
      osButton("Undo last", 'data-undo' + (state.queue.length ? '' : ' disabled')) +
      osButton("Clear queue", 'data-clear' + (state.queue.length ? '' : ' disabled')) + '</div></div>' +
    renderTimeline() +
    '<div class="plan-settings"><strong>Research quality</strong><div class="quality-options">' + qualityOptions + '</div></div></article></div>');
}

function stat(label, value, deficit = false) {
  return '<div class="stat-cell"><span class="stat-label">' + label + '</span><strong' + (deficit ? ' class="deficit"' : '') +
    '>' + value + (deficit ? '<span>DEFICIT</span>' : "") + '</strong></div>';
}

function ledgerStats() {
  return '<div class="ledger-body window-inner">' + stat("Cash", money(state.money)) + stat("Compute", state.compute) +
    stat("Research", state.research, state.research < 0) + stat("Papers", state.papers) + '</div>';
}

function staffPicture(usePlaceholder = false) {
  return usePlaceholder
    ? '<img class="staff-empty-icon" alt="" src="' + iconSources.staff + '">'
    : '<img class="staff-avatar" alt="" src="assets/dossier_moral_crusader_256.png">';
}

function renderSideStack() {
  return '<aside class="side-stack" aria-label="Desktop windows">' +
    panel(names.ledger, "ledger", "ledger-window", ledgerStats(), osButton("Liabilities", 'data-app="ledger"')) +
    panel(names.staff, "staff", "staff-window",
      '<div class="staff-summary staff-body window-inner">' + staffPicture(!state.role) + '<div><strong>' +
      (state.role ? '1 employee' : 'No employees') + '</strong><small>' +
      (state.role || 'Founder only') + '</small></div></div>', osButton("Employees", 'data-app="staff"')) +
    panel(names.mail, "mail", "mail-window", '<div class="mail-status window-inner">' + icon("mail") + 'No new mail</div>',
      osButton("Open Inbox", 'data-app="mail"')) +
    '</aside>';
}

function renderPopup() {
  const action = actionIndex.get(state.popup);
  const choices = catalog[action.id].map(entry => {
    const choice = { ...entry, ...choiceExtras[entry.id] };
    const reason = blockedReason(choice);
    return '<button type="button" class="choice-line' + (reason ? ' is-blocked' : '') + '" data-choice="' + entry.id + '"' +
      (reason ? ' aria-disabled="true"' : '') + '><strong>' + choice.name + '</strong><span class="action-cost">' +
      costs(choice) + '</span>' + (reason ? '<span class="action-reason">' + reason + '</span>' : '') + '</button>';
  }).join("");
  desktop.insertAdjacentHTML("beforeend", panel(action.name, "plan", "popup",
    '<div class="popup-content window-inner">' + choices + '</div>', osButton("&times;", 'data-close aria-label="Close folder"', "close")));
  const popup = $(".popup");
  const trigger = $('[data-action="' + action.id + '"]');
  const triggerY = trigger.getBoundingClientRect().top - desktop.getBoundingClientRect().top;
  popup.style.top = Math.min(triggerY, desktop.clientHeight - popup.offsetHeight) + "px";
}

function appHeading(title, detail = "") {
  return '<header class="app-heading"><h2>' + title + '</h2>' + (detail ? '<p>' + detail + '</p>' : '') + '</header>';
}

function procurement() {
  const cash = state.money;
  const rows = upgrades.map((item, i) => {
    const installed = state.purchases.has(i);
    const short = cash < item.price;
    return '<div class="proc-item' + (i === state.procSelection ? " selected" : "") + '">' +
      '<button type="button" data-select-upgrade="' + i + '" aria-pressed="' + (i === state.procSelection) + '">' + item.name +
      '</button><span>' + money(item.price) + '</span>' +
      (installed ? '<strong>Installed</strong>' : short ? '<b>Cash short</b>' : '<strong>Available</strong>') + '</div>';
  }).join("");
  const i = state.procSelection;
  const item = upgrades[i];
  const installed = state.purchases.has(i);
  const short = cash < item.price;
  const status = installed ? "Installed" : short ? "Short " + money(item.price - cash) : "No Attention cost";
  return appHeading("Upgrades") +
    '<div class="proc-grid"><section class="proc-list" aria-label="Upgrade catalog"><div class="proc-headers"><span>UPGRADE</span><span>PRICE</span><span>STATUS</span></div>' +
    rows + '</section><article class="proc-detail"><div class="proc-photo" aria-hidden="true"></div><div class="proc-copy"><h3>' + item.name +
    '</h3><p>' + item.detail + '</p><p class="proc-state' + (short ? " is-blocked" : "") + '">' + status +
    '</p>' + (installed || short ? "" : osButton("Purchase / " + money(item.price), 'data-buy="' + i + '" style="margin-top:8px"')) +
    '</div></article></div>';
}

function records() {
  return (state.watch ? ledgerStats() : "") + appHeading("Liability Ledger") +
    '<section class="record"><p>No disclosed liabilities</p></section>';
}

function staffRecords() {
  return appHeading("Employees") + '<div class="records"><section class="record staff-card">' + staffPicture(true) +
    '<div><h3>Founder</h3><p>You</p></div></section>' +
    (state.role ? '<section class="record staff-card">' + staffPicture() +
      '<div><h3>R. Okafor</h3><p>' + state.role + '</p></div></section>' :
      '<section class="record"><p>No employees hired</p></section>') + '</div>';
}

function guide() {
  return appHeading("Player Guide") + '<ul class="guide-list">' +
    '<li>Each month gives the founder 12 planning hours and 8 operating hours.</li>' +
    '<li>Operating work can use planning hours when operating hours run out.</li>' +
    '<li>Reserve can cover event replies. Unspent hours are held automatically at commit.</li>' +
    '<li>Commit the month to enter WATCH. Event mail pauses the month for your reply.</li>' +
    '<li>A run ends at 100% P(Doom) or zero reputation.</li></ul>';
}

function renderApp() {
  const pages = { proc: procurement, ledger: records, staff: staffRecords, guide,
    mail: () => appHeading("Inbox") + '<section class="record"><p>No new mail</p></section>' };
  return panel(names[state.app], state.app, "app-window" + (state.app === "proc" ? " proc-window" : ""),
    '<div class="app-frame window-inner">' + pages[state.app]() + '</div>',
    osButton("&times;", 'data-close aria-label="Close ' + names[state.app] + '"', "close"));
}

function officeFeed() {
  const log = [
    [later ? "01 Nov 2017" : "01 Jul 2017", "Month committed"],
    ...(later && state.queue[0]?.id === "scout_meetups" ? [["03 Nov 2017", "Go to Meetups completed"]] : []),
    ...(later ? [["08 Nov 2017", "Incoming mail: Talent Opportunity"]] : []),
    ...(state.reply ? [[shortDate, "Reply sent: " + state.reply]] : [])
  ].map(([date, message]) => '<div class="activity-row"><time>' + date + "</time><span>" + message + "</span></div>").join("");
  return panel("WATCH / OFFICE", "monitor", "office-window",
    '<figure class="camera window-inner" aria-label="View over the founder\'s shoulder on the office floor"><div class="operator" aria-hidden="true">' +
    '<div class="operator-back"></div><div class="operator-head"></div><div class="operator-chair"></div></div></figure>' +
    '<section class="activity-body"><header class="activity-head"><h2>Activity log</h2></header><div class="activity-log">' +
    log + '</div></section>', '<span class="title-context">Office floor</span>');
}

function watchInbox() {
  const event = catalog.event;
  const waiting = later && !state.reply;
  const replies = event.options.map((option, index) => {
    const price = costs({ cost: option.cost });
    const reason = (option.cost.attention || 0) > state.commitReserve ? "No reserve left" :
      (option.cost.money || 0) > state.money ? "Not enough cash" : "";
    return osButton('<strong>' + (index + 1) + ". " + option.name + '</strong><span class="reply-cost">' +
      price + (reason ? ' / ' + reason : "") + '</span>',
      'data-reply="' + index + '"' + (reason ? " disabled" : ""), "reply-button");
  }).join("");
  const letter = later
    ? '<div class="inbox-tabs"><span class="bar-label">Inbox</span><div class="inbox-item">' + icon("mail") +
      '<strong>' + event.name + '</strong><span class="inbox-date">08 Nov</span></div></div>' +
      '<article class="inbox-letter"><dl><dt>From</dt><dd>Recruitment</dd><dt>To</dt><dd>Lab founder</dd></dl>' +
      '<h2>' + event.name + '</h2><p>' + event.description + '</p></article>' +
      '<section class="mail-replies">' + (waiting ? '<div class="reply-head"><h3>Send a reply</h3><p>Cash ' + money(state.money) + '</p></div>' + replies :
        '<h3>Reply sent</h3><p>' + state.reply + '</p>') + '</section>'
    : '<article class="inbox-letter"><h2>Inbox</h2><p>No new mail</p></article>';
  return panel("MAIL / INBOX", "mail", "watch-mail",
    '<div class="inbox-body window-inner">' + letter +
    '<div class="watch-controls"><span class="watch-status">' + (waiting ? "WATCH paused" : "Month in progress") +
    '</span>' + osButton("Month review", 'data-review' + (waiting ? " disabled" : ""), "window-next") + '</div></div>',
    waiting ? '<span class="reply-state">REPLY REQUIRED</span>' : '<span class="title-context">Inbox</span>');
}

function renderReview() {
  return panel("WATCH / MONTH REVIEW", "monitor", "app-window",
    '<div class="app-frame window-inner">' + appHeading("Month review", month) +
    '<section class="record"><p>' + (state.reply ? "Mail reply: " + state.reply : "No mail decisions") +
    '</p></section><p style="margin-top:14px">' + osButton("Return to PLAN", 'data-return-plan') + '</p></div>',
    osButton("&times;", 'data-close aria-label="Close month review"', "close"));
}

function render(focusSelector = "") {
  const scroll = $(".queue-lines")?.scrollTop || 0;
  renderFrame();
  desktop.innerHTML = state.watch
    ? '<div class="watch-layout">' + officeFeed() + watchInbox() + '</div>'
    : (state.app ? "" : renderPlan()) + renderSideStack();
  if (state.popup && !state.watch) renderPopup();
  if (state.app) desktop.insertAdjacentHTML("beforeend", renderApp());
  if (state.review) desktop.insertAdjacentHTML("beforeend", renderReview());
  if ($(".queue-lines")) $(".queue-lines").scrollTop = scroll;
  if (focusSelector) {
    const target = focusSelector.split(", ").map(selector => $(selector)).find(element => element && !element.disabled);
    if (target) target.focus({ preventScroll: true });
  }
}

function queue(action) {
  state.queue.push(action);
  $("#announcement").textContent = action.name + " queued";
}

document.addEventListener("click", ({ target }) => {
  const button = target.closest("button");
  if (!button || button.getAttribute("aria-disabled") === "true") return;
  const data = button.dataset;
  if ("app" in data) {
    state.popup = null;
    state.review = false;
    if (data.app === "plan" || data.app === "watch" || (state.watch && data.app === "mail")) {
      state.app = null;
      render(state.watch ? "[data-reply], [data-review]" : ".action-line");
    } else {
      state.app = state.app === data.app && button.closest(".taskbar") ? null : data.app;
      render(state.app ? ".app-window [data-close]" : '.taskbar [data-app="' + data.app + '"]');
    }
    return;
  }
  if ("close" in data) {
    const focus = state.popup ? '[data-action="' + state.popup + '"]' :
      state.app ? '.taskbar [data-app="' + state.app + '"]' : "[data-review]";
    state.app = state.popup = null;
    state.review = false;
    render(focus);
    return;
  }
  if ("action" in data) {
    const action = actionIndex.get(data.action);
    if (catalog[action.id]) {
      state.app = null;
      state.popup = state.popup === action.id ? null : action.id;
      render(state.popup ? ".popup .choice-line" : '[data-action="' + action.id + '"]');
    } else if (!blockedReason(action)) {
      state.popup = null;
      queue(action);
      render('[data-action="' + action.id + '"]');
    }
    return;
  }
  if ("choice" in data) {
    const action = child(state.popup, data.choice);
    if (blockedReason(action)) return;
    if (state.popup === "hire_staff") action.name = "Hire: " + action.name;
    queue(action);
    render('[data-choice="' + data.choice + '"]');
    return;
  }
  if ("commit" in data) {
    openWatch();
    state.popup = state.app = null;
    render("[data-reply], [data-review]");
    return;
  }
  if ("reply" in data) {
    const option = catalog.event.options[+data.reply];
    state.reply = option.name;
    state.commitReserve -= option.cost.attention || 0;
    state.money -= option.cost.money || 0;
    render("[data-review]");
    return;
  }
  if ("review" in data) {
    state.app = null;
    state.review = true;
    render("[data-return-plan]");
    return;
  }
  if ("returnPlan" in data) {
    location.href = "?view=" + (later ? "m5" : "m1");
    return;
  }
  if ("move" in data) {
    const index = +data.move;
    const [action] = state.queue.splice(index, 1);
    state.queue.splice(index + +data.step, 0, action);
    render(".queue-lines");
    return;
  }
  if ("remove" in data) {
    const index = +data.remove;
    state.queue.splice(index, 1);
    render('[data-remove="' + (index - 1) + '"], .queue-lines');
    return;
  }
  if ("undo" in data || "clear" in data) {
    if ("undo" in data) state.queue.pop();
    else state.queue = [];
    render(".queue-lines");
    return;
  }
  if ("reserve" in data) {
    state.reserve += +data.reserve;
    render('[data-reserve="' + data.reserve + '"]:enabled, [data-reserve]:enabled');
    return;
  }
  if ("quality" in data) {
    state.quality = data.quality;
    render('[data-quality="' + data.quality + '"]');
    return;
  }
  if ("selectUpgrade" in data) {
    state.procSelection = +data.selectUpgrade;
    render('[data-select-upgrade="' + data.selectUpgrade + '"]');
    return;
  }
  if ("buy" in data) {
    const i = +data.buy;
    if (state.purchases.has(i) || upgrades[i].price > state.money) return;
    state.money -= upgrades[i].price;
    state.purchases.add(i);
    render('[data-select-upgrade="' + i + '"]');
  }
});

document.addEventListener("keydown", event => {
  if (state.watch && !state.app && /^[1-3]$/.test(event.key)) {
    const reply = $('[data-reply="' + (Number(event.key) - 1) + '"]:enabled');
    if (reply) reply.click();
  }
  if (event.key !== "Escape") return;
  const close = $("[data-close]");
  if (close) {
    event.preventDefault();
    close.click();
  }
});

render();
</script>
</body>
</html>
