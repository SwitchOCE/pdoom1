<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Desk</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
:root{
  --amber:#F6A800; --amber-soft:#E8A33D; --amber-dim:#8a6224; --amber-faint:#5a4018;
  --op:#86C9BE; --op-dim:#3f6460;
  --ink:#2a2118; --ink-soft:#5a4a38; --paper:#eadfc6; --paper-2:#dfd2b4;
  --stamp:#a8261d; --brass:#b89a5e; --brass-dk:#6e5a32;
  --bezel:#37302a; --bezel-dk:#221d19;
  --wall:#2B221A; --line:#3A2E22;
  --glass:#241a0f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#2B221A}
body{font-family:"Share Tech Mono",monospace;color:#E9F2F2}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#2B221A}
.abs{position:absolute}

/* ---------- room ---------- */
.room-bg{position:absolute;inset:0;background:url(assets/office_wide_dawn.webp) center 38%/cover no-repeat;filter:saturate(.85) brightness(.78)}
.room-grade{position:absolute;inset:0;pointer-events:none}
.room-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,10,28,.35) 0%,rgba(23,10,28,.05) 35%,rgba(20,12,8,.25) 62%,rgba(20,12,8,.6) 66%)}

/* ---------- desk ---------- */
.desk{position:absolute;left:0;right:0;top:690px;bottom:0;
  background:linear-gradient(180deg,rgba(40,26,14,.55),rgba(20,12,6,.35) 40%,rgba(30,18,8,.5)),url(assets/tex_plywood_stained_512.png) 0 0/512px 512px, #4a3622;
  background-blend-mode:normal,multiply,normal;
  box-shadow:0 -2px 0 #6b5136 inset}
.desk:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#3a2a1a,#8a6a44 40%,#8a6a44 60%,#3a2a1a)}
.desk-lip{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(180deg,#5a4128,#2e2014)}

/* ---------- wall calendar ---------- */
.cal{left:24px;top:22px;width:252px;height:246px;background:#e4d8bd;color:var(--ink);border-radius:3px;
  box-shadow:0 10px 24px rgba(0,0,0,.55);transform:rotate(-1deg)}
.cal-head{height:76px;background:#7d3028;color:#f2e7d0;display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 0;border-radius:3px 3px 0 0}
.cal-month{font:700 40px/1 "Barlow Condensed",sans-serif;letter-spacing:2px}
.cal-year{font:600 24px/1 "Barlow Condensed",sans-serif}
.cal-rings{position:absolute;top:-8px;left:0;right:0;display:flex;justify-content:space-around;padding:0 40px}
.cal-rings i{width:8px;height:18px;border-radius:4px;background:#9b9184;box-shadow:inset 0 0 0 2px #5c554c}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 12px 0;font:400 14px/21px "Courier Prime",monospace;text-align:center}
.cal-grid b{font:700 14px/21px "Barlow Condensed",sans-serif;color:#7d3028}

/* ---------- staff board ---------- */
.board{left:24px;top:282px;width:252px;height:252px;border-radius:4px;
  background:radial-gradient(circle at 30% 30%,#a9804f,#7f5d36);border:8px solid #4a3522;box-shadow:0 10px 22px rgba(0,0,0,.5)}
.board-plate{position:absolute;left:10px;right:10px;top:10px;height:32px;background:linear-gradient(#cdb37a,#9b8150);border-radius:2px;
  display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#2a2010;font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:1px}
.board-plate span{font:600 16px/1 "Barlow Condensed",sans-serif}
.badge{position:absolute;left:12px;width:212px;height:60px;background:#efe6d2;border-radius:3px;color:var(--ink);
  box-shadow:0 3px 6px rgba(0,0,0,.45);padding:8px 10px 0 52px}
.badge:before{content:"";position:absolute;left:10px;top:10px;width:32px;height:40px;background:#6b5a47;border-radius:2px;
  background:radial-gradient(circle at 50% 38%,#2a2018 0 9px,transparent 10px),radial-gradient(ellipse at 50% 112%,#2a2018 0 17px,transparent 18px),#a8977c}
.badge:after{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;border-radius:50%;background:#b3261e;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.badge-n{font:700 16px/1.15 "Courier Prime",monospace}
.badge-r{font:400 14px/1.2 "Courier Prime",monospace;color:var(--ink-soft)}
.board-key{position:absolute;right:10px;bottom:8px;font:600 16px/1 "Barlow Condensed",sans-serif;color:#2a2010;background:#e6d6ad;padding:5px 8px;border-radius:2px}


/* ---------- CRT ---------- */
.crt{left:308px;top:8px;width:996px;height:698px;isolation:isolate}
.crt-body{position:absolute;inset:0;border-radius:34px;
  background:linear-gradient(160deg,#4a4038,#2f2822 55%,#26201b);
  box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.08),inset 0 -4px 0 rgba(0,0,0,.35)}
.crt-body:after{content:"";position:absolute;inset:0;border-radius:34px;background:url(assets/tex_bakelite_cracked_512.png) 0 0/512px;opacity:.10;mix-blend-mode:overlay}
.crt-screen{position:absolute;left:36px;top:30px;width:924px;height:606px;border-radius:22px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#33240f 0%,#2a1d0c 55%,#1f160a 100%);
  box-shadow:inset 0 0 0 3px #15110d,inset 0 0 60px rgba(0,0,0,.65),0 0 0 6px #1d1814}
.crt-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.0) 0 2px,rgba(0,0,0,.10) 2px 3px);z-index:3}
.crt-glare{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 25% 8%,rgba(255,230,190,.07),transparent 45%)}
.crt-in{position:absolute;inset:0;padding:16px 26px;z-index:2;color:var(--amber);text-shadow:0 0 6px rgba(246,168,0,.35)}
.crt-foot{position:absolute;left:36px;right:36px;top:646px;height:44px;display:flex;align-items:center;justify-content:space-between}
.crt-brand{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:3px;color:#a39686;display:flex;align-items:center;gap:12px}
.crt-led{width:10px;height:10px;border-radius:50%;background:#7fd07a;box-shadow:0 0 8px #7fd07a}

/* research quality switch on the bezel */
.rq{display:flex;align-items:center;gap:12px}
.rq-label{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;color:#cbbda8}
.rq-sw{display:flex;background:#1b1612;border-radius:6px;padding:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.rq-sw span{font:600 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;color:#a39686;padding:8px 14px;border-radius:4px;min-width:84px;text-align:center}
.rq-sw span.on{background:linear-gradient(#d9b56a,#a8823e);color:#21180c;box-shadow:0 1px 0 rgba(255,255,255,.3) inset}

/* CRT content */
.s-head{display:flex;justify-content:space-between;align-items:baseline;height:34px;border-bottom:2px solid var(--amber-dim)}
.s-title{font-size:26px;letter-spacing:3px}
.s-sub{font-size:16px;color:var(--amber-soft)}
.att{display:flex;gap:40px;padding:10px 0 10px;border-bottom:1px dashed var(--amber-faint)}
.att-g{display:flex;flex-direction:column;gap:6px}
.att-top{display:flex;gap:12px;align-items:baseline;white-space:nowrap}
.att-l{font-size:16px;letter-spacing:2px;color:var(--amber-soft)}
.att-l.op{color:var(--op)}
.pips{display:flex;gap:5px;height:20px;align-items:center}
.pip{width:18px;height:18px;border:2px solid var(--amber);background:var(--amber);box-shadow:0 0 6px rgba(246,168,0,.4)}
.pip.used{background:transparent;border-color:var(--amber-faint);box-shadow:none}
.pip.o{border-radius:50%;border-color:var(--op);background:var(--op);box-shadow:0 0 6px rgba(134,201,190,.35)}
.pip.o.used{background:transparent;border-color:var(--op-dim);box-shadow:none}
.att-v{font-size:16px;color:#f3d79a}
.att-v.op{color:#bfe3dc}
.res{display:flex;align-items:center;gap:8px;height:20px;margin-top:-2px}
.res-b{font-size:16px;border:1px solid var(--amber-dim);color:var(--amber);padding:0 9px;line-height:24px}
.res-n{font-size:20px;min-width:22px;text-align:center;color:#f3d79a}
.q-h{display:grid;grid-template-columns:44px 280px 130px 110px 120px 1fr;font-size:14px;letter-spacing:1.5px;color:var(--amber-dim);padding:8px 0 4px;text-shadow:none}
.q-row{display:grid;grid-template-columns:44px 280px 130px 110px 120px 1fr;align-items:center;font-size:16px;line-height:25px;height:25px;border-bottom:1px solid rgba(138,98,36,.28)}
.q-row .n{color:var(--amber-soft)}
.q-row .k{color:var(--amber-soft)}
.q-row .h.op{color:var(--op)}
.q-ctl{display:flex;justify-content:flex-end;gap:6px}
.q-ctl b{font-weight:400;width:26px;height:21px;line-height:19px;text-align:center;border:1px solid var(--amber-dim);color:var(--amber-soft);font-size:16px}
.q-tools{display:flex;justify-content:space-between;align-items:center;height:36px;padding-top:6px}
.q-tools .btns{display:flex;gap:10px}
.q-btn{border:1px solid var(--amber-dim);padding:3px 12px;font-size:16px;color:var(--amber)}
.q-btn.off{opacity:.45}
.q-tot{font-size:16px;color:#f3d79a}
.q-row.blank{color:var(--amber-faint);text-shadow:none}
.q-empty{position:absolute;left:0;right:0;top:118px;text-align:center;font-size:18px;color:var(--amber-soft)}
.q-foot{display:flex;justify-content:space-between;font-size:16px;color:var(--amber-soft);padding:7px 0 0}
.uw-h{font-size:14px;letter-spacing:1.5px;color:var(--amber-dim);padding:8px 0 4px;display:grid;grid-template-columns:290px repeat(4,1fr) 210px;text-shadow:none}
.uw-h span{border-left:1px solid var(--amber-faint);padding-left:6px}
.uw-row{display:grid;grid-template-columns:290px 1fr 210px;height:26px;align-items:center;font-size:16px}
.uw-track{position:relative;height:26px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(138,98,36,.45) calc(25% - 1px) 25%)}
.uw-bar{position:absolute;top:7px;height:12px;background:linear-gradient(90deg,var(--amber-dim),var(--amber));}
.uw-bar:after{content:"";position:absolute;right:-7px;top:-1px;width:14px;height:14px;background:var(--amber);transform:rotate(45deg)}
.uw-lab{font-size:16px;color:#f3d79a;white-space:nowrap;padding-left:16px}
.uw-none{font-size:16px;color:var(--amber-soft);padding:6px 0}

/* ---------- wall instruments ---------- */
.plate{background:linear-gradient(#d4bb84,#9e8452);color:#241a0c;font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:2px;text-align:center;border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.dialw{left:1326px;top:16px;width:318px;height:318px}
.dial-plate{position:absolute;left:84px;width:150px;top:282px;height:30px;line-height:30px}
.repw{left:1662px;top:30px;width:236px;height:290px;border-radius:10px;
  background:linear-gradient(160deg,#4a4038,#2c2520);box-shadow:0 12px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.rep-face{position:absolute;left:14px;top:14px;width:208px;height:150px;border-radius:6px;overflow:hidden;
  background:linear-gradient(rgba(240,228,200,.92),rgba(222,206,170,.92)),url(assets/tex_grid_graphpaper_aged_512.png) 0 0/256px;box-shadow:inset 0 0 0 2px #1d1814,inset 0 6px 14px rgba(0,0,0,.35)}
.rep-num{position:absolute;left:14px;right:14px;top:174px;height:56px;border-radius:5px;background:linear-gradient(#2a1f12,#1f170d);
  display:flex;align-items:center;justify-content:center;gap:10px;font:400 36px/1 "Share Tech Mono",monospace;color:var(--amber);text-shadow:0 0 8px rgba(246,168,0,.45);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.rep-plate{position:absolute;left:14px;right:14px;top:242px;height:30px;line-height:30px}

.ctr{left:1326px;top:360px;width:572px;height:140px;border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  background:linear-gradient(160deg,#4a4038,#2c2520);box-shadow:0 12px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.ctr-c{display:flex;flex-direction:column;gap:8px}
.ctr-l{height:26px;line-height:26px;font-size:16px}
.ctr-w{flex:1;border-radius:5px;background:linear-gradient(#2a1f12,#1f170d);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;font:400 28px/1 "Share Tech Mono",monospace;color:var(--amber);text-shadow:0 0 8px rgba(246,168,0,.4)}
.ctr-w.bad{color:#ff6a4d;text-shadow:0 0 8px rgba(255,90,60,.5);gap:8px}
.ctr-w.bad em{font-style:normal;font-size:18px;background:#a8261d;color:#ffe9de;text-shadow:none;padding:3px 5px;border-radius:2px}

/* ---------- desk objects (right) ---------- */
.tray{left:24px;top:548px;width:252px;height:158px}
.tray-wire{position:absolute;left:0;right:0;bottom:0;height:78px;border:3px solid #8d8578;border-top-width:4px;border-radius:4px;
  background:repeating-linear-gradient(90deg,rgba(40,30,20,.35) 0 14px,rgba(141,133,120,.85) 14px 16px);box-shadow:0 8px 14px rgba(0,0,0,.45)}
.tray-slip{position:absolute;left:18px;right:18px;top:0;height:100px;background:var(--paper);border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.45);transform:rotate(-1.5deg);
  color:var(--ink);padding:10px 12px;font:700 16px/1.25 "Courier Prime",monospace}
.tray-slip small{display:block;font:400 14px/1.3 "Courier Prime",monospace;color:var(--ink-soft)}
.tray-plate{position:absolute;left:34px;right:34px;bottom:22px;height:30px;line-height:30px}
.binder{left:1326px;top:518px;width:124px;height:186px;border-radius:4px 6px 4px 4px;
  background:linear-gradient(90deg,#20304a,#2f4566 40%,#263a58);box-shadow:0 10px 18px rgba(0,0,0,.5),inset -6px 0 0 rgba(0,0,0,.25)}
.binder-lab{position:absolute;left:12px;right:16px;top:20px;height:80px;background:#e9dfc8;border-radius:2px;color:var(--ink);
  font:700 17px/1.2 "Barlow Condensed",sans-serif;letter-spacing:1px;text-align:center;padding-top:18px}
.binder-key{position:absolute;left:12px;right:16px;bottom:16px;height:30px;line-height:30px;font-size:16px}
.cab{left:1466px;top:518px;width:432px;height:186px;border-radius:6px;padding:12px;display:flex;flex-direction:row;gap:12px;
  background:linear-gradient(90deg,#5a3f25,#6e4e2e 50%,#573c23);box-shadow:0 10px 18px rgba(0,0,0,.5)}
.drawer{flex:1;border-radius:3px;background:linear-gradient(#7a5734,#5f4227);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.drawer{gap:12px}
.drawer-h{width:170px;height:30px;line-height:30px}
.drawer-pull{width:64px;height:9px;border-radius:5px;background:linear-gradient(#cfb27a,#7d6438);box-shadow:0 2px 2px rgba(0,0,0,.5)}

/* ---------- card rack ---------- */
.rack{left:24px;top:720px;width:1544px;height:346px}
.rack-rail{position:absolute;left:-6px;right:-6px;height:12px;border-radius:3px;background:linear-gradient(#6b4e30,#3b2a19);box-shadow:0 3px 6px rgba(0,0,0,.5)}
.rack-row{position:absolute;left:0;right:0;display:flex;gap:10px}
.slip{position:relative;height:164px;border-radius:3px;color:var(--ink);padding:32px 9px 8px 10px;
  background:linear-gradient(180deg,#efe5cd,#e2d5b8);box-shadow:0 4px 8px rgba(0,0,0,.5)}
.slip-tab{position:absolute;left:0;top:0;height:24px;padding:0 8px;border-radius:3px 0 3px 0;font:700 16px/24px "Barlow Condensed",sans-serif;letter-spacing:1.2px;color:#fff}
.slip-n{font:700 16px/1.15 "Courier Prime",monospace;letter-spacing:-.2px}
.slip-c{font:400 16px/1.2 "Courier Prime",monospace;margin-top:6px}
.slip-c .op{color:#2f6a62}
.slip-st{position:absolute;left:9px;right:9px;bottom:8px;border:2px solid var(--stamp);color:var(--stamp);border-radius:3px;white-space:nowrap;
  font:700 16px/1.05 "Barlow Condensed",sans-serif;letter-spacing:0;text-align:center;padding:3px 2px;background:rgba(168,38,29,.06)}
.slip.blocked{background:linear-gradient(180deg,#d9d0bd,#cbc1aa)}
.slip.blocked .slip-n,.slip.blocked .slip-c{color:#4b4236}
.slip.soon .slip-st{border-color:#5d5346;color:#4a4238;background:none}
/* doors = manila folders */
.slip.door{background:linear-gradient(180deg,#dcbd7d,#c9a764);border-radius:2px 4px 4px 4px}
.slip.door:before{content:"";position:absolute;right:10px;top:-9px;width:62px;height:12px;background:#d7b673;border-radius:4px 4px 0 0}
.slip.door .slip-c{color:#3e3220}
.slip:not(.door) .slip-go{border-top-color:rgba(42,33,24,.25)}
.slip-go{position:absolute;left:10px;right:9px;bottom:9px;display:flex;justify-content:space-between;align-items:center;
  font:700 16px/1 "Courier Prime",monospace;color:#3e3220;border-top:1px solid rgba(62,50,32,.35);padding-top:7px}
.slip-go b{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1px;background:#3e3220;color:#e9d6a6;padding:3px 7px;border-radius:2px}
.slip.door.blocked{background:linear-gradient(180deg,#cdbf9f,#bfae88)}
.slip.door.blocked .slip-go{display:none}
.clip{display:inline-block;margin-top:6px;font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;color:#1f4d46;background:#cfe5df;border:1px solid #2f6a62;border-radius:2px;padding:3px 5px}
.slip .clip ~ .slip-n{padding-right:0}

/* ---------- commit ---------- */
.cmt{left:1592px;top:720px;width:306px;height:346px;border-radius:12px;
  background:linear-gradient(160deg,#4a4038,#2c2520);box-shadow:0 14px 28px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}
.cmt-plate{position:absolute;left:22px;right:22px;top:20px;height:40px;line-height:40px;font-size:22px;letter-spacing:2.5px}
.cmt-btn{position:absolute;left:58px;top:80px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#ffd36b,#f6a800 45%,#b97400 100%);
  box-shadow:0 0 0 10px #1c1713,0 0 0 13px #6e5a32,0 10px 20px rgba(0,0,0,.6),0 0 40px rgba(246,168,0,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#2a1a04}
.cmt-btn b{font:700 34px/1 "Barlow Condensed",sans-serif;letter-spacing:2px}
.cmt-btn span{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1px;border:2px solid #2a1a04;border-radius:3px;padding:3px 8px}
.cmt-note{position:absolute;left:18px;right:18px;top:296px;text-align:center;font:400 16px/1.25 "Share Tech Mono",monospace;color:#d8c6a6}

/* ---------- open-door view: folder fan ---------- */
.dim{position:absolute;inset:0;background:rgba(20,12,16,.28);pointer-events:none}
.fan{position:absolute}
.fan-slip{position:absolute;width:236px;height:176px;background:linear-gradient(180deg,#f1e8d2,#e4d8bd);border-radius:3px;color:var(--ink);padding:14px 14px 10px;
  box-shadow:0 10px 22px rgba(0,0,0,.55)}
.fan-n{font:700 18px/1.15 "Courier Prime",monospace}
.fan-c{font:400 16px/1.25 "Courier Prime",monospace;margin-top:8px}
.fan-c .op{color:#2f6a62}
.fan-ctx{position:absolute;background:#efe6cf;color:var(--ink);border-radius:3px;padding:16px 18px;box-shadow:0 10px 22px rgba(0,0,0,.55);
  font:400 16px/1.35 "Courier Prime",monospace}
.fan-ctx h4{font:700 18px/1.2 "Courier Prime",monospace;margin-bottom:6px}
.fan-ctx p{margin:0}
.ctx-row{display:flex;gap:28px;align-items:center;border-top:1px dashed #b4a582;margin-top:10px;padding-top:9px}
.ctx-row .fan-keys{margin-left:auto}
.fan-ctx .row{display:flex;justify-content:space-between;border-top:1px dashed #b4a582;padding:6px 0}
.fan-keys{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1px;color:#3e3220;background:#d8c79c;padding:7px 12px;border-radius:2px}

/* ---------- WATCH ---------- */
.w-bg{position:absolute;inset:0;background:url(assets/office_mezzanine.webp) center 40%/cover no-repeat;filter:saturate(.9) brightness(.85)}

<body>
<div id="stage"></div>
<script>
"use strict";
var Q = new URLSearchParams(location.search);
var VIEW = Q.get("view") || "m1";

// ---------- fixture: views of existing state only ----------
// m5 queue: ONE ROW PER PLAY. [name, from-door ("" = a direct action), hours, kind, money, rep]
var M5Q = [
  ["Go to Meetups","Scouting",1,"op",300,0],
  ["Hire: Safety Researcher","Hire Staff",1,"plan",60000,0],
  ["Safety Audit","",2,"op",40000,0],
  ["Public Warning","Publicity",2,"plan",0,15],
  ["Read the Literature","Scouting",1,"plan",0,0],
  ["Read the Literature","Scouting",1,"plan",0,0],
  ["Post Online","Scouting",1,"plan",0,0],
  ["Read the Literature","Scouting",1,"plan",0,0],
  ["Read the Literature","Scouting",1,"plan",0,0],
  ["Post Online","Scouting",1,"plan",0,0],
  ["Read the Literature","Scouting",1,"plan",0,0],
  ["Read the Literature","Scouting",1,"plan",0,0],
  ["Read the Literature","Scouting",1,"plan",0,0]
];
function sumQ(q,f){ return q.reduce(function(t,r){ return t+f(r); },0); }
function money(n){ return "$"+n.toLocaleString("en-US"); }
// plays in the plan that came from a door (by door name) or are this direct action (by name)
function inPlan(q,key){ return q.filter(function(r){ return r[1]===key || (r[1]==="" && r[0]===key); }).length; }

var M1 = {
  month:"JULY", year:"2017", firstDow:6, days:31,
  money:"$245,000", compute:"100", research:"0", researchBad:false, papers:"0",
  rep:50, doom:20.0, band:"ELEVATED", doomNote:"",
  planTotal:12, opTotal:8, reserve:0,
  queue:[], underway:[], tray:null,
  staff:[{n:"Founder (you)", r:"planning"}], staffCount:0,
  rq:"Standard", grade:"rgba(246,168,0,.06)"
};
var M5 = {
  month:"NOVEMBER", year:"2017", firstDow:3, days:30,
  money:"$140,000", compute:"65", research:"-12", researchBad:true, papers:"0",
  rep:32, doom:40.2, band:"HIGH", doomNote:"rising",
  planTotal:12, opTotal:8, reserve:0,
  queue:M5Q,
  underway:[
    {n:"Hiring: candidate interview", s:0, e:1.5, lab:"lands ~mid-Dec 2017"},
    {n:"Paper submission", s:0, e:2.5, lab:"decision ~Jan 2018"}
  ],
  months:["NOV","DEC","JAN 2018","FEB"],
  tray:{t:"October report", s:"month review"},
  staff:[{n:"Founder (you)", r:"planning"},{n:"R. Okafor", r:"Safety Researcher"}], staffCount:1,
  rq:"Standard", grade:"rgba(233,117,46,.11)"
};
[M1,M5].forEach(function(d){
  d.planUsed = sumQ(d.queue,function(r){ return r[3]==="plan"?r[2]:0; });
  d.opUsed   = sumQ(d.queue,function(r){ return r[3]==="op"?r[2]:0; });
  d.qMoney   = sumQ(d.queue,function(r){ return r[4]; });
  d.qRep     = sumQ(d.queue,function(r){ return r[5]; });
  d.held     = (d.planTotal-d.planUsed) + (d.opTotal-d.opUsed);   // unspent hours, untyped
});
// WATCH fixture: the committed batch has executed and its state is published before playback
// (game_manager.gd:710-735). From M5: money 140,000 - 100,300; research -12 + 7 x 3 (Read the
// Literature, +3 each); reputation 32 - 15 (Public Warning cost) + 2 (its roll, fixed in this
// fixture) + 1.5 (Meetups) + 3 (Safety Audit) - 2 (Post Online x2) = 21.5.
var W5 = {
  money:money(140000-M5.qMoney), compute:"65", research:String(-12+7*3), researchBad:false, papers:"0",
  rep:(32-15+2+1.5+3-2), doom:40.2, band:"HIGH", doomNote:"rising", grade:M5.grade
};

var TAB = {FUNDING:"#55703a", PEOPLE:"#93552a", RESEARCH:"#3f5d73", OUTREACH:"#7a5d1c", LAB:"#56636f", STRATEGIC:"#7d3028", SCOUTING:"#7a5d1c"};

// the hand, in FIXED slots so nothing moves between months:
// [name, category, kind, costLineHTML, state, stampText, inPlanCount]
function hand(d, m5){
  var noPlan = "NO PLANNING HRS LEFT";
  var q = d.queue;
  var row1 = [
    ["Fundraising","FUNDING","door","4 choices","","", inPlan(q,"Fundraising")],
    ["Financing","FUNDING","door","7 choices","","", inPlan(q,"Financing")],
    ["Hire Staff","PEOPLE","door","7 roles<br>1 plan hr each", m5?"blocked":"", m5?noPlan:"", inPlan(q,"Hire Staff")],
    ["Advertise a Role","PEOPLE","slip","","soon","COMING SOON",0],
    ["Work Your Connections","PEOPLE","slip","<span class=op>2 op hr</span><br>6 rep","","", inPlan(q,"Work Your Connections")],
    ["Onboard New Hires","PEOPLE","slip","<span class=op>op hr</span> + money<br>varies by step","blocked", m5?"NO HIRES WAITING":"NOBODY HIRED YET",0],
    ["Safety Research","RESEARCH","slip","1 plan hr<br>10 research","blocked", m5?noPlan:"NEEDS 10 RESEARCH",0],
    ["Capability Research","RESEARCH","slip","1 plan hr<br>10 research","blocked", m5?noPlan:"NEEDS 10 RESEARCH",0],
    ["Publish Safety Paper","RESEARCH","slip","1 plan hr<br>20 research","blocked", m5?noPlan:"NEEDS 20 RESEARCH",0]
  ];
  var row2 = [
    ["Travel &amp; Conferences","OUTREACH","door","4 choices","","", inPlan(q,"Travel")],
    ["Scouting","OUTREACH","door","3 choices","","", inPlan(q,"Scouting")],
    ["Publicity","OUTREACH","door","5 choices","","", inPlan(q,"Publicity")],
    ["Purchase Compute","LAB","slip","$50,000<br>no hours","","", inPlan(q,"Purchase Compute")],
    ["Operations","LAB","door","3 choices","","", inPlan(q,"Operations")],
    ["Office","LAB","door","4 choices","","", inPlan(q,"Office")]
  ];
  if (m5){
    row2.push(["Safety Audit","RESEARCH","slip","<span class=op>2 op hr</span><br>$40,000","","", inPlan(q,"Safety Audit")]);
    row2.push(["Strategic","STRATEGIC","door","4 choices","","", inPlan(q,"Strategic")]);
  }
  return [row1,row2];
}

// ---------- helpers ----------
function el(tag, cls, html, style){
  var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; if(style) e.setAttribute("style",style); return e;
}
var S = document.getElementById("stage");
function add(e){ S.appendChild(e); return e; }
function pad2(n){ return String(n).padStart(2,"0"); }

// ---------- room + desk ----------
function room(d){
  add(el("div","room-bg"));
  add(el("div","room-grade",null,"background:"+d.grade+";mix-blend-mode:screen"));
  if (d.doom > 35) add(el("div","room-grade",null,"background:radial-gradient(ellipse at 18% 30%,rgba(226,74,59,.16),transparent 55%)"));
  add(el("div","room-shade"));
  var desk = add(el("div","desk")); desk.appendChild(el("div","desk-lip"));
}

function calendar(d){
  var c = add(el("div","abs cal"));
  var rings = el("div","cal-rings"); for(var i=0;i<4;i++) rings.appendChild(el("i")); c.appendChild(rings);
  c.appendChild(el("div","cal-head","<span class=cal-month>"+d.month+"</span><span class=cal-year>"+d.year+"</span>"));
  var g = el("div","cal-grid"); ["S","M","T","W","T","F","S"].forEach(function(x){ g.appendChild(el("b",null,x)); });
  var cells = Math.ceil((d.firstDow+d.days)/7)*7, day = 1 - d.firstDow;
  for (var k=0;k<cells;k++,day++){ g.appendChild(el("span",null,(day>=1&&day<=d.days)?String(day):"")); }
  c.appendChild(g);
}

function staffBoard(d){
  var b = add(el("div","abs board"));
  b.appendChild(el("div","board-plate","STAFF <span>"+(d.staffCount===0?"none hired":d.staffCount+" hired")+"</span>"));
  d.staff.forEach(function(s,i){
    var bd = el("div","badge","<div class=badge-n>"+s.n+"</div><div class=badge-r>"+s.r+"</div>","top:"+(56+i*70)+"px");
    b.appendChild(bd);
  });
  b.appendChild(el("div","board-key","Employees [E]"));
}

// ---------- wall instruments ----------
function doomDial(d){
  var W=318, cx=159, cy=150, R=126;
  var start=-225, sweep=270; // degrees, 0 = right, clockwise positive (svg)
  function ang(v){ return (start + sweep*v/100) * Math.PI/180; }
  function pt(v,r){ var a=ang(v); return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  function arc(v0,v1,r){ var p0=pt(v0,r), p1=pt(v1,r); var large=(sweep*(v1-v0)/100)>180?1:0; return "M"+p0[0].toFixed(1)+" "+p0[1].toFixed(1)+" A"+r+" "+r+" 0 "+large+" 1 "+p1[0].toFixed(1)+" "+p1[1].toFixed(1); }
  var bands=[[0,15,"#3F8A5C"],[15,37,"#F6A800"],[37,52,"#E9752E"],[52,67,"#E24A3B"],[67,80,"#B31217"],[80,92,"#7a1418"],[92,100,"#3b0a10"]];
  var s='<svg class="abs dialw" viewBox="0 0 318 318" xmlns="http://www.w3.org/2000/svg">';
  s+='<defs><radialGradient id="face" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#efe3c6"/><stop offset="1" stop-color="#cdbb93"/></radialGradient>'+
     '<pattern id="gp" width="256" height="256" patternUnits="userSpaceOnUse"><image href="assets/tex_grid_graphpaper_aged_512.png" width="256" height="256" opacity=".35"/></pattern></defs>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="148" fill="#2c2520" stroke="#6e5a32" stroke-width="4"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="138" fill="url(#face)"/><circle cx="'+cx+'" cy="'+cy+'" r="138" fill="url(#gp)"/>';
  bands.forEach(function(b){ s+='<path d="'+arc(b[0],b[1],R-24)+'" stroke="'+b[2]+'" stroke-width="12" fill="none"/>'; });
  for (var v=0; v<=100; v+=5){ var a=pt(v,R-32), b2=pt(v,R-(v%25===0?46:38)); s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b2[0].toFixed(1)+'" y2="'+b2[1].toFixed(1)+'" stroke="#2a2118" stroke-width="'+(v%25===0?3:1.5)+'"/>'; }
  [0,25,50,75,100].forEach(function(v){ var p=pt(v,R-2); s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+6).toFixed(1)+'" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="18" fill="#2a2118">'+v+'</text>'; });
  // counter window
  s+='<rect x="'+(cx-62)+'" y="'+(cy+28)+'" width="124" height="44" rx="5" fill="#21180d" stroke="#6e5a32" stroke-width="2"/>';
  s+='<text x="'+cx+'" y="'+(cy+61)+'" text-anchor="middle" font-family="Share Tech Mono" font-size="32" fill="#F6A800">'+d.doom.toFixed(1)+'%</text>';
  s+='<text x="'+cx+'" y="'+(cy+98)+'" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="18" letter-spacing="1.5" fill="#2a2118">'+d.band+(d.doomNote?' &#183; '+d.doomNote:'')+'</text>';
  // needle
  var n=pt(d.doom,R-30), tl=pt(d.doom+50,16);
  s+='<line x1="'+tl[0].toFixed(1)+'" y1="'+tl[1].toFixed(1)+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'" stroke="#8c1d12" stroke-width="5" stroke-linecap="round"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="#3a2e22" stroke="#b89a5e" stroke-width="3"/>';
  s+='</svg>';
  var w=document.createElement("div"); w.innerHTML=s; add(w.firstChild);
  add(el("div","abs plate dial-plate","P(DOOM)","left:"+(1326+84)+"px;top:318px;height:30px"));
}

function repMeter(d){
  var r = add(el("div","abs repw"));
  var face = el("div","rep-face"); r.appendChild(face);
  // arc meter 0..100, needle
  var cx=104, cy=140, R=112;
  function pt(v,rr){ var a=(-160 + 140*v/100)*Math.PI/180; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; }
  var s='<svg width="208" height="150" viewBox="0 0 208 150" xmlns="http://www.w3.org/2000/svg">';
  var a0=pt(0,R-38), a1=pt(12,R-38);
  s+='<path d="M'+a0[0].toFixed(1)+' '+a0[1].toFixed(1)+' A'+(R-38)+' '+(R-38)+' 0 0 1 '+a1[0].toFixed(1)+' '+a1[1].toFixed(1)+'" stroke="#a8261d" stroke-width="10" fill="none"/>';
  for (var v=0; v<=100; v+=10){ var p=pt(v,R-44), q=pt(v,R-(v%50===0?60:52)); s+='<line x1="'+p[0].toFixed(1)+'" y1="'+p[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#2a2118" stroke-width="'+(v%50===0?3:1.5)+'"/>'; }
  [0,50,100].forEach(function(v){ var p=pt(v,R-24); s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+6).toFixed(1)+'" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="16" fill="#2a2118">'+v+'</text>'; });
  var n=pt(d.rep,R-46);
  s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'" stroke="#2a2118" stroke-width="3"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="#3a2e22"/>';
  s+='</svg>';
  face.innerHTML = s;
  r.appendChild(el("div","rep-num",String(Math.round(d.rep))));   // shown as a whole number (NUMBER_FORMATS)
  r.appendChild(el("div","plate rep-plate","REPUTATION"));
}

function counters(d){
  var c = add(el("div","abs ctr"));
  [["MONEY",d.money,false],["COMPUTE",d.compute,false],["RESEARCH",d.research,d.researchBad],["PAPERS",d.papers,false]].forEach(function(x){
    var col = el("div","ctr-c");
    col.appendChild(el("div","plate ctr-l",x[0]));
    col.appendChild(el("div","ctr-w"+(x[2]?" bad":""), x[1]+(x[2]?"<em>[!]</em>":"")));
    c.appendChild(col);
  });
}

function deskObjects(d){
  var t = add(el("div","abs tray"));
  if (d.tray) t.appendChild(el("div","tray-slip",d.tray.t+"<small>"+d.tray.s+"</small>"));
  t.appendChild(el("div","tray-wire"));
  t.appendChild(el("div","plate tray-plate", d.tray?"IN-TRAY [R]":"IN-TRAY &middot; empty"));
  var b = add(el("div","abs binder"));
  b.appendChild(el("div","binder-lab","STAFF<br>HANDBOOK"));
  b.appendChild(el("div","plate binder-key","GUIDE"));
  var cab = add(el("div","abs cab"));
  [["UPGRADES [U]"],["LEDGER [L]"]].forEach(function(x){
    var dr = el("div","drawer"); dr.appendChild(el("div","plate drawer-h",x[0])); dr.appendChild(el("i","drawer-pull")); cab.appendChild(dr);
  });
}


// ---------- CRT: the month's plan ----------
function crt(d){
  var c = add(el("div","abs crt"));

// ---------- the hand: slips (actions) and folders (doors) ----------
var CARD_W = Math.floor((1544 - 8*10)/9);   // 9 fixed slots per tier, same in every month
function rack(d, m5){
  var r = add(el("div","abs rack"));
  hand(d,m5).forEach(function(row,ri){
    var top = ri===0 ? 4 : 180;
    var rr = el("div","rack-row",null,"top:"+top+"px"); r.appendChild(rr);
    r.appendChild(el("div","rack-rail",null,"top:"+(top+164)+"px"));   // rail sits below each tier, never across a card
    row.forEach(function(s){ rr.appendChild(slip(s,CARD_W)); });
  });
}
function slip(s,w,goLabel,goKey){
  var name=s[0], cat=s[1], kind=s[2], cost=s[3], state=s[4], stamp=s[5], n=s[6];
  var e = el("div","slip"+(kind==="door"?" door":"")+(state?" "+state:""),null,"width:"+w+"px");
  e.appendChild(el("div","slip-tab",cat,"background:"+TAB[cat]));
  e.appendChild(el("div","slip-n",name));
  if (cost) e.appendChild(el("div","slip-c",cost));
  if (n) e.appendChild(el("div","clip",n+" in plan"));
  if (stamp) e.appendChild(el("div","slip-st",stamp));
  else e.appendChild(el("div","slip-go","<span>"+(goLabel || (kind==="door"?"open":"add"))+"</span><b>"+(goKey || (kind==="door"?"&gt;":"+"))+"</b>"));
  return e;
}

// ---------- layout self-check (?check=1): text that overflows its box or overlaps other text ----------
function selfCheck(){
  var leaves = Array.prototype.filter.call(document.querySelectorAll("#stage *"), function(e){
    return Array.prototype.some.call(e.childNodes, function(n){ return n.nodeType===3 && n.textContent.trim(); });
  });
  var out = [];
  leaves.forEach(function(e){
    var cs = getComputedStyle(e);
    if (cs.display!=="inline" && e.clientWidth>0 && e.scrollWidth > e.clientWidth+1) out.push("OVERFLOW-X "+e.className+" '"+e.textContent.trim().slice(0,30)+"' "+e.scrollWidth+">"+e.clientWidth);
    var box = e.closest(".slip,.fan-slip,.ug,.ev,.cmt,.ctr,.fan-ctx,.tape,.board,.cal,.crt-screen");
    if (box && box!==e){
      var r=e.getBoundingClientRect(), b=box.getBoundingClientRect();
      if (r.right>b.right+1||r.bottom>b.bottom+1||r.left<b.left-1||r.top<b.top-1) out.push("OUTSIDE "+e.className+" '"+e.textContent.trim().slice(0,30)+"' in "+box.className);
    }
  });
  var R = leaves.map(function(e){ return e.getBoundingClientRect(); });
  for (var i=0;i<leaves.length;i++) for (var j=i+1;j<leaves.length;j++){
    if (leaves[i].contains(leaves[j])||leaves[j].contains(leaves[i])) continue;
    var a=R[i], b=R[j];
    var w=Math.min(a.right,b.right)-Math.max(a.left,b.left), h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
    if (w>2&&h>2) out.push("OVERLAP '"+leaves[i].textContent.trim().slice(0,24)+"' x '"+leaves[j].textContent.trim().slice(0,24)+"'");
  }
  leaves.forEach(function(e){ if (parseFloat(getComputedStyle(e).fontSize)<14) out.push("SMALL "+e.className+" '"+e.textContent.trim().slice(0,20)+"'"); });
  var pre = document.createElement("pre"); pre.id="check"; pre.textContent = "CHECK-BEGIN\n"+out.join("\n")+"\nCHECK-END";
  document.body.appendChild(pre);
}
