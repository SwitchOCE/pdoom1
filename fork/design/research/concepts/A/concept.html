<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Desk</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
:root{
  --amber:#F6A800; --amber-soft:#E8A33D; --amber-dim:#8a6224; --amber-faint:#5a4018;
  --op:#86C9BE; --op-dim:#3f6460;
  --ink:#2a2118; --ink-soft:#5a4a38; --paper:#eadfc6;
  --stamp:#a8261d; --teal-ink:#2f6a62;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#2B221A}
body{font-family:"Share Tech Mono",monospace;color:#E9F2F2}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#2B221A}
.abs{position:absolute}

/* ===== room (the art is the home screen) ===== */
.room-bg{position:absolute;inset:0;background:url(assets/office_wide_dawn.webp) center 46%/cover no-repeat;filter:saturate(.9) brightness(.95)}
.room-grade{position:absolute;inset:0;pointer-events:none}
.room-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,10,28,.30) 0%,rgba(23,10,28,0) 22%,rgba(20,12,8,0) 60%,rgba(20,12,8,.55) 86%)}
.desk{position:absolute;left:0;right:0;top:940px;bottom:0;
  background:linear-gradient(180deg,rgba(40,26,14,.4),rgba(20,12,6,.55)),url(assets/tex_plywood_stained_512.png) 0 0/512px 512px,#4a3622;background-blend-mode:normal,multiply,normal}
.desk:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#3a2a1a,#8a6a44 40%,#8a6a44 60%,#3a2a1a)}
.dim{position:absolute;inset:0;background:rgba(20,12,16,.50);pointer-events:none}

.plate{background:linear-gradient(#d4bb84,#9e8452);color:#241a0c;font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:2px;text-align:center;border-radius:2px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.key{display:inline-block;font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;border:2px solid currentColor;border-radius:3px;padding:2px 6px}
.hw{border-radius:10px;background:linear-gradient(160deg,#4a4038,#2c2520);box-shadow:0 14px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}

/* ===== wall calendar: the month ===== */
.cal{left:56px;top:48px;width:236px;height:128px;background:#e4d8bd;color:var(--ink);border-radius:3px;box-shadow:0 10px 24px rgba(0,0,0,.55);transform:rotate(-1deg)}
.cal-head{height:76px;background:#7d3028;color:#f2e7d0;display:flex;align-items:center;justify-content:center;border-radius:3px 3px 0 0;font:700 40px/1 "Barlow Condensed",sans-serif;letter-spacing:2px}
.cal-year{text-align:center;font:700 34px/52px "Barlow Condensed",sans-serif;color:#3a2e22}
.cal-rings{position:absolute;top:-8px;left:0;right:0;display:flex;justify-content:space-around;padding:0 40px}
.cal-rings i{width:8px;height:18px;border-radius:4px;background:#9b9184;box-shadow:inset 0 0 0 2px #5c554c}

/* ===== wall instruments ===== */
.dialw{left:1408px;top:40px;width:264px;height:264px}
.dial-plate{left:1460px;top:312px;width:160px;height:32px;line-height:32px}
.repw{left:1700px;top:48px;width:172px;height:288px;padding:12px}
.rep-face{height:120px;border-radius:6px;overflow:hidden;background:linear-gradient(rgba(240,228,200,.95),rgba(222,206,170,.95));box-shadow:inset 0 0 0 2px #1d1814,inset 0 6px 14px rgba(0,0,0,.35)}
.rep-num{margin-top:12px;height:64px;border-radius:5px;background:linear-gradient(#2a1f12,#1f170d);display:flex;align-items:center;justify-content:center;
  font:400 40px/1 "Share Tech Mono",monospace;color:var(--amber);text-shadow:0 0 8px rgba(246,168,0,.45);box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.rep-plate{margin-top:14px;height:32px;line-height:32px;letter-spacing:1.5px}

/* ===== terminal on the desk: the plan at a glance ===== */
.term{left:56px;top:612px;width:560px;height:428px;isolation:isolate}
.crt-body{position:absolute;inset:0;border-radius:30px;background:linear-gradient(160deg,#4a4038,#2f2822 55%,#26201b);
  box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.08),inset 0 -4px 0 rgba(0,0,0,.35)}
.crt-body:after{content:"";position:absolute;inset:0;border-radius:30px;background:url(assets/tex_bakelite_cracked_512.png) 0 0/512px;opacity:.10;mix-blend-mode:overlay}
.crt-screen{position:absolute;border-radius:18px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#33240f 0%,#2a1d0c 55%,#1f160a 100%);box-shadow:inset 0 0 0 3px #15110d,inset 0 0 60px rgba(0,0,0,.65),0 0 0 6px #1d1814}
.crt-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.10) 2px 3px);z-index:3}
.crt-in{position:absolute;inset:0;z-index:2;color:var(--amber);text-shadow:0 0 6px rgba(246,168,0,.35)}
.crt-foot{position:absolute;display:flex;align-items:center;justify-content:space-between}
.crt-brand{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:3px;color:#a39686;display:flex;align-items:center;gap:12px}
.crt-led{width:10px;height:10px;border-radius:50%;background:#7fd07a;box-shadow:0 0 8px #7fd07a}
.t-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--amber-dim);padding-bottom:6px}
.t-title{font-size:24px;letter-spacing:3px}
.t-sub{font-size:16px;color:var(--amber-soft)}
.t-att{display:grid;grid-template-columns:118px 1fr auto;align-items:center;row-gap:10px;padding:14px 0 12px;border-bottom:1px dashed var(--amber-faint)}
.t-att .l{font-size:16px;letter-spacing:2px;color:var(--amber-soft)}
.t-att .l.op{color:var(--op)}
.t-att .v{font-size:18px;color:#f3d79a;text-align:right}
.t-att .v.op{color:#bfe3dc}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:12px;height:12px;border:2px solid var(--amber);background:var(--amber);box-shadow:0 0 5px rgba(246,168,0,.4)}
.pip.used{background:transparent;border-color:var(--amber-faint);box-shadow:none}
.pip.o{border-radius:50%;border-color:var(--op);background:var(--op);box-shadow:0 0 5px rgba(134,201,190,.35)}
.pip.o.used{background:transparent;border-color:var(--op-dim);box-shadow:none}
.t-q{padding-top:10px;font-size:18px;line-height:30px}
.t-q .n{color:var(--amber-soft);display:inline-block;width:40px}
.t-q .more{color:var(--amber-soft);display:flex;justify-content:space-between}


/* ===== shortcut rack ===== */
.keys{left:1268px;top:612px;width:276px;height:428px;padding:18px;display:flex;flex-direction:column;gap:12px}
.kb{height:46px;display:flex;align-items:center;gap:12px;padding:0 12px 0 8px;border-radius:3px;
  background:linear-gradient(#d4bb84,#9e8452);color:#241a0c;font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.kb.on{background:linear-gradient(#ffd36b,#e09a10);box-shadow:0 0 0 3px #F6A800,0 2px 3px rgba(0,0,0,.5)}   /* only the open menu */
.kb.off{opacity:.45}

/* ===== commit (fixed place) ===== */
.cmt{left:1584px;top:612px;width:296px;height:428px}
.cmt-plate{position:absolute;left:20px;right:20px;top:20px;height:40px;line-height:40px;font-size:22px;letter-spacing:2.5px}
.cmt-btn{position:absolute;left:53px;top:96px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#ffd36b,#f6a800 45%,#b97400 100%);
  box-shadow:0 0 0 10px #1c1713,0 0 0 13px #6e5a32,0 10px 20px rgba(0,0,0,.6),0 0 40px rgba(246,168,0,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#2a1a04}
.cmt-btn b{font:700 34px/1 "Barlow Condensed",sans-serif;letter-spacing:2px}
.cmt-btn .key{border-color:#2a1a04}
.cmt-note{position:absolute;left:16px;right:16px;top:338px;text-align:center;font:400 18px/1.3 "Share Tech Mono",monospace;color:#d8c6a6}
.date-win{position:absolute;left:20px;right:20px;top:76px;height:96px;border-radius:6px;background:linear-gradient(#2a1f12,#1f170d);box-shadow:inset 0 2px 6px rgba(0,0,0,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--amber);text-shadow:0 0 8px rgba(246,168,0,.4)}
.date-win b{font:400 38px/1 "Share Tech Mono",monospace}
.date-win span{font:400 16px/1 "Share Tech Mono",monospace;color:var(--amber-soft)}
.paused{position:absolute;left:20px;right:20px;top:188px;height:56px;border-radius:6px;border:2px solid #e24a3b;color:#ffb3a6;
  display:flex;align-items:center;justify-content:center;gap:10px;font:700 20px/1 "Barlow Condensed",sans-serif;letter-spacing:2px;background:rgba(226,74,59,.12)}
.paused i{width:12px;height:12px;border-radius:50%;background:#e24a3b;box-shadow:0 0 10px #e24a3b}
.speed{position:absolute;left:20px;right:20px;top:262px;display:flex;gap:8px}
.speed span{flex:1;text-align:center;font:700 16px/38px "Barlow Condensed",sans-serif;letter-spacing:1px;background:#1b1612;color:#cbbda8;border-radius:4px}
.speed span.on{background:linear-gradient(#d9b56a,#a8823e);color:#21180c}

/* ===== menus (each owns its own state) ===== */
.menu{left:56px;top:362px;width:1488px;height:678px}
.m-head{position:absolute;left:24px;right:24px;top:18px;height:48px;display:flex;align-items:center;gap:16px;white-space:nowrap}
.m-title{height:44px;line-height:44px;padding:0 20px;font-size:22px;letter-spacing:3px}
.m-res{display:flex;gap:12px;font:400 18px/1 "Share Tech Mono",monospace;color:#d8c6a6}
.m-res b{font-weight:400;color:var(--amber)}
.m-res b.bad{color:#ff6a4d}
.m-res em{font-style:normal;color:#cbbda8;font-size:16px;letter-spacing:.5px;margin-right:5px}
.m-close{margin-left:auto;font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;color:#d8c6a6;display:flex;gap:10px;align-items:center}
.rack-wood{background:linear-gradient(90deg,#4e3620,#6a4b2c 6%,#6a4b2c 94%,#4e3620);border-radius:8px;box-shadow:0 24px 50px rgba(0,0,0,.65)}
.grid{position:absolute;left:24px;right:24px;top:84px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px 16px}

/* slips (actions) and folders (doors) */
.slip{position:relative;height:180px;border-radius:3px;color:var(--ink);padding:32px 12px 10px 14px;background:linear-gradient(180deg,#efe5cd,#e2d5b8);box-shadow:0 4px 8px rgba(0,0,0,.5)}
.slip-tab{position:absolute;left:0;top:0;height:26px;padding:0 10px;border-radius:3px 0 3px 0;font:700 16px/26px "Barlow Condensed",sans-serif;letter-spacing:1px;color:#fff}
.slip-n{font:700 18px/1.15 "Courier Prime",monospace;padding-right:44px}
/* icons: one size per kind of place, always beside a label, never instead of one */
.ic{display:block;flex:none;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5)}
.ic-kb{width:32px;height:32px}
.kb .lab{flex:1}
.ic-slip{position:absolute;right:12px;top:32px;width:36px;height:36px}
.ic-plate{width:24px;height:24px}
.plate.wi{display:flex;align-items:center;justify-content:center;gap:10px}
.ic-res{width:22px;height:22px;display:inline-block;vertical-align:middle;margin-right:5px}
.ic-title{width:30px;height:30px}
.m-title.wi{display:flex;align-items:center;gap:12px;padding:0 18px 0 8px}
.ic-dv{width:30px;height:30px;position:absolute;right:14px;top:16px}
.slip-c{font:400 16px/1.25 "Courier Prime",monospace;margin-top:6px}
.slip-c .op{color:var(--teal-ink)}
.slip-st{position:absolute;left:12px;right:12px;bottom:12px;border:2px solid var(--stamp);color:var(--stamp);border-radius:3px;white-space:nowrap;
  font:700 16px/1.05 "Barlow Condensed",sans-serif;text-align:center;padding:4px 2px;background:rgba(168,38,29,.06)}
.slip.blocked{background:linear-gradient(180deg,#d9d0bd,#cbc1aa)}
.slip.blocked .slip-n,.slip.blocked .slip-c{color:#4b4236}
.st-in{font:700 16px/1 "Barlow Condensed",sans-serif;color:var(--stamp);border:2px solid var(--stamp);border-radius:3px;padding:3px 6px;background:rgba(168,38,29,.06)}
.res-b{font-size:16px;border:1px solid var(--amber-dim);color:var(--amber);padding:0 10px;line-height:26px;display:inline-block}
.res{display:flex;align-items:center;gap:10px;justify-content:flex-end;font-size:18px;color:#f3d79a}
.m-hrs{display:flex;gap:8px;align-items:center;font:400 18px/1 "Share Tech Mono",monospace;color:#f3d79a}
.m-hrs em{font-style:normal;color:#cbbda8;font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;margin-left:4px}
.m-hrs .pip{width:8px;height:8px}
.m-hrs .op-v{color:#bfe3dc}
.slip.soon .slip-st{border-color:#5d5346;color:#4a4238;background:none}
.slip.door{background:linear-gradient(180deg,#dcbd7d,#c9a764);border-radius:2px 4px 4px 4px}
.slip.door:before{content:"";position:absolute;right:12px;top:-9px;width:70px;height:12px;background:#d7b673;border-radius:4px 4px 0 0}
.slip.door .slip-c{color:#3e3220}
.slip.door.blocked{background:linear-gradient(180deg,#cdbf9f,#bfae88)}
.slip-go{position:absolute;left:14px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;
  font:700 16px/1 "Courier Prime",monospace;color:#3e3220;border-top:1px solid rgba(62,50,32,.35);padding-top:8px}
.slip-go b{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1px;background:#3e3220;color:#e9d6a6;padding:3px 8px;border-radius:2px}
.clip{display:inline-block;margin-top:8px;font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;color:#1f4d46;background:#cfe5df;border:1px solid var(--teal-ink);border-radius:2px;padding:3px 6px}
.lit{box-shadow:0 0 0 3px #F6A800,0 10px 22px rgba(0,0,0,.6)}
.ctx{background:#efe6cf;color:var(--ink);border-radius:3px;padding:18px 20px;box-shadow:0 10px 22px rgba(0,0,0,.55);font:400 16px/1.4 "Courier Prime",monospace}
.ctx h4{font:700 20px/1.2 "Courier Prime",monospace;margin-bottom:8px}
.ctx-row{display:flex;gap:28px;align-items:center;border-top:1px dashed #b4a582;margin-top:12px;padding-top:10px}
.ctx-row .esc{margin-left:auto;font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1px;background:#d8c79c;padding:7px 12px;border-radius:2px}

/* plan menu = the terminal, leaned into */
.bigcrt{left:56px;top:40px;width:1196px;height:1000px;isolation:isolate}
.q-h,.q-row{display:grid;grid-template-columns:50px 300px 150px 130px 180px 1fr;align-items:center}
.q-h{font-size:16px;letter-spacing:1.5px;color:var(--amber-dim);text-shadow:none;padding:16px 0 6px}
.q-row{font-size:18px;height:34px;border-bottom:1px solid rgba(138,98,36,.28)}
.q-row .n,.q-row .k{color:var(--amber-soft)}
.q-row .op{color:var(--op)}
.q-ctl{display:flex;justify-content:flex-end;gap:8px}
.q-ctl b{font-weight:400;width:30px;height:26px;line-height:24px;text-align:center;border:1px solid var(--amber-dim);color:var(--amber-soft);font-size:16px}
.q-tools{display:flex;justify-content:space-between;align-items:center;padding-top:12px}
.q-btn{border:1px solid var(--amber-dim);padding:5px 14px;font-size:18px;color:var(--amber);margin-right:12px}
.q-tot{font-size:18px;color:#f3d79a}
.uw-h,.uw-row{display:grid;grid-template-columns:300px 1fr 240px;align-items:center}
.uw-h{font-size:16px;letter-spacing:1.5px;color:var(--amber-dim);text-shadow:none;padding:18px 0 6px}
.uw-months{display:grid;grid-template-columns:repeat(4,1fr)}
.uw-months span{border-left:1px solid var(--amber-faint);padding-left:6px}
.uw-row{height:34px;font-size:18px}
.uw-track{position:relative;height:34px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(138,98,36,.45) calc(25% - 1px) 25%)}
.uw-bar{position:absolute;top:11px;height:12px;background:linear-gradient(90deg,var(--amber-dim),var(--amber))}
.uw-bar:after{content:"";position:absolute;right:-7px;top:-1px;width:14px;height:14px;background:var(--amber);transform:rotate(45deg)}
.uw-lab{padding-left:20px;color:#f3d79a;white-space:nowrap}
.rq{display:flex;align-items:center;gap:12px}
.rq-label{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;color:#cbbda8}
.rq-sw{display:flex;background:#1b1612;border-radius:6px;padding:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.rq-sw span{font:600 16px/1 "Barlow Condensed",sans-serif;color:#a39686;padding:9px 14px;border-radius:4px;min-width:88px;text-align:center}
.rq-sw span.on{background:linear-gradient(#d9b56a,#a8823e);color:#21180c}
.esc-plate{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;color:#cbbda8;border:2px solid #6e5a32;border-radius:4px;padding:8px 14px}

/* upgrades drawer */
.ug{position:relative;height:270px;background:linear-gradient(180deg,#f1e8d2,#e2d6ba);border-radius:3px;color:var(--ink);padding:16px 14px 12px;box-shadow:0 6px 12px rgba(0,0,0,.5)}
.ug-n{font:700 18px/1.2 "Courier Prime",monospace;min-height:44px}
.ug-p{font:700 24px/1 "Courier Prime",monospace;margin:10px 0 12px;color:#3e3220}
.ug-d{font:400 16px/1.35 "Courier Prime",monospace;color:#4b4236}
.ug-b{position:absolute;left:14px;right:14px;bottom:14px;height:42px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;background:#3e3220;color:#e9d6a6}
.ug.no{background:linear-gradient(180deg,#d9d0bd,#cbc1aa)}
.ug.no .ug-b{background:none;border:2px solid var(--stamp);color:var(--stamp)}
.ug.own .ug-b{background:none;border:2px solid var(--teal-ink);color:var(--teal-ink)}
.ug.divider{background:linear-gradient(180deg,#b89a62,#9c7f4b);color:#241a0c;padding-top:64px}
.dv-tab{position:absolute;left:14px;top:14px;font:700 18px/34px "Barlow Condensed",sans-serif;letter-spacing:1.5px;background:#e2cfa0;padding:0 14px;border-radius:3px}
.dv-t{font:700 20px/1.2 "Courier Prime",monospace}
.dv-s{font:400 16px/1.35 "Courier Prime",monospace;margin-top:8px;color:#3e3220}

/* watch: event slip */
.ev{left:700px;top:120px;width:620px;background:linear-gradient(180deg,#f2e9d4,#e6dabe);border-radius:3px;color:var(--ink);
  box-shadow:0 20px 40px rgba(0,0,0,.6);transform:rotate(-1.2deg);padding:26px 30px 28px}
.ev-k{font:700 16px/1 "Barlow Condensed",sans-serif;letter-spacing:2px;color:#7d3028;display:flex;justify-content:space-between}
.ev-t{font:700 30px/1.1 "Courier Prime",monospace;margin:14px 0 12px}
.ev-p{font:400 18px/1.4 "Courier Prime",monospace;color:#3a3024}
.ev-o{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.ev-o div{display:grid;grid-template-columns:40px 1fr auto;align-items:center;height:52px;border:2px solid #5a4a38;border-radius:3px;padding:0 14px;font:700 18px/1 "Courier Prime",monospace;background:rgba(255,255,255,.25)}
.ev-o div i{font:700 16px/1 "Barlow Condensed",sans-serif;font-style:normal;background:#3e3220;color:#e9d6a6;text-align:center;padding:4px 0;border-radius:2px;width:28px}
.ev-o div span{font:400 16px/1 "Courier Prime",monospace;color:#3a3024}
.ev-f{margin-top:14px;font:400 16px/1 "Courier Prime",monospace;color:#5a4a38;text-align:right}
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
var Q = new URLSearchParams(location.search);
var VIEW = Q.get("view") || "home";

// ===== fixture: views of existing state only (same as round 1) =====
// m5 queue: one row per play. [name, from-door ("" = direct action), hours, kind, money, rep]
var M5Q = [
  ["Go to Meetups","Scouting",1,"op",300,0],
  ["Hire: Safety Researcher","Hire Staff",1,"plan",60000,0],

// ===== layout self-check (?check=1) =====
function selfCheck(){
  var leaves = Array.prototype.filter.call(document.querySelectorAll("#stage *"), function(e){
    return Array.prototype.some.call(e.childNodes, function(n){ return n.nodeType===3 && n.textContent.trim(); });
  });
  var out = [];
  leaves.forEach(function(e){
    var cs = getComputedStyle(e);
    if (cs.display!=="inline" && e.clientWidth>0 && e.scrollWidth > e.clientWidth+1) out.push("OVERFLOW-X "+e.className+" '"+e.textContent.trim().slice(0,30)+"'");
    var box = e.closest(".slip,.ug,.ev,.cmt,.ctx,.keys,.cal,.crt-screen,.repw,.menu");
    if (box && box!==e){ var r=e.getBoundingClientRect(), b=box.getBoundingClientRect();
      if (r.right>b.right+1||r.bottom>b.bottom+1||r.left<b.left-1||r.top<b.top-1) out.push("OUTSIDE "+e.className+" '"+e.textContent.trim().slice(0,30)+"'"); }
    if (parseFloat(cs.fontSize)<14) out.push("SMALL "+e.className+" '"+e.textContent.trim().slice(0,20)+"'");
  });
  var R = leaves.map(function(e){ return e.getBoundingClientRect(); });
  for (var i=0;i<leaves.length;i++) for (var j=i+1;j<leaves.length;j++){
    if (leaves[i].contains(leaves[j])||leaves[j].contains(leaves[i])) continue;
    var a=R[i], b=R[j], w=Math.min(a.right,b.right)-Math.max(a.left,b.left), h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
    if (w>2&&h>2) out.push("OVERLAP '"+leaves[i].textContent.trim().slice(0,24)+"' x '"+leaves[j].textContent.trim().slice(0,24)+"'");
  }
  var pre = document.createElement("pre"); pre.id="check"; pre.textContent = "CHECK-BEGIN\n"+out.join("\n")+"\nCHECK-END"; document.body.appendChild(pre);
}
