<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab Terminal</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bezel:#3a2b20; --bezel-hi:#4a382a;
  --screen:#251912; --pane:#2d1f16; --pane-hi:#382719;
  --amb:#F5B041; --amb-hi:#FFD58A; --dim:#D09A5C; --faint:#BC8A55;
  --rule:#7A5532; --rule-hi:#A4743F;
  --grn:#A3DB7E; --red:#FF8366; --ink:#2a1a10;
  --doom:#F6B23C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,var(--bezel-hi),var(--bezel) 70%);font-family:"IBM Plex Mono",Consolas,monospace;color:var(--amb);font-size:16px;line-height:1.3}
.scr{position:absolute;left:8px;top:8px;width:1904px;height:1064px;border-radius:20px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,#2b1d15 0%,var(--screen) 65%,#21160f 100%);
  box-shadow:inset 0 0 0 2px #16100b,inset 0 0 60px rgba(0,0,0,.45)}
/* scanlines live only on backgrounds: drawn under text, never over it */
.scan{background-image:repeating-linear-gradient(0deg,rgba(255,180,80,.035) 0 1px,transparent 1px 3px)}
.box{position:absolute}

/* ---------- pane: DOS-style double rule with title on the border ---------- */
.pn{position:absolute;border:3px double var(--rule);background-color:var(--pane);border-radius:2px}
.pn-t{position:absolute;top:-13px;left:14px;padding:0 8px;background:var(--screen);font-weight:600;font-size:16px;letter-spacing:.08em;color:var(--amb-hi);line-height:22px}
.pn-k{position:absolute;top:-13px;right:14px;padding:0 8px;background:var(--screen);font-size:14px;color:var(--faint);line-height:22px;letter-spacing:.04em}
.pn-k b{color:var(--amb);font-weight:600}

/* ---------- status bar ---------- */
.st{position:absolute;left:12px;top:12px;width:1880px;height:44px;display:flex;align-items:stretch;border:2px solid var(--rule);background:var(--pane-hi)}
.st-sys{background:var(--amb);color:var(--ink);font-weight:700;padding:0 16px;display:flex;align-items:center;font-size:18px;letter-spacing:.1em}
.st-date{padding:0 22px;display:flex;align-items:center;font-family:VT323,monospace;font-size:34px;color:var(--amb-hi);border-right:2px solid var(--rule)}
.st-r{display:flex;align-items:center;gap:8px;padding:0 20px;border-right:1px solid var(--rule)}
.st-r i{font-style:normal;font-size:14px;color:var(--faint);letter-spacing:.08em}
.st-r b{font-family:VT323,monospace;font-weight:400;font-size:30px;color:var(--amb-hi)}
.st-r b.neg{color:var(--red)}
.st-flag{font-size:14px;font-weight:700;color:var(--ink);background:var(--red);padding:0 6px;line-height:20px}
.st-sp{flex:1}
.st-play{display:flex;align-items:center;gap:6px;padding:0 14px;border-left:1px solid var(--rule)}
.st-play span{font-size:16px;font-weight:600;padding:3px 10px;border:1px solid var(--rule-hi);color:var(--amb-hi)}
.st-play span.on{background:var(--red);color:var(--ink);border-color:var(--red)}
.st-play em{font-style:normal;font-size:14px;color:var(--faint);margin-left:4px}
.st-mode{display:flex;align-items:center;gap:0;padding:0 10px}
.st-mode span{font-size:16px;font-weight:600;padding:4px 14px;letter-spacing:.1em;border:1px solid var(--rule)}
.st-mode span.on{background:var(--amb);color:var(--ink);border-color:var(--amb)}
.st-mode span.off{color:var(--faint)}

/* ---------- actions (directory listing) ---------- */
.ac-head,.ac-row{display:grid;grid-template-columns:42px 206px 140px 1fr;column-gap:8px;align-items:center;padding:0 12px}
.ac-head{height:28px;font-size:14px;color:var(--faint);letter-spacing:.08em;border-bottom:1px solid var(--rule)}
.ac-grp{height:26px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:14px;color:var(--faint);letter-spacing:.1em}
.ac-grp:after{content:"";flex:1;border-top:1px dashed var(--rule)}
.ac-row{height:38px;font-size:16px;cursor:pointer}
.ac-row:hover{background:var(--pane-hi)}
.ac-key{color:var(--ink);background:var(--dim);font-weight:700;width:26px;height:22px;display:flex;align-items:center;justify-content:center;font-size:15px}
.ac-nm{color:var(--amb-hi);font-weight:500;white-space:nowrap}
.ac-dir{color:var(--amb-hi);font-weight:600}
.ac-cost{color:var(--dim);white-space:nowrap}
.ac-st{white-space:nowrap;color:var(--dim)}
.ac-st.go{color:var(--grn)}
.ac-st.dir{color:var(--amb)}
.ac-st.no{color:var(--red)}
.ac-row.off .ac-nm{color:var(--dim)}
.ac-row.off .ac-key{background:var(--rule)}
.ac-row.sel{background:var(--amb)}
.ac-row.sel *{color:var(--ink)!important}
.ac-row.sel .ac-key{background:var(--ink);color:var(--amb)!important}
.ac-foot{position:absolute;left:12px;right:12px;bottom:12px;height:30px;display:flex;align-items:center;gap:22px;font-size:14px;color:var(--faint);border-top:1px solid var(--rule);padding-top:8px}
.ac-foot b{color:var(--amb);font-weight:600}
.hp{color:var(--amb)} .ho{color:var(--grn)}

/* ---------- attention gauge ---------- */
.at-row{display:grid;grid-template-columns:132px 1fr 150px;align-items:center;height:36px;padding:0 16px}
.at-lb{font-size:16px;font-weight:600;letter-spacing:.08em}
.at-cells{display:flex;gap:5px}
.at-c{width:30px;height:22px;flex:none;border:2px solid currentColor}
.at-c.used{background:currentColor}
.at-c.used:after{content:"";display:block;height:100%;background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(42,26,16,.35) 3px 4px)}
.at-v{font-size:16px;text-align:right;white-space:nowrap}
.at-v b{font-family:VT323,monospace;font-size:28px;font-weight:400;vertical-align:-3px}
.at-res{display:flex;align-items:center;gap:10px}
.at-btn{border:1px solid var(--rule-hi);color:var(--amb-hi);font-size:16px;font-weight:600;padding:1px 9px;background:var(--pane-hi);cursor:pointer}
.at-sum{font-size:14px;color:var(--faint)}

/* ---------- month plan ---------- */
.pl-head,.pl-row{display:grid;grid-template-columns:46px 280px 150px 104px 1fr 36px;align-items:center;padding:0 14px}
.pl-head{height:30px;font-size:14px;color:var(--faint);letter-spacing:.08em;border-bottom:1px solid var(--rule);margin-top:10px}
.pl-row{height:38px;font-size:16px;border-bottom:1px dotted rgba(122,85,50,.6)}
.pl-n{font-family:VT323,monospace;font-size:26px;color:var(--amb)}
.pl-nm{color:var(--amb-hi);font-weight:500;white-space:nowrap}
.pl-fr{color:var(--dim);white-space:nowrap}
.pl-c{color:var(--dim);white-space:nowrap}
.pl-x{color:var(--dim);font-size:16px;font-weight:600;border:1px solid var(--rule);text-align:center;cursor:pointer;line-height:22px}
.pl-row.empty .pl-n{color:var(--rule-hi)}
.pl-row.empty .pl-nm{color:var(--faint);font-weight:400;letter-spacing:.3em}
.pl-foot{position:absolute;left:14px;right:14px;bottom:12px;height:44px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--rule);padding-top:8px}
.pl-btn{border:1px solid var(--rule-hi);background:var(--pane-hi);color:var(--amb-hi);padding:5px 12px;font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap}
.pl-btn i{font-style:normal;color:var(--faint);font-size:14px;margin-left:8px}
.pl-btn.dis{color:var(--faint);border-color:var(--rule)}
.pl-tot{margin-left:auto;font-size:16px;color:var(--dim);white-space:nowrap}
.pl-tot b{color:var(--amb-hi);font-weight:600}

/* ---------- flyout (door opened: A -> B -> C) ---------- */
.fo{position:absolute;z-index:10;border:3px double var(--amb);background-color:var(--pane-hi);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fo-t{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--amb);color:var(--ink);font-weight:700;letter-spacing:.08em}
.fo-t span{font-weight:500;font-size:14px;letter-spacing:.02em}
.fo-row{display:grid;grid-template-columns:34px 1fr 140px;align-items:center;height:40px;padding:0 12px;border-bottom:1px dotted var(--rule);font-size:16px}
.fo-row .k{color:var(--ink);background:var(--dim);font-weight:700;width:24px;height:22px;display:flex;align-items:center;justify-content:center}
.fo-row .n{color:var(--amb-hi);font-weight:500}
.fo-row .c{text-align:right;white-space:nowrap}
.fo-row.off .n{color:var(--dim)} .fo-row.off .k{background:var(--rule)}
.fo-row .why{grid-column:2/4;font-size:14px;color:var(--red);margin-top:-6px}
.fo-row.tall{height:58px;align-content:center}
.fo-row.hi{background:rgba(245,176,65,.16);outline:1px solid var(--amb);outline-offset:-1px}
.fo-c{padding:12px 14px;font-size:16px;color:var(--amb-hi)}
.fo-c p{margin-bottom:10px}
.fo-c .m{color:var(--dim);font-size:14px;letter-spacing:.06em;margin-bottom:4px}
.fo-c .btn{display:inline-block;margin-top:4px;background:var(--amb);color:var(--ink);font-weight:700;padding:6px 14px}

/* ---------- P(Doom) + reputation instruments ---------- */
.dm-blk{padding:14px 18px 0}
.dm-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--faint);letter-spacing:.1em}
.dm-num{font-family:VT323,monospace;font-size:96px;line-height:.9;color:var(--doom);display:flex;align-items:baseline;gap:14px}
.dm-num small{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--ink);background:var(--doom);padding:1px 8px;position:relative;top:-14px}
.dm-g{display:flex;gap:3px;margin-top:6px}
.dm-g span{flex:1;height:16px;border:1px solid var(--rule-hi)}
.dm-g span.f{background:var(--doom);border-color:var(--doom)}
.dm-ends{display:flex;justify-content:space-between;font-size:14px;color:var(--faint);margin-top:4px}
.rp-row{display:flex;align-items:center;gap:16px;padding:10px 18px 0;border-top:1px solid var(--rule);margin-top:12px}
.rp-num{font-family:VT323,monospace;font-size:60px;line-height:.9;color:var(--amb-hi);width:72px}
.rp-r{flex:1}
.rp-g{display:flex;gap:3px;margin:4px 0}
.rp-g span{flex:1;height:12px;border:1px solid var(--rule-hi)}
.rp-g span.f{background:var(--amb-hi);border-color:var(--amb-hi)}

/* ---------- under way (gantt) ---------- */
.uw-ruler{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 18px 0;border-bottom:1px solid var(--rule-hi);font-size:14px;color:var(--faint);letter-spacing:.08em}
.uw-ruler span{border-left:1px solid var(--rule);padding:0 0 3px 6px}
.uw-ruler span.now{color:var(--amb-hi);border-left:2px solid var(--amb-hi)}
.uw-item{margin:12px 18px 0;position:relative;height:46px}
.uw-nm{font-size:16px;color:var(--amb-hi);display:flex;justify-content:space-between;white-space:nowrap}
.uw-nm i{font-style:normal;color:var(--dim)}
.uw-bar{position:absolute;left:0;bottom:2px;height:14px;background:repeating-linear-gradient(90deg,var(--amb) 0 10px,rgba(245,176,65,.55) 10px 12px)}
.uw-bar:after{content:"";position:absolute;right:-7px;top:-3px;width:0;height:0;border-left:7px solid var(--amb-hi);border-top:10px solid transparent;border-bottom:10px solid transparent}
.uw-none{margin:18px 18px 0;font-size:16px;color:var(--faint)}

/* ---------- cameras ---------- */
.cm-feed{position:absolute;left:10px;right:10px;top:14px;bottom:10px;overflow:hidden;border:1px solid var(--rule)}
.cm-feed img{width:100%;height:100%;object-fit:cover;filter:sepia(1) saturate(1.6) hue-rotate(-8deg) brightness(.95) contrast(1.1)}
.cm-feed:before{content:"";position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.cm-feed:after{content:"";position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 55%,rgba(20,10,6,.55) 100%)}
.cm-tint{position:absolute;inset:0;z-index:1;mix-blend-mode:multiply}

/* ---------- staff ---------- */
.sf-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;height:36px;padding:0 18px;font-size:16px}
.sf-row:first-child{margin-top:12px}
.sf-row b{color:var(--amb-hi);font-weight:500}
.sf-row i{font-style:normal;color:var(--dim)}
.sf-d{width:10px;height:10px;background:var(--grn)}

/* ---------- key bar + commit ---------- */
.kb{position:absolute;left:12px;top:998px;width:1376px;height:54px;display:flex;gap:10px;align-items:stretch}
.kb-k{display:flex;align-items:center;border:1px solid var(--rule-hi);background:var(--pane-hi);cursor:pointer}
.kb-k b{background:var(--dim);color:var(--ink);font-weight:700;height:100%;display:flex;align-items:center;padding:0 10px;font-size:16px}
.kb-k span{padding:0 14px;font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--amb-hi);white-space:nowrap}
.kb-k span em{font-style:normal;color:var(--dim);font-weight:400}
.kb-sp{flex:1}
.cmt{position:absolute;left:1404px;top:998px;width:488px;height:54px;background:var(--amb);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px;cursor:pointer;box-shadow:0 0 0 2px var(--amb-hi),0 0 22px rgba(245,176,65,.35)}
.cmt b{font-size:22px;font-weight:700;letter-spacing:.12em}
.cmt span{font-size:14px;font-weight:600;border:2px solid var(--ink);padding:2px 8px}
.cmt.wait{background:var(--pane-hi);color:var(--amb-hi);box-shadow:0 0 0 2px var(--rule-hi)}
.cmt.wait span{border-color:var(--rule-hi);color:var(--amb-hi)}
.cmt-sub{position:absolute;left:1404px;top:984px;width:488px;text-align:center;font-size:14px;color:var(--faint);line-height:14px;display:none}

/* ---------- watch: feed, in-flight, event ---------- */
.fd-row{display:grid;grid-template-columns:86px 1fr;padding:6px 16px;font-size:16px;line-height:1.35;border-bottom:1px dotted rgba(122,85,50,.6)}
.fd-row i{font-style:normal;color:var(--dim)}
.fd-row span{color:var(--amb-hi)}
.fd-row.al span{color:var(--red);font-weight:600}
.fd-row.al i{color:var(--red)}
.fd-cur{padding:8px 16px;font-size:16px;color:var(--amb)}
.fd-cur:after{content:"";display:inline-block;width:10px;height:18px;background:var(--amb);vertical-align:-3px;margin-left:4px}
.if-row{display:grid;grid-template-columns:40px 1fr 110px;align-items:center;height:40px;padding:0 16px;font-size:16px;border-bottom:1px dotted rgba(122,85,50,.6)}
.if-row .n{font-family:VT323,monospace;font-size:26px}
.if-row .nm{color:var(--amb-hi)}
.if-row .s{text-align:right;font-weight:600;font-size:14px;letter-spacing:.08em}
.s-done{color:var(--grn)} .s-run{color:var(--amb-hi)} .s-wait{color:var(--faint)}
.ev{position:absolute;z-index:10;border:3px double var(--amb-hi);background-color:var(--pane-hi);box-shadow:0 0 0 6px rgba(37,25,18,.85),0 20px 40px rgba(0,0,0,.5)}
.ev-t{background:var(--red);color:var(--ink);font-weight:700;letter-spacing:.12em;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.ev-t span{font-weight:600;letter-spacing:.04em}
.ev-b{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:18px}
.ev-ph{width:200px;height:170px;border:1px solid var(--rule-hi);overflow:hidden;position:relative}
.ev-ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(1) saturate(1.4) contrast(1.15) brightness(.9)}
.ev-ph:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.ev-h{font-family:VT323,monospace;font-size:40px;line-height:1;color:var(--amb-hi);margin-bottom:10px}
.ev-p{font-size:16px;line-height:1.45;color:var(--amb-hi)}
.ev-o{display:grid;grid-template-columns:40px 1fr auto;align-items:center;height:46px;margin:0 18px;border-top:1px dotted var(--rule);font-size:17px;cursor:pointer}
.ev-o .k{background:var(--amb);color:var(--ink);font-weight:700;width:28px;height:26px;display:flex;align-items:center;justify-content:center}
.ev-o .n{color:var(--amb-hi);font-weight:500}
.ev-o .c{color:var(--dim)}
.ev-f{display:flex;justify-content:space-between;padding:10px 18px 14px;font-size:14px;color:var(--faint);border-top:1px solid var(--rule);margin-top:6px}

/* ---------- upgrades program ---------- */
.up-head,.up-row{display:grid;grid-template-columns:46px 470px 150px 1fr;column-gap:16px;align-items:center;padding:0 16px}
.up-head{height:30px;font-size:14px;color:var(--faint);letter-spacing:.08em;border-bottom:1px solid var(--rule);margin-top:12px}
.up-row{height:114px;align-content:center;font-size:16px;border-bottom:1px dotted rgba(122,85,50,.6);cursor:pointer}
.up-row .k{color:var(--ink);background:var(--dim);font-weight:700;width:26px;height:22px;display:flex;align-items:center;justify-content:center}
.up-row .n{color:var(--amb-hi);font-weight:500}
.up-row .d{display:block;font-size:14px;color:var(--dim);font-weight:400;margin-top:4px;line-height:1.35;white-space:normal}
.up-row .c{color:var(--amb-hi);font-family:VT323,monospace;font-size:26px}
.up-row.off .n,.up-row.off .c{color:var(--dim)} .up-row.off .k{background:var(--rule)}
.up-row.sel{background:var(--amb)} .up-row.sel *{color:var(--ink)!important} .up-row.sel .k{background:var(--ink);color:var(--amb)!important}
.up-det{padding:16px 20px;font-size:16px;color:var(--amb-hi);line-height:1.45}
.up-det h3{font-family:VT323,monospace;font-weight:400;font-size:40px;line-height:1;margin-bottom:12px}
.up-det .m{font-size:14px;color:var(--faint);letter-spacing:.08em;margin:14px 0 4px}
.up-det .btn{display:inline-block;margin-top:18px;background:var(--amb);color:var(--ink);font-weight:700;padding:8px 18px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="scr" id="scr"></div>
<script>
(function(){
var view=(new URLSearchParams(location.search).get('view')||'m1');
var M5=(view==='m5'||view==='place2');
var S=document.getElementById('scr');
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function pane(x,y,w,h,title,keys,inner,extra){
  return '<div class="pn scan" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;'+(extra||'')+'">'+
   '<div class="pn-t">'+title+'</div>'+(keys?'<div class="pn-k">'+keys+'</div>':'')+inner+'</div>';
}
var doomPct=M5?40.2:20.0, rep=M5?32:50;
if(M5){document.documentElement.style.setProperty('--doom','#FF9A4D');}

/* ---------------- state ---------------- */
var st=M5?{date:'NOV 2017',money:'$140,000',compute:'65',research:'-12',papers:'0',staff:'2'}
         :{date:'JUL 2017',money:'$245,000',compute:'100',research:'0',papers:'0',staff:'1'};
if(view==='watch'){st.date='JUL 2017';}

/* status bar */
function statusBar(mode){
  var h='<div class="st"><div class="st-sys">LAB.SYS</div><div class="st-date">'+st.date+(view==='watch'?'&nbsp;&nbsp;DAY 12/31':'')+'</div>'+
   '<div class="st-r"><i>MONEY</i><b>'+st.money+'</b></div>'+
   '<div class="st-r"><i>COMPUTE</i><b>'+st.compute+'</b></div>'+
   '<div class="st-r"><i>RESEARCH</i><b class="'+(st.research.charAt(0)==='-'?'neg':'')+'">'+st.research+'</b>'+(st.research.charAt(0)==='-'?'<span class="st-flag">[!] BELOW 0</span>':'')+'</div>'+
   '<div class="st-r"><i>PAPERS</i><b>'+st.papers+'</b></div>'+
   '<div class="st-r"><i>STAFF</i><b>'+st.staff+'</b></div>'+
   '<div class="st-sp"></div>'+(mode==='watch'?'<div class="st-play"><span class="on">|| PAUSED</span><span>&gt; 1x</span><span>&gt;&gt; 2x</span><em>SPACE</em></div>':'')+
   '<div class="st-mode"><span class="'+(mode==='plan'?'on':'off')+'">PLAN</span><span class="'+(mode==='watch'?'on':'off')+'">WATCH</span></div></div>';
  S.appendChild(el(h));
}

/* ---------------- actions listing ---------------- */
function actionsPane(selKey){
  var P='<span class="hp">plan</span>', O='<span class="ho">op</span>';
  var groups=[
   ['FUNDING',[
     ['Fundraising/','4 choices','dir','DIR &gt;'],
     ['Financing/','7 choices','dir','DIR &gt;']]],
   ['PEOPLE',[
     ['Hire Staff/','7 roles', M5?'no':'dir', M5?'no plan hrs left':'DIR &gt;'],
