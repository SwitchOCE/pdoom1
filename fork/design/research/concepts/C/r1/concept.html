<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paperwork Desk</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#3a2a30; --wall2:#2c2027;
  --wood:#6a5238;
  --paper:#efe6d0; --paper2:#e4d8bc; --paper-line:#c9d3d6;
  --ink:#24201b; --ink2:#4a4238; --print:#2c5a4d; --print-soft:#7c9a8f;
  --red:#b02a22; --red-ink:rgba(176,42,34,.92);
  --plan:#94600f; --plan-fill:#d9a441; --op:#1d6869; --op-fill:#3f9a96;
  --manila:#d6b77c; --manila2:#c9a666;
  --amber:#F6A800; --brass:#b08d4a; --brass2:#7a5f2c;
  --lamp-off:#4a3328;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#3a2a30}
body{font-family:"IBM Plex Sans Condensed",Arial Narrow,sans-serif;color:var(--ink)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--wood)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:"Courier Prime","Courier New",monospace}
.key{display:inline-block;font-family:"Courier Prime",monospace;font-weight:700;font-size:16px;line-height:20px;padding:0 6px;border:1.5px solid currentColor;border-radius:3px;opacity:.9}

/* ---------- WALL STRIP (fixed frame) ---------- */
.wl{position:absolute;left:0;top:0;width:1920px;height:200px;
  background:linear-gradient(180deg,rgba(58,42,48,.86),rgba(44,32,39,.92)),url(assets/tex_painted_metal_panel_512.png);
  background-size:auto,256px;border-bottom:6px solid #241a1e;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.wl-cal{position:absolute;left:24px;top:16px;width:150px;height:168px;background:var(--paper);box-shadow:2px 3px 0 rgba(0,0,0,.35);text-align:center}
.wl-cal-yr{height:34px;background:var(--red);color:#f6ece0;font:600 18px/34px Oswald;letter-spacing:3px}
.wl-cal-mo{font:700 62px/76px Oswald;color:var(--ink);letter-spacing:2px}
.wl-cal-sub{font:600 16px/20px "IBM Plex Sans Condensed";color:var(--ink2);text-transform:uppercase;letter-spacing:1px}
.wl-cal-pin{position:absolute;left:69px;top:-6px;width:12px;height:12px;border-radius:50%;background:#9b9b9b;box-shadow:0 2px 2px rgba(0,0,0,.5)}
.wl-acc{position:absolute;left:194px;top:16px;height:168px;display:flex;gap:12px}
.wl-plq{height:168px;padding:14px 14px 0;background:linear-gradient(180deg,#8f7446,#6f5732);border:2px solid #4b3b20;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,235,190,.35),2px 3px 0 rgba(0,0,0,.35)}
.wl-plq-l{font:700 15px/20px "IBM Plex Sans Condensed";letter-spacing:2px;color:#2a1e0e;text-transform:uppercase}
.wl-plq-win{margin-top:10px;height:58px;padding:0 12px;background:linear-gradient(180deg,#3b2e25,#4a3a2e);border:2px solid #2a1e12;border-radius:3px;
  font:700 34px/54px "Courier Prime";color:#f1e4c8;letter-spacing:1px;white-space:nowrap;box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.wl-plq-win.neg{color:#ff8f7a}
.wl-plq-n{margin-top:10px;font:600 15px/20px "IBM Plex Sans Condensed";color:#2a1e0e;min-height:20px}
.wl-plq-n.flag{color:#fff;background:var(--red);display:inline-block;padding:0 8px;border-radius:2px;letter-spacing:.5px}

.wl-doom{position:absolute;left:874px;top:10px;width:392px;height:180px;padding:12px 18px;border-radius:6px;
  background:linear-gradient(180deg,#5d4a3a,#46372b);border:3px solid #2b2019;box-shadow:inset 0 1px 0 rgba(255,220,170,.25),3px 4px 0 rgba(0,0,0,.4)}
.wl-doom-l{display:flex;justify-content:space-between;align-items:baseline;font:700 17px/22px Oswald;letter-spacing:3px;color:#f3e3c4}
.wl-doom-r{font:400 28px/28px VT323;letter-spacing:2px;color:var(--doomc);margin-left:18px;align-self:flex-end;margin-bottom:14px}
.wl-doom-scr{margin-top:6px;height:84px;border-radius:4px;border:2px solid #1f1612;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 50%,#4a2416,#341a12 75%);display:flex;align-items:center;justify-content:center}
.wl-doom-scr::after{content:"";position:absolute;inset:0;background:url(assets/tex_amber_scanlines_512.png);background-size:256px;opacity:.18;mix-blend-mode:screen;pointer-events:none}
.wl-doom-v{font:400 92px/84px VT323;letter-spacing:4px;color:var(--doomc);text-shadow:0 0 14px var(--doomc)}
.wl-doom-lamps{margin-top:10px;display:flex;gap:4px}
.wl-lamp{flex:1;height:14px;border-radius:2px;background:var(--lamp-off);border:1px solid #2a1c16}
.wl-lamp.on{background:var(--doomc);box-shadow:0 0 6px var(--doomc)}
.wl-lamp.end{background:#6d1814}

.wl-win{position:absolute;left:1290px;top:16px;width:356px;height:168px;border:8px solid #4a3a2c;border-radius:3px;overflow:hidden;
  box-shadow:inset 0 0 0 2px #2a1e16,3px 4px 0 rgba(0,0,0,.4);background:url(assets/office_wide_dawn.webp) center 58%/cover}
.wl-win::before{content:"";position:absolute;inset:0;background:var(--doomwash)}
.wl-win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#4a3a2c}
.wl-win.blinds{background:repeating-linear-gradient(180deg,#cdbf9f 0 13px,#a8996f 13px 15px)}
.wl-win.blinds::before{background:linear-gradient(90deg,rgba(0,0,0,.08),rgba(0,0,0,0) 30%,rgba(0,0,0,.12))}
.wl-rep{position:absolute;left:1670px;top:16px;width:226px;height:168px;border-radius:6px;padding:10px 12px;
  background:linear-gradient(180deg,#e9dfc8,#d9ccb0);border:3px solid #6b5636;box-shadow:3px 4px 0 rgba(0,0,0,.35)}
.wl-rep-l{font:700 15px/18px "IBM Plex Sans Condensed";letter-spacing:2px;color:var(--ink2);text-transform:uppercase}
.wl-rep svg{display:block;margin:2px auto 0}
.wl-rep-top{display:flex;justify-content:space-between;align-items:baseline}
.wl-rep-v{font:700 36px/36px Oswald;color:var(--ink)}

/* ---------- DESK ---------- */
.desk{position:absolute;left:0;top:200px;width:1920px;height:880px;
  background:linear-gradient(180deg,rgba(40,24,12,.35),rgba(40,24,12,0) 60px),linear-gradient(rgba(122,88,52,.55),rgba(96,68,40,.62)),url(assets/tex_plywood_stained_512.png);
  background-size:auto,auto,512px}

/* card file tray */
.cf{position:absolute;left:24px;top:20px;width:840px;height:840px;border-radius:6px;padding:0 10px 10px;
  background:linear-gradient(180deg,#4b3a2c,#3e3024);border:3px solid #2e2219;box-shadow:inset 0 2px 8px rgba(0,0,0,.5),3px 5px 0 rgba(0,0,0,.3)}
.cf-hd{height:46px;display:flex;align-items:center;justify-content:space-between}
.cf-plate{font:700 17px/26px Oswald;letter-spacing:3px;color:#2a1e0e;padding:0 14px;background:linear-gradient(180deg,#c9a865,#9c7c40);border:1px solid #5e4720;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,240,200,.6)}
.cf-count{font:600 15px/20px "IBM Plex Sans Condensed";color:#e8d9bb;letter-spacing:1px}
.cf-rows{display:flex;flex-direction:column;gap:12px}
.cf-row{display:flex;gap:8px;height:145px}
.cf-div{width:28px;flex:none;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#b9a27a,#a58c62);display:flex;align-items:center;justify-content:center}
.cf-div span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 14px/1 "IBM Plex Sans Condensed";letter-spacing:2px;color:#2e2416;text-transform:uppercase;white-space:nowrap}
.cf-slots{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cf-slot{position:relative;min-width:0}
.cf-slot>.cf-card{width:100%}
.cf-card{position:relative;height:145px;padding:26px 10px 10px;background:var(--paper);border-radius:2px;box-shadow:1px 2px 0 rgba(0,0,0,.35);
  background-image:linear-gradient(var(--red) 0 0),repeating-linear-gradient(180deg,transparent 0 21px,var(--paper-line) 21px 22px);
  background-size:100% 2px,100% 100%;background-position:0 48px,0 50px;background-repeat:no-repeat,no-repeat;cursor:pointer;display:flex;flex-direction:column;text-align:left}
.cf-card.folder{background:var(--manila);background-image:none;padding-top:28px;clip-path:polygon(0 0,40% 0,45% 17px,100% 17px,100% 100%,0 100%)}
.cf-card.folder::before{content:"FOLDER";position:absolute;left:10px;top:0;font:700 16px/17px "IBM Plex Sans Condensed";letter-spacing:1px;color:#5c4520}
.cf-card.folder{box-shadow:none;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.35))}
.cf-card>*{flex-shrink:0}
.cf-name{font:600 18px/21px "IBM Plex Sans Condensed";color:var(--ink);min-height:21px}
.cf-cost{margin-top:4px;font:500 16px/20px "IBM Plex Sans Condensed";color:var(--ink2)}
.cf-cost b{font-weight:700}
.p{color:var(--plan);font-weight:700}.o{color:var(--op);font-weight:700}
.cf-note{font-weight:500;color:#4a3a1c}
.cf-open{font:700 16px/20px "IBM Plex Sans Condensed";color:#5c4520}
.cf-foot{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:4px 6px}
.cf-st{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.stamp{display:inline-block;white-space:nowrap;font:600 16px/19px Oswald;letter-spacing:.5px;text-transform:uppercase;color:var(--red-ink);border:2px solid var(--red-ink);padding:0 6px;border-radius:2px;transform:rotate(-2deg);transform-origin:left center;background:rgba(239,230,208,.35)}
.stamp.grey{color:#6a5d4c;border-color:#6a5d4c}
.cf-card.off .cf-cost{opacity:.78}
.cf-onf{position:absolute;right:4px;top:-3px;z-index:2;font:700 16px/18px "Courier Prime";letter-spacing:-.3px;color:#2f2f2f;padding:0 6px;background:#f6f1e4;border:1.5px solid #5c5c5c;border-radius:10px;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.cf-card.active{outline:3px solid var(--amber);outline-offset:2px}

/* requisition form */
.fm{position:absolute;left:880px;top:20px;width:652px;height:840px;padding:20px 22px;background:var(--paper);
  background-image:linear-gradient(rgba(239,230,208,.9),rgba(239,230,208,.9)),url(assets/tex_grid_graphpaper_aged_512.png);background-size:auto,512px;
  box-shadow:3px 5px 0 rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.15)}
.fm-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px double var(--print);padding-bottom:10px}
.fm-formno{font:600 14px/18px "IBM Plex Sans Condensed";letter-spacing:2px;color:var(--print)}
.fm-title{font:700 25px/30px Oswald;letter-spacing:1px;color:var(--print);text-transform:uppercase}
.fm-month{text-align:right}
.fm-month .lbl{font:600 14px/18px "IBM Plex Sans Condensed";letter-spacing:2px;color:var(--print)}
.fm-month .val{margin-top:2px;font:700 24px/30px "Courier Prime";color:var(--ink);border-bottom:1.5px solid var(--print);padding:0 4px}
.fm-hrs{padding:12px 0 10px;border-bottom:1.5px solid var(--print)}
.fm-hrow{display:flex;align-items:center;height:38px}
.fm-hl{width:128px;white-space:nowrap;font:700 16px/18px "IBM Plex Sans Condensed";letter-spacing:.4px;text-transform:uppercase}
.fm-boxes{display:flex;gap:4px;width:348px}
.fm-box{width:25px;height:25px;border:1.5px solid var(--print);background:rgba(255,255,255,.35);position:relative}
.fm-box.used.pl{background:repeating-linear-gradient(135deg,var(--plan-fill) 0 4px,#c78f2c 4px 7px);border-color:var(--plan)}
.fm-box.used.op{background:repeating-linear-gradient(135deg,var(--op-fill) 0 4px,#2f8580 4px 7px);border-color:var(--op)}
.fm-hfree{margin-left:auto;font:700 16px/20px "Courier Prime";white-space:nowrap}
.fm-hfree.zero{color:var(--red)}
.fm-res{display:flex;align-items:center;gap:10px}
.fm-resbox{width:52px;height:30px;border:1.5px solid var(--print);background:rgba(255,255,255,.45);font:700 18px/27px "Courier Prime";text-align:center}
.fm-btn{width:32px;height:30px;border:1.5px solid var(--print);border-radius:2px;font:700 18px/26px "Courier Prime";color:var(--print);background:rgba(255,255,255,.35)}
.fm-reslbl{font:500 15px/18px "IBM Plex Sans Condensed";color:var(--ink2)}
.fm-tbl{margin-top:8px}
.fm-th,.fm-tr{display:grid;grid-template-columns:36px 68px 1fr 88px 84px 32px;align-items:center}
.fm-th .ord{padding-left:6px}
.fm-th{height:24px;font:700 14px/18px "IBM Plex Sans Condensed";letter-spacing:1.5px;color:var(--print);text-transform:uppercase;border-bottom:1.5px solid var(--print)}
.fm-tr{height:30px;border-bottom:1px solid var(--print-soft)}
.fm-no{font:600 16px/18px "IBM Plex Sans Condensed";color:var(--print);text-align:center}
.fm-mv{display:flex;gap:4px;padding-left:6px}
.fm-mv button{width:26px;height:26px;border:1px solid var(--print-soft);border-radius:2px;font:700 16px/18px "Courier Prime";color:var(--print)}
.fm-it{font:700 16px/20px "Courier Prime";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px;padding-right:8px}
.fm-it small{font:500 14px/18px "IBM Plex Sans Condensed";color:var(--ink2);margin-left:4px}
.fm-hr,.fm-co{font:400 16px/20px "Courier Prime";white-space:nowrap}
.fm-co{text-align:right;padding-right:8px}
.fm-x{width:26px;height:24px;border:1px solid var(--print-soft);border-radius:2px;font:700 16px/20px "Courier Prime";color:var(--red);justify-self:center}
.fm-tot{display:flex;justify-content:flex-end;gap:22px;height:32px;align-items:center;border-top:3px double var(--print);margin-top:-1px;padding-right:40px}
.fm-tot .lab{font:700 14px/18px "IBM Plex Sans Condensed";letter-spacing:2px;color:var(--print)}
.fm-tot .v{font:700 16px/20px "Courier Prime";white-space:nowrap}
.fm-sec{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--print);padding-bottom:3px}
.fm-sec span{font:700 14px/18px "IBM Plex Sans Condensed";letter-spacing:2px;color:var(--print);text-transform:uppercase}
.fm-ruler{display:grid;grid-template-columns:repeat(4,1fr);width:220px}
.fm-ruler span{font:600 14px/18px "IBM Plex Sans Condensed";letter-spacing:1px;color:var(--print);border-left:1px solid var(--print-soft);padding-left:4px}
.fm-uw{display:grid;grid-template-columns:190px 1fr 220px;height:38px;align-items:center;border-bottom:1px solid var(--print-soft)}
.fm-uw .nm{font:700 16px/20px "Courier Prime"}
.fm-uw .nm small{font:500 14px/18px "IBM Plex Sans Condensed";color:var(--ink2);margin-left:6px}
.fm-gantt{position:relative;height:26px;display:grid;grid-template-columns:repeat(4,1fr)}
.fm-gantt i{border-left:1px solid var(--print-soft)}
.fm-bar{position:absolute;top:4px;height:18px;border-radius:2px;background:repeating-linear-gradient(90deg,#8d7a5e 0 6px,#a08b6a 6px 8px)}
.fm-bar b{position:absolute;right:-1px;top:-3px;width:4px;height:24px;background:var(--ink)}
.fm-dt{font:400 16px/20px "Courier Prime";color:var(--ink);white-space:nowrap;text-align:right;padding-right:14px}
.fm-none{font:400 16px/38px "Courier Prime";color:var(--ink2);border-bottom:1px solid var(--print-soft)}

/* side shelf */
.sd{position:absolute;left:1548px;top:20px;width:348px;height:840px}
.sd-tray{height:142px;border-radius:4px;padding:10px 14px;position:relative;
  background:linear-gradient(180deg,#5b5f5c,#4a4e4b);border:3px solid #333634;box-shadow:inset 0 3px 8px rgba(0,0,0,.45),2px 4px 0 rgba(0,0,0,.3)}
.sd-tray-l{font:700 15px/18px "IBM Plex Sans Condensed";letter-spacing:2px;color:#e6e2d8;text-transform:uppercase;display:flex;justify-content:space-between}
.sd-tray-l span:last-child{letter-spacing:1px;font-weight:500;color:#cfcabd}
.sd-slip{margin-top:10px;height:78px;background:var(--paper);padding:8px 12px;box-shadow:1px 2px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:center;text-align:left;width:100%}
.sd-slip .t{font:700 17px/21px "Courier Prime";color:var(--ink)}
.sd-slip .s{font:500 15px/19px "IBM Plex Sans Condensed";color:var(--ink2)}
.sd-empty{margin-top:10px;height:78px;border:2px dashed rgba(230,226,216,.35);display:flex;align-items:center;justify-content:center;font:500 15px/18px "IBM Plex Sans Condensed";color:#cfcabd;letter-spacing:1px}
.sd-shelf{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sd-obj{height:118px;padding:10px 12px;border-radius:3px;text-align:left;display:flex;flex-direction:column;box-shadow:2px 3px 0 rgba(0,0,0,.35);position:relative}
.sd-obj .t{font:700 19px/22px Oswald;letter-spacing:.8px;text-transform:uppercase}
.sd-obj .s{margin-top:auto;font:500 15px/19px "IBM Plex Sans Condensed"}
.sd-led .s{display:flex;justify-content:space-between;align-items:flex-end;width:100%}
.sd-staff{background:var(--manila);color:#2e2312;clip-path:polygon(0 10px,8% 10px,12% 0,42% 0,46% 10px,100% 10px,100% 100%,0 100%);padding-top:18px;box-shadow:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.35))}
.sd-staff .k{top:18px}
.sd-cat{background:linear-gradient(90deg,#284a68 0 10px,#33608a 10px);color:#eef1f4}
.sd-led{background:linear-gradient(90deg,#1f3d2e 0 14px,#2f5a43 14px);color:#eae6d2}
.sd-led .t{border-bottom:1px solid rgba(234,230,210,.4);padding-bottom:4px}
.sd-gd{background:linear-gradient(90deg,#6a1f1a 0 14px,#8a2b23 14px);color:#f4e7dc}
.sd-rq{margin-top:14px;height:84px;padding:8px 12px;border-radius:3px;background:linear-gradient(180deg,#5a4430,#4b3828);border:2px solid #2f2218;box-shadow:2px 3px 0 rgba(0,0,0,.3)}
.sd-rq-l{font:700 15px/18px "IBM Plex Sans Condensed";letter-spacing:2px;color:#ecdcbf;text-transform:uppercase}
.sd-rq-row{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sd-rq-row button{height:40px;border:2px solid #c9b48c;border-radius:3px;font:600 17px/36px Oswald;letter-spacing:1px;color:#ecdcbf;text-transform:uppercase;background:rgba(0,0,0,.12)}
.sd-rq-row button.on{background:var(--paper);color:var(--red);border-color:var(--paper);box-shadow:inset 0 0 0 2px var(--red)}
.sd-tools{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sd-tools button{height:44px;border-radius:3px;font:600 17px/40px "IBM Plex Sans Condensed";color:#2e2312;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:2px 3px 0 rgba(0,0,0,.3)}
.sd-pencil{background:linear-gradient(180deg,#e5b94a,#c99a2b);border:2px solid #7d5c16}
.sd-eraser{background:linear-gradient(180deg,#e8a7a0,#cf8a83);border:2px solid #84463f}
.sd-commit{position:absolute;left:0;right:0;bottom:0;height:214px}
.sd-handle{position:absolute;left:50%;top:0;margin-left:-60px;width:120px;height:44px;border-radius:22px 22px 6px 6px;background:linear-gradient(180deg,#8b5e34,#5d3d1f);border:2px solid #3b2612;box-shadow:inset 0 2px 0 rgba(255,220,170,.35)}
.sd-stamp{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:6px;padding:14px 18px;text-align:center;
  background:linear-gradient(180deg,#7a5230,#5b3b1f);border:3px solid #3b2612;box-shadow:3px 5px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,170,.3)}
.sd-face{height:132px;border-radius:3px;background:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px #e8c9b8,inset 0 0 0 6px var(--red),inset 0 0 0 8px #e8c9b8}
.sd-face .t{font:700 27px/34px Oswald;letter-spacing:2px;color:#fbf1e6;text-transform:uppercase}
.sd-face .key{color:#fbf1e6;margin-top:4px}
.sd-note{margin-top:10px;font:600 16px/20px "IBM Plex Sans Condensed";color:#f2e2c4;letter-spacing:.5px}

/* ---------- WATCH ---------- */
.wt-scene{position:absolute;left:0;top:200px;width:1920px;height:560px;background:url(assets/office_wide_dawn.webp) center 55%/cover;overflow:hidden}
.wt-scene::before{content:"";position:absolute;inset:0;background:var(--doomwash)}
.wt-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,18,22,.55),rgba(30,18,22,.15) 40%,rgba(30,18,22,.45))}

<body>
<div id="stage"></div>
<script>
(function(){
var view=(new URLSearchParams(location.search).get('view')||'m1');

var DOOM={20.0:{c:'#F6A800',wash:'rgba(246,168,0,.08)'},40.2:{c:'#E9752E',wash:'rgba(233,117,46,.16)'}};

var S={
 m1:{yr:'2017',mo:'JUL',moFull:'JULY 2017',money:'$245,000',compute:'100',research:'0',papers:'0',rep:50,doom:20.0,
   ruler:['JUL','AUG','SEP','OCT'],plan:[12,0],op:[8,0],reserve:0,lines:[],uw:[],tray:null,staff:['Founder only','no hires yet'],held:20,
   totals:null},
 m5:{yr:'2017',mo:'NOV',moFull:'NOVEMBER 2017',money:'$140,000',compute:'65',research:'-12',papers:'0',rep:32,doom:40.2,
   ruler:['NOV','DEC','JAN','FEB'],rising:1,plan:[12,12],op:[8,3],reserve:0,staff:['Founder + 1','R. Okafor, safety'],held:5,
   tray:{t:'October 2017 ledger',s:'Month review, filed 31 Oct'},
   lines:[
    ['Go to Meetups','Scouting','1 op','$300'],
    ['Hire: Safety Researcher','','1 plan','$60,000'],
    ['Read the Literature','Scouting','1 plan',''],
    ['Work Your Connections','','2 op','6 rep'],
    ['Post Online','Scouting','1 plan',''],
    ['Read the Literature','Scouting','1 plan',''],
    ['Desperation Lever','Financing','1 plan',''],
    ['Read the Literature','Scouting','1 plan',''],
    ['Post Online','Scouting','1 plan',''],
    ['Read the Literature','Scouting','1 plan',''],
    ['Post Online','Scouting','1 plan',''],
    ['Read the Literature','Scouting','1 plan',''],
    ['Post Online','Scouting','1 plan',''],
    ['Read the Literature','Scouting','1 plan','']],
   totals:['12 plan hr + 3 op hr','$60,300 + 6 rep'],
   uw:[['Candidate interview','Hire Staff',0,1.5,'lands mid-Dec 2017'],
       ['Paper submission','Travel',0,2.3,'decision ~Jan 2018']]}
};

function hrs(h){ // "1 op" -> coloured
  var m=h.split(' ');return m[0]+' <span class="'+(m[1]=='op'?'o':'p')+'">'+m[1]+' hr</span>';}

/* cards: [name, cost html, opts] ; opts.folder=n, st=[stamps], onf=n */
function cards(k){
  var m5=(k!='m1');
  var NP='No planning hrs';
  return [
   ['Funds',[
     {n:'Fundraising',c:'4 choices &gt;',folder:1},
     {n:'Financing',c:'7 choices &gt;',folder:1,onf:m5?1:0},
     {n:'Purchase Compute',c:'$50,000, no hours'}]],
   ['People',[
     {n:'Hire Staff',c:'7 roles &gt;<br>'+'1 <span class="p">plan hr</span> each',folder:1,st:m5?[NP]:[],onf:m5?1:0},
     {n:'Advertise a Role',c:'',st:['Coming soon'],grey:1},
     {n:'Work Your Connections',c:'2 <span class="o">op hr</span>, 6 rep',onf:m5?1:0},
     {n:'Onboard New Hires',c:'<span class="o">op hr</span> + money, varies by step',st:m5?[]:['Nobody hired']}]],
   ['Research',[
     {n:'Safety Research',c:'1 <span class="p">plan hr</span>, 10 research',st:m5?['Needs 10 research',NP]:['Needs 10 research']},
     {n:'Capability Research',c:'1 <span class="p">plan hr</span>, 10 research',st:m5?['Needs 10 research',NP]:['Needs 10 research']},
     {n:'Publish Safety Paper',c:'1 <span class="p">plan hr</span>, 20 research',st:m5?['Needs 20 research',NP]:['Needs 20 research']}]
     .concat(m5?[{n:'Safety Audit',c:'2 <span class="o">op hr</span>, $40,000'}]:[])],
   ['Outreach',[
     {n:'Scouting',c:'3 choices &gt;',folder:1,onf:m5?11:0,id:'scouting'},
     {n:'Travel &amp; Conferences',c:'4 choices &gt;',folder:1},
     {n:'Publicity',c:'5 choices &gt;',folder:1}]],
   ['The lab',[
     {n:'Operations',c:'3 choices &gt;',folder:1},
     {n:'Office',c:'4 choices &gt;',folder:1}]
     .concat(m5?[{n:'Strategic',c:'4 choices &gt;<br><span class="cf-note">1 open now</span>',folder:1}]:[])]
  ];
}
function cardHtml(c,extra){
  var off=(c.st&&c.st.length)?' off':'';
  var h='<div class="cf-slot"><button class="cf-card'+(c.folder?' folder':'')+off+(extra||'')+'">';
  h+='<div class="cf-name">'+c.n+'</div>';
  if(c.c) h+='<div class="cf-cost'+(c.folder?' cf-open':'')+'">'+c.c+'</div>';
  if(c.d) h+='<div class="dr-desc">'+c.d+'</div>';
  h+='<div class="cf-foot"><div class="cf-st">'+(c.st||[]).map(function(s){return '<span class="stamp'+(c.grey?' grey':'')+'">'+s+'</span>';}).join('')+'</div></div>';
  return h+'</button>'+(c.onf?'<span class="cf-onf">on form '+c.onf+'</span>':'')+'</div>';
}

function wall(st,cal){
  var d=DOOM[st.doom];
  var lamps='';var lit=Math.floor(st.doom/10);
  for(var i=0;i<10;i++) lamps+='<div class="wl-lamp'+(i<lit?' on':'')+(i==9?' end':'')+'"></div>';
  var ang=Math.PI*(1-st.rep/100), cx=100, cy=80, r=66;
  var nx=cx+Math.cos(ang)*(r-8), ny=cy-Math.sin(ang)*(r-8);
  function arc(a0,a1,col,w){var x0=cx+Math.cos(Math.PI*(1-a0))*r,y0=cy-Math.sin(Math.PI*(1-a0))*r,x1=cx+Math.cos(Math.PI*(1-a1))*r,y1=cy-Math.sin(Math.PI*(1-a1))*r;
    return '<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+r+' '+r+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'" fill="none"/>';}
  var ticks='';for(var t=0;t<=10;t++){var a=Math.PI*(1-t/10);ticks+='<line x1="'+(cx+Math.cos(a)*(r-12)).toFixed(1)+'" y1="'+(cy-Math.sin(a)*(r-12)).toFixed(1)+'" x2="'+(cx+Math.cos(a)*(r+2)).toFixed(1)+'" y2="'+(cy-Math.sin(a)*(r+2)).toFixed(1)+'" stroke="#4a4238" stroke-width="'+(t%5?1.5:2.5)+'"/>';}
  var svg='<svg width="200" height="104" viewBox="0 0 200 104">'+arc(0,1,'#b9ab8e',8)+arc(0,0.1,'#b02a22',8)+ticks+
    '<text x="26" y="100" font-family="IBM Plex Sans Condensed" font-weight="700" font-size="14" fill="#b02a22">0</text>'+
    '<text x="150" y="100" font-family="IBM Plex Sans Condensed" font-weight="700" font-size="14" fill="#4a4238">100</text>'+
    '<line x1="'+cx+'" y1="'+cy+'" x2="'+nx.toFixed(1)+'" y2="'+ny.toFixed(1)+'" stroke="#24201b" stroke-width="4" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="7" fill="#24201b"/></svg>';
  var blinds=cal&&cal.blinds; cal=cal||{top:st.yr,mid:st.mo,sub:'Plan'};
  return '<header class="wl" style="--doomc:'+d.c+';--doomwash:'+d.wash+'">'+
   '<div class="wl-cal"><div class="wl-cal-pin"></div><div class="wl-cal-yr">'+cal.top+'</div><div class="wl-cal-mo">'+cal.mid+'</div><div class="wl-cal-sub">'+cal.sub+'</div></div>'+
   '<div class="wl-acc">'+
    plq('Money',st.money,236,'')+plq('Compute',st.compute,132,'')+
    plq('Research',st.research,132,st.research.charAt(0)=='-'?'[!] below 0':'',st.research.charAt(0)=='-')+
    plq('Papers',st.papers,132,'')+'</div>'+
   '<div class="wl-doom"><div class="wl-doom-l"><span>P(DOOM)</span></div><div class="wl-doom-scr"><span class="wl-doom-v">'+st.doom.toFixed(1)+'%</span>'+(st.rising?'<span class="wl-doom-r">RISING</span>':'')+'</div><div class="wl-doom-lamps">'+lamps+'</div></div>'+
   '<div class="wl-win'+(cal&&cal.blinds?' blinds':'')+'"></div>'+
   '<div class="wl-rep"><div class="wl-rep-top"><span class="wl-rep-l">Reputation</span><span class="wl-rep-v">'+Math.round(st.rep)+'</span></div>'+svg+'</div>'+
  '</header>';
}
function plq(l,v,w,note,neg){
  return '<div class="wl-plq" style="width:'+w+'px"><div class="wl-plq-l">'+l+'</div><div class="wl-plq-win'+(neg?' neg':'')+'">'+v+'</div><div class="wl-plq-n'+(note?' flag':'')+'">'+note+'</div></div>';
}

function tray(k,opts){
  var rows=cards(k), n=0;
  var h='<section class="cf"><div class="cf-hd"><span class="cf-plate">ACTION CARDS</span><span class="cf-count">'+rows.reduce(function(a,r){return a+r[1].length;},0)+' on file</span></div><div class="cf-rows">';
  rows.forEach(function(r){
    h+='<div class="cf-row"><div class="cf-div"><span>'+r[0]+'</span></div><div class="cf-slots">';
    r[1].forEach(function(c){h+=cardHtml(c,(opts&&opts.active==c.id)?' active':'');});
    h+='</div></div>';
  });
  return h+'</div></section>';
}

function form(st){
  var h='<section class="fm"><div class="fm-top"><div><div class="fm-formno">FORM A-20 / FOUNDER\'S OFFICE</div><div class="fm-title">Schedule of the month</div></div>'+
   '<div class="fm-month"><div class="lbl">MONTH</div><div class="val">'+st.moFull+'</div></div></div>';
  function boxes(tot,used,cls){var b='';for(var i=0;i<tot;i++)b+='<div class="fm-box'+(i<used?' used '+cls:'')+'"></div>';return b;}
  var pf=st.plan[0]-st.plan[1], of=st.op[0]-st.op[1];
  h+='<div class="fm-hrs">'+
   '<div class="fm-hrow"><div class="fm-hl" style="color:var(--plan)">Planning hrs</div><div class="fm-boxes">'+boxes(12,st.plan[1],'pl')+'</div><div class="fm-hfree'+(pf==0?' zero':'')+'">'+pf+' of 12 free</div></div>'+
   '<div class="fm-hrow"><div class="fm-hl" style="color:var(--op)">Operating hrs</div><div class="fm-boxes">'+boxes(8,st.op[1],'op')+'</div><div class="fm-hfree">'+of+' of 8 free</div></div>'+
   '<div class="fm-hrow"><div class="fm-hl" style="color:var(--ink2)">Reserve</div><div class="fm-res"><div class="fm-resbox">'+st.reserve+'</div><button class="fm-btn">-</button><button class="fm-btn">+</button><span class="fm-reslbl">hrs set aside</span></div></div>'+
  '</div>';
  h+='<div class="fm-tbl"><div class="fm-th"><span style="text-align:center">No.</span><span class="ord">Order</span><span style="padding-left:4px">Item</span><span>Hours</span><span style="text-align:right;padding-right:8px">Cost</span><span></span></div>';
  for(var i=0;i<14;i++){
    var L=st.lines[i];
    if(L){
      h+='<div class="fm-tr"><span class="fm-no">'+(i+1)+'</span><span class="fm-mv"><button>^</button><button>v</button></span><span class="fm-it">'+L[0]+(L[1]?'<small>'+L[1]+'</small>':'')+'</span><span class="fm-hr">'+hrs(L[2])+'</span><span class="fm-co">'+L[3]+'</span><button class="fm-x">x</button></div>';
    } else h+='<div class="fm-tr"><span class="fm-no">'+(i+1)+'</span><span></span><span></span><span></span><span></span><span></span></div>';
  }
  h+='</div><div class="fm-tot"><span class="lab">TOTALS</span><span class="v">'+(st.totals?st.totals[0]:'--')+'</span><span class="v">'+(st.totals?st.totals[1]:'--')+'</span></div>';
  h+='<div class="fm-sec"><span>Under way -- carried forward</span><div class="fm-ruler">'+st.ruler.map(function(m){return '<span>'+m+'</span>';}).join('')+'</div></div>';
  if(!st.uw.length) h+='<div class="fm-none">-- none --</div>';
  st.uw.forEach(function(u){
    h+='<div class="fm-uw"><span class="nm">'+u[0]+'</span><span class="fm-dt">'+u[4]+'</span><div class="fm-gantt"><i></i><i></i><i></i><i></i>'+
      '<div class="fm-bar" style="left:0;width:'+Math.round(u[3]*55)+'px"><b></b></div></div></div>';
  });
  return h+'</section>';
}

function side(st,commit){
  var h='<aside class="sd"><div class="sd-tray"><div class="sd-tray-l"><span>In-tray</span><span>'+(st.tray?'1 slip':'')+'</span></div>'+
   (st.tray?'<button class="sd-slip"><span class="t">'+st.tray.t+'</span><span class="s">'+st.tray.s+'</span></button>':'<div class="sd-empty">empty</div>')+'</div>'+
   '<div class="sd-shelf">'+
    '<button class="sd-obj sd-staff"><span class="t">Staff file</span><span class="s"><b>'+st.staff[0]+'</b><br>'+st.staff[1]+'</span></button>'+
    '<button class="sd-obj sd-cat"><span class="t">Upgrades</span><span class="s">Supply catalogue<br>7 items, $0 - $800,000</span></button>'+
    '<button class="sd-obj sd-led"><span class="t">Liability ledger</span><span class="s"><span>Bound ledger</span><span class="key">L</span></span></button>'+
    '<button class="sd-obj sd-gd"><span class="t">Player guide</span><span class="s">Staff handbook</span></button>'+
   '</div>'+
   '<div class="sd-rq"><div class="sd-rq-l">Research quality</div><div class="sd-rq-row"><button>Rushed</button><button class="on">Standard</button><button>Thorough</button></div></div>'+
   '<div class="sd-tools"><button class="sd-pencil">Undo <span class="key">Z</span></button><button class="sd-eraser">Clear form <span class="key">C</span></button></div>';
  return h+(commit||stamp('Commit the month','Enter','Held for events: '+st.held+' hr'))+'</aside>';
}
function stamp(t,k,note,cls){
  return '<div class="sd-commit '+(cls||'')+'"><button class="sd-stamp"><div class="sd-face"><span class="t">'+t+'</span><span class="key">'+k+'</span></div><div class="sd-note">'+note+'</div></button></div>';
}

function operator(){
  var rim=' stroke="#d08a44" stroke-opacity=".55" stroke-width="3"';
  return '<svg class="wt-op" viewBox="0 0 470 400" xmlns="http://www.w3.org/2000/svg">'+
   '<rect x="138" y="176" width="168" height="230" rx="34" fill="#2e2023"'+rim.replace('.55','.3')+'/>'+
   '<path d="M62 400 C72 304 128 262 222 256 C316 262 372 304 382 400 Z" fill="#170f12"'+rim+'/>'+
   '<rect x="202" y="214" width="40" height="48" fill="#170f12"/>'+
   '<ellipse cx="222" cy="176" rx="46" ry="56" fill="#170f12"'+rim+'/>'+
   '<path d="M0 400 L0 368 Q70 350 130 362 L130 400 Z M470 400 L470 362 Q410 350 350 362 L350 400Z" fill="#3a2a1e"/>'+
  '</svg>';
}

function watch(st0){
  // Fixture: the game executes the committed batch and publishes state before playback.
  // m5 opens at $140,000 / research -12 / rep 32. The 14 rows: -$60,300; Read x6 +18 research;
  // Meetups +1.5 rep, Connections -6 rep, Post Online x4 -4 rep (+16 hype); Hire adds staff.
  var st=Object.assign({},st0,{money:'$79,700',research:'6',rep:23.5});
  var d=DOOM[st.doom];
  var rows=S.m5.lines;
  var h=wall(st,{top:'NOV 2017',mid:'9',sub:'day of 30',blinds:1});
  h+='<div class="wt-scene" style="--doomwash:'+d.wash+'">'+operator()+'</div>';
  h+='<div class="ev"><div class="ev-clip"></div><div class="ev-h"><div class="from">Memo<b>9 Nov 2017</b></div><span class="stamp" style="font-size:17px;line-height:22px">Needs answer</span></div>'+
     '<div class="ev-body"><div><div class="ev-t">Talent Opportunity</div><div class="ev-d">A brilliant researcher wants to join your lab at <mark>reduced cost</mark>!</div></div><div class="ev-ph"></div></div>'+
     '<div class="ev-ask">Tick one</div>'+
     '<button class="ev-ch"><span class="n">[1]</span><span class="nm">Fast-Track Hiring</span><span class="c">$25,000 + 1 held hr</span></button>'+
     '<button class="ev-ch"><span class="n">[2]</span><span class="nm">Standard Hiring</span><span class="c">$25,000 + 1 held hr</span></button>'+
     '<button class="ev-ch"><span class="n">[3]</span><span class="nm">Decline Offer</span><span class="c">free</span></button></div>';
  h+='<div class="wt-desk"><div class="wt-sched"><div class="wt-sched-h"><span class="t">Schedule of the month -- November 2017</span><span class="wt-filed">COMMITTED</span></div><div class="wt-list">';
  rows.forEach(function(r,i){h+='<div class="wt-li done"><span class="bx">x</span><span class="nm">'+(i+1)+'. '+r[0]+'</span><span class="dt">1 Nov</span></div>';});
  h+='</div><div class="wt-uw">Carried forward: <b>candidate interview</b> lands mid-Dec 2017 / <b>paper submission</b> decision ~Jan 2018</div></div>';
  h+='<div class="wt-tape"><div class="wt-tape-h">Teleprinter -- the month so far</div>'+
     ['<b>01 Nov</b>Go to Meetups -- +1.5 reputation','<b>01 Nov</b>Hire: Safety Researcher -- hired','<b>01 Nov</b>Work Your Connections -- -6 rep (favour)',
      '<b>01 Nov</b>Read the Literature x6 -- +18 research','<b>01 Nov</b>Post Online x4 -- +16 hype, -4 rep','<b>01 Nov</b>Desperation Lever -- brief reprieve now'].map(function(l){return '<div class="wt-ln">'+l+'</div>';}).join('')+
     '<div class="wt-ln hot"><b>09 Nov</b>MEMO: Talent Opportunity -- paused</div></div>';
  h+='<div class="wt-ctl"><div class="wt-face"><span class="t">Paused</span><span class="s">awaiting your reply</span></div>'+
     '<div class="wt-spd"><button>&gt; 1x</button><button class="on">&gt;&gt; 2x</button><button>&gt;&gt;&gt; 4x</button></div>'+
     '<div class="wt-held"><span>Held for events</span><b>5 hr</b></div></div></div>';
  return h;
}

function ledger(){
  var st=S.m5;
  var h=wall(st,{top:'OCT 2017',mid:'31',sub:'month closed',blinds:1});
  h+='<div class="wt-scene" style="--doomwash:'+DOOM[40.2].wash+'">'+operator()+'</div>';
  h+='<div class="wt-desk"></div><div class="lg-dim"></div>';
  function r(a,b,cls,neg){return '<div class="lg-r '+(cls||'')+'"><span>'+a+'</span><span class="'+(neg?'neg':'')+'">'+b+'</span></div>';}
  h+='<div class="lg"><div class="lg-h"><div class="a">FOUNDER\'S OFFICE -- MONTH LEDGER</div><div class="b">October 2017</div></div>'+
   '<div class="lg-g"><div><div class="lg-sec">Money</div>'+r('Opened','$188,400')+r('Plan items','-$32,300','',1)+r('Running costs','-$16,100','',1)+r('Closed','$140,000','tot')+
     '</div><div><div class="lg-sec">Founder\'s hours</div>'+r('On the plan','18 of 20')+r('Held for events','2')+r('Used on events','1')+r('Unspent','1','tot')+'</div></div>'+
   '<div class="lg-sec">The lab at close</div><div class="lg-g"><div>'+r('Compute','80 -> 65')+r('Research','6 -> -12','',1)+'</div><div>'+r('Papers','0 -> 0')+r('Reputation','41 -> 32','',1)+'</div></div>'+
   '<div class="lg-sec">Staff</div>'+r('Founder + 1','R. Okafor, safety; joined 21 Oct')+
   '<div class="lg-sec">Work landed and events</div>'+
   ['<b>04 Oct</b>Read the Literature -- done','<b>09 Oct</b>Submit Paper -- sent; decision ~Jan 2018','<b>14 Oct</b>MEMO: Compute Partnership -- declined','<b>21 Oct</b>Hire: Safety Researcher -- R. Okafor joined','<b>27 Oct</b>Interview booked -- lands mid-Dec 2017'].map(function(l){return '<div class="lg-w">'+l+'</div>';}).join('')+
   '<div class="lg-doom"><span>P(DOOM) AT CLOSE</span><span>40.2%</span></div></div>';
  h+='<button class="lg-back">Look back over October <span class="key">Esc</span></button>';
  h+='<div class="sd" style="z-index:6;top:220px">'+stamp('File the ledger','Enter','next: plan November 2017')+'</div>';
  return h;
}

function door(){
  var st=S.m5;
  var h=wall(st)+'<main class="desk">'+tray('m5',{active:'scouting'})+form(st)+side(st)+'</main>';
  // folder opens out to the right of the Scouting card (row 4, col 1), over the rest of rows 4-5
  var NP='No planning hrs';
  var sub=[
   {n:'Go to Meetups',c:'1 <span class="o">op hr</span>, $300',onf:1,d:'Drinks, badges, a talk you half-listen to.'},
   {n:'Read the Literature',c:'1 <span class="p">plan hr</span>',onf:6,st:[NP],d:'Sit down with the arxiv firehose.'},
   {n:'Post Online',c:'1 <span class="p">plan hr</span>',onf:4,st:[NP],d:'Be loud. Hype is not respect.'}];
  h+='<div class="dr" style="left:268px;top:740px;width:584px;height:302px">'+
     '<div class="dr-h"><span class="t">Scouting<small>3 choices</small></span><button class="dr-x">Close <span class="key">Esc</span></button></div>'+
     '<div class="dr-cards">'+sub.map(function(c){return cardHtml(c);}).join('')+'</div></div>';
  return h;
}

var stage=document.getElementById('stage');
if(view=='watch') stage.innerHTML=watch(S.m5);
else if(view=='place2') stage.innerHTML=ledger();
else if(view=='door') stage.innerHTML=door();
else { var st=S[view]||S.m1; stage.innerHTML=wall(st)+'<main class="desk">'+tray(view=='m5'?'m5':'m1')+form(st)+side(st)+'</main>'; }
})();
</script>
</body>
</html>
